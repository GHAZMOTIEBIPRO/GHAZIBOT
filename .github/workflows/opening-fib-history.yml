name: GHAZI RADAR - Opening Fibonacci Historical Replay (owner private)

# Manual only. Replays the fixed opening-Fibonacci rule over the last N completed sessions on Alpaca SIP
# bars and sends one aggregate report to the owner's private chat (scripts/run_opening_fib_history.py).
# Nothing is stored or committed; the log carries a status line only.
on:
  workflow_dispatch:
    inputs:
      sessions:
        description: "Completed sessions to replay (2-120)"
        type: number
        default: 60
      dry_run:
        description: "Compute only; no Telegram delivery"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ghazi-opening-fib-history
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_BARS_FEED: ${{ vars.ALPACA_BARS_FEED || 'sip' }}
      ALPACA_INTERNAL_DATA_USE_AUTHORIZED: ${{ vars.ALPACA_INTERNAL_DATA_USE_AUTHORIZED || 'false' }}
      ALPACA_PRIVATE_ALERTS_AUTHORIZED: ${{ vars.ALPACA_PRIVATE_ALERTS_AUTHORIZED || 'false' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      TELEGRAM_OWNER_USERNAME: ${{ vars.TELEGRAM_OWNER_USERNAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          path: app
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Replay the fixed rule (status only in the log)
        shell: bash
        env:
          PYTHONPATH: app
          INPUT_SESSIONS: ${{ inputs.sessions }}
          INPUT_DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          [[ "$INPUT_SESSIONS" =~ ^[0-9]+$ ]] || { echo "::error::sessions must be a number"; exit 1; }
          args=(--universe app/data/universe.txt --sessions "$INPUT_SESSIONS")
          if [[ "$INPUT_DRY" != "false" ]]; then args+=(--dry-run); fi
          python -m scripts.run_opening_fib_history "${args[@]}"
