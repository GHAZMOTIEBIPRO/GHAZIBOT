name: BLACK BOX Explosion Options Cross-Check

on:
  workflow_dispatch: {}
  workflow_run:
    workflows:
      - "BLACK BOX Omega Fast Explosion Radar"
    types:
      - completed

concurrency:
  group: black-box-explosion-options-crosscheck
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  crosscheck:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Syntax probe
        run: echo "crosscheck workflow parsed"
