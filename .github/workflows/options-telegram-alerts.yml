name: BLACK BOX Omega Options Telegram Alerts

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "BLACK BOX Omega Options Contract Radar"
    types: [completed]

concurrency:
  group: black-box-omega-options-telegram
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  notify-options:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPTIONS_ALERT_MIN_SCORE: ${{ secrets.OPTIONS_ALERT_MIN_SCORE || '65' }}
      OPTIONS_ALERT_MAX: ${{ secrets.OPTIONS_ALERT_MAX || '4' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telegram dependency
        run: pip install 'requests>=2.32,<3.0'

      - name: Restore persistent Telegram destination
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p telegram_runtime
          for workflow in options-telegram-alerts.yml stock-telegram-alerts.yml telegram-alerts.yml fast-explosion-radar.yml; do
            for run_id in $(gh run list --workflow "$workflow" --status success --branch main --limit 12 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              rm -f telegram_runtime/connection.enc telegram_runtime/connection.json
              if gh run download "$run_id" -n telegram-connection -D telegram_runtime >/dev/null 2>&1; then
                [[ -s telegram_runtime/connection.enc ]] && break 2
              fi
            done
          done
          if [[ -s telegram_runtime/connection.enc && -n "$TELEGRAM_BOT_TOKEN" ]]; then
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in telegram_runtime/connection.enc \
              -out telegram_runtime/connection.json \
              -pass env:TELEGRAM_BOT_TOKEN || rm -f telegram_runtime/connection.json
          fi

      - name: Resolve Telegram destination
        run: python scripts/telegram_connection_bootstrap.py --connection-path telegram_runtime/connection.json

      - name: Restore independent options payload
        id: payload
        if: env.TELEGRAM_READY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .options-payload data/live
          current=""
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            current="${{ github.event.workflow_run.id }}"
          fi
          if [[ -n "$current" ]]; then
            gh run download "$current" -n independent-options-radar -D .options-payload >/dev/null 2>&1 || true
          fi
          if [[ ! -s .options-payload/options_latest.json ]]; then
            for run_id in $(gh run list --workflow options-contract-radar.yml --status success --branch main --limit 6 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              rm -rf .options-payload && mkdir -p .options-payload
              if gh run download "$run_id" -n independent-options-radar -D .options-payload >/dev/null 2>&1; then
                [[ -s .options-payload/options_latest.json ]] && break
              fi
            done
          fi
          if [[ -s .options-payload/options_latest.json ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Live options payload available."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No live options payload exists (market may be closed); Telegram will skip cleanly."
          fi

      - name: Restore options Telegram state
        if: env.TELEGRAM_READY == 'true' && steps.payload.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .options-telegram-state
          for run_id in $(gh run list --workflow options-telegram-alerts.yml --status success --branch main --limit 8 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            rm -rf .options-telegram-state && mkdir -p .options-telegram-state
            if gh run download "$run_id" -n options-telegram-state -D .options-telegram-state >/dev/null 2>&1; then
              if [[ -s .options-telegram-state/options_alert_state.json ]]; then
                cp .options-telegram-state/options_alert_state.json data/live/options_telegram_alert_state.json
                break
              fi
            fi
          done

      - name: Send options-only Arabic alerts
        if: env.TELEGRAM_READY == 'true' && steps.payload.outputs.ready == 'true'
        run: >-
          python scripts/send_independent_path_alerts.py
          --path options
          --payload .options-payload/options_latest.json
          --state data/live/options_telegram_alert_state.json

      - name: Upload options Telegram state
        if: env.TELEGRAM_READY == 'true' && steps.payload.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: options-telegram-state
          path: data/live/options_telegram_alert_state.json
          if-no-files-found: error
          retention-days: 30

      - name: Closed-market or no-payload status
        if: env.TELEGRAM_READY == 'true' && steps.payload.outputs.ready != 'true'
        run: echo "Options Telegram skipped because no fresh independent options payload exists."

      - name: Seal Telegram destination
        if: always() && env.TELEGRAM_READY == 'true'
        shell: bash
        run: |
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in telegram_runtime/connection.json \
            -out telegram_runtime/connection.enc \
            -pass env:TELEGRAM_BOT_TOKEN
          rm -f telegram_runtime/connection.json

      - name: Upload encrypted Telegram destination
        if: always() && env.TELEGRAM_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-connection
          path: telegram_runtime/connection.enc
          if-no-files-found: error
          retention-days: 90
