name: BLACK BOX Omega Options Telegram Alerts - Manual Fallback

# Production delivery now happens directly inside options-contract-radar.yml
# after validation. This workflow remains manual-only as a recovery tool and
# must not create a second workflow_run delivery hop or duplicate direct alerts.

on:
  workflow_dispatch:

concurrency:
  group: black-box-omega-options-telegram-fallback
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  notify-options-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPTIONS_ALERT_MIN_SCORE: ${{ secrets.OPTIONS_ALERT_MIN_SCORE || '85' }}
      OPTIONS_FREE_ALERT_MIN_SCORE: ${{ secrets.OPTIONS_FREE_ALERT_MIN_SCORE || '87' }}
      OPTIONS_FREE_ALERTS_ENABLED: ${{ secrets.OPTIONS_FREE_ALERTS_ENABLED || 'true' }}
      OPTIONS_ALERT_MAX: ${{ secrets.OPTIONS_ALERT_MAX || '3' }}
      OPTIONS_PAYLOAD_MAX_AGE_MINUTES: ${{ secrets.OPTIONS_PAYLOAD_MAX_AGE_MINUTES || '45' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telegram and exchange-calendar dependencies
        run: pip install 'requests>=2.32,<3.0' 'exchange-calendars>=4.13,<5.0'

      - name: Check U.S. regular session before fallback alert
        id: market
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timezone
          import exchange_calendars as xcals
          import pandas as pd

          cal = xcals.get_calendar('XNYS')
          minute = pd.Timestamp(datetime.now(timezone.utc)).floor('min')
          try:
              is_open = bool(cal.is_open_on_minute(minute))
          except Exception:
              is_open = False
          print(f"open={'true' if is_open else 'false'}")
          print(f"reason={'regular_session' if is_open else 'market_closed'}")
          PY

      - name: Restore centralized Telegram destination
        if: steps.market.outputs.open == 'true' && env.TELEGRAM_CHAT_ID == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p telegram_runtime
          for workflow in telegram-connection-keeper.yml options-contract-radar.yml options-telegram-alerts.yml; do
            for run_id in $(gh run list --workflow "$workflow" --status success --branch main --limit 8 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              rm -f telegram_runtime/connection.enc telegram_runtime/connection.json
              if gh run download "$run_id" -n telegram-connection -D telegram_runtime >/dev/null 2>&1; then
                [[ -s telegram_runtime/connection.enc ]] && break 2
              fi
            done
          done
          if [[ -s telegram_runtime/connection.enc && -n "$TELEGRAM_BOT_TOKEN" ]]; then
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in telegram_runtime/connection.enc \
              -out telegram_runtime/connection.json \
              -pass env:TELEGRAM_BOT_TOKEN || rm -f telegram_runtime/connection.json
          fi

      - name: Resolve Telegram destination
        if: steps.market.outputs.open == 'true'
        run: python scripts/telegram_connection_bootstrap.py --connection-path telegram_runtime/connection.json

      - name: Restore latest validated options payload
        id: payload
        if: env.TELEGRAM_READY == 'true' && steps.market.outputs.open == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .options-payload data/live
          for run_id in $(gh run list --workflow options-contract-radar.yml --status success --branch main --limit 6 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            rm -rf .options-payload && mkdir -p .options-payload
            if gh run download "$run_id" -n independent-options-radar -D .options-payload >/dev/null 2>&1; then
              [[ -s .options-payload/options_latest.json ]] && break
            fi
          done
          if [[ -s .options-payload/options_latest.json ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore latest direct options Telegram state
        if: env.TELEGRAM_READY == 'true' && steps.market.outputs.open == 'true' && steps.payload.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/live .options-telegram-state
          printf '{"sent":{}}\n' > data/live/options_telegram_alert_state.json
          for workflow in options-contract-radar.yml options-telegram-alerts.yml; do
            for run_id in $(gh run list --workflow "$workflow" --status success --branch main --limit 8 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              rm -rf .options-telegram-state && mkdir -p .options-telegram-state
              if gh run download "$run_id" -n options-telegram-state -D .options-telegram-state >/dev/null 2>&1; then
                if [[ -s .options-telegram-state/options_alert_state.json ]]; then
                  cp .options-telegram-state/options_alert_state.json data/live/options_telegram_alert_state.json
                  break 2
                fi
              fi
            done
          done

      - name: Send manual fallback strict option alert
        if: env.TELEGRAM_READY == 'true' && steps.market.outputs.open == 'true' && steps.payload.outputs.ready == 'true'
        run: >-
          python -m scripts.send_strict_options_alerts
          --payload .options-payload/options_latest.json
          --state data/live/options_telegram_alert_state.json

      - name: Upload fallback options Telegram state
        if: always() && env.TELEGRAM_READY == 'true' && steps.market.outputs.open == 'true' && steps.payload.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: options-telegram-state
          path: data/live/options_telegram_alert_state.json
          if-no-files-found: warn
          retention-days: 30

      - name: Closed-market status
        if: steps.market.outputs.open != 'true'
        run: echo "Manual options Telegram fallback skipped because XNYS is closed."

      - name: Open-market no-payload status
        if: env.TELEGRAM_READY == 'true' && steps.market.outputs.open == 'true' && steps.payload.outputs.ready != 'true'
        run: echo "Manual options Telegram fallback skipped because no fresh validated payload exists."
