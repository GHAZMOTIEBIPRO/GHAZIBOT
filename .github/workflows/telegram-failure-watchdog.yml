name: BLACK BOX Omega Telegram Failure Watchdog
# The relayed run id is in the title so the orchestrator relay never
# dispatches the watchdog twice for the same source run.
run-name: "Telegram Failure Watchdog · ${{ inputs.source_run_id || github.event.workflow_run.id || 'manual' }}"

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run id relayed by the orchestrator (empty = manual connectivity test)"
        type: string
        default: ""
        required: false
  workflow_run:
    workflows:
      - BLACK BOX Omega Options Contract Radar
      - BLACK BOX Omega Fast Explosion Radar
      - BLACK BOX Omega Stock Radar
      - BLACK BOX Omega Classical Direction Radar
      - BLACK BOX Standalone Intelligence V10
      - BLACK BOX Omega Radar Health
      - BLACK BOX Omega Telegram Connection Keeper
    types: [completed]

concurrency:
  group: black-box-omega-telegram-failure-watchdog
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  notify-failure:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.head_branch == 'main' &&
        (
          github.event.workflow_run.conclusion == 'failure' ||
          github.event.workflow_run.conclusion == 'timed_out' ||
          github.event.workflow_run.conclusion == 'action_required' ||
          github.event.workflow_run.conclusion == 'startup_failure' ||
          (
            github.event.workflow_run.name == 'BLACK BOX Omega Classical Direction Radar' &&
            github.event.workflow_run.conclusion == 'success'
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_NAME: ${{ github.event.workflow_run.name || 'Manual watchdog check' }}
      RUN_ID: ${{ github.event.workflow_run.id || 'manual' }}
      RUN_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id || '0' }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'manual' }}
      RUN_EVENT: ${{ github.event.workflow_run.event || 'manual' }}
      RUN_BRANCH: ${{ github.event.workflow_run.head_branch || 'manual' }}
      RUN_URL: ${{ github.event.workflow_run.html_url || format('https://github.com/{0}/actions', github.repository) }}
      WATCHDOG_SOURCE_RUN_ID: ${{ inputs.source_run_id || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telegram dependency
        run: pip install 'requests>=2.32,<3.0'

      - name: Classify failure, recovery, or obsolete event
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.telegram_watchdog_status

      - name: Restore centralized Telegram destination
        if: steps.classify.outputs.notify == 'true' && env.TELEGRAM_CHAT_ID == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p telegram_runtime
          for workflow in telegram-connection-keeper.yml options-contract-radar.yml radar-health.yml options-telegram-alerts.yml stock-telegram-alerts.yml; do
            for run_id in $(gh run list --workflow "$workflow" --status success --branch main --limit 8 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              rm -f telegram_runtime/connection.enc telegram_runtime/connection.json
              if gh run download "$run_id" -n telegram-connection -D telegram_runtime >/dev/null 2>&1; then
                [[ -s telegram_runtime/connection.enc ]] && break 2
              fi
            done
          done
          if [[ -s telegram_runtime/connection.enc && -n "$TELEGRAM_BOT_TOKEN" ]]; then
            openssl enc -d -aes-256-cbc -pbkdf2               -in telegram_runtime/connection.enc               -out telegram_runtime/connection.json               -pass env:TELEGRAM_BOT_TOKEN || rm -f telegram_runtime/connection.json
          fi

      - name: Resolve Telegram destination
        if: steps.classify.outputs.notify == 'true'
        run: python scripts/telegram_connection_bootstrap.py --connection-path telegram_runtime/connection.json

      - name: Send verified failure or recovery alert
        if: steps.classify.outputs.notify == 'true' && env.TELEGRAM_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_KIND: ${{ steps.classify.outputs.kind }}
          WATCHDOG_PREVIOUS_FAILED: ${{ steps.classify.outputs.previous_failed }}
        run: python -m scripts.telegram_watchdog_status --send

      - name: Telegram not ready
        if: steps.classify.outputs.notify == 'true' && env.TELEGRAM_READY != 'true'
        run: |
          echo "Telegram failure watchdog could not notify because the Telegram destination is not ready."
          echo "Send /start or any message to the bot once so the keeper can discover the destination."
