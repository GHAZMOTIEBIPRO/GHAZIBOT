name: GHAZI Probe — posted trial results (public registry)

# Reads ClinicalTrials.gov API v2 (public NLM data) and prints options_radar.trial_results.interpret
# for the NCT ids given (default NCT05136677). No secrets, read-only.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Space-separated NCT ids"
        default: "NCT05136677"
  push:
    paths:
      - "options_radar/trial_results.py"
      - "scripts/probe_trial_results.py"
      - "scripts/probe_sec_current.py"
      - "options_radar/sec_current_feed.py"
      - ".github/workflows/probe-trial-results.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IDS: ${{ github.event.inputs.ids || 'NCT05136677' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m scripts.probe_trial_results $IDS
      - name: SEC latest-filings feed and COGT/BBIO first-source timing (public SEC data)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m scripts.probe_sec_current
