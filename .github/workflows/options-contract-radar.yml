name: BLACK BOX Omega Options Contract Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/options-contract-radar.yml"
      - "options_radar/optionable_universe.py"
      - "options_radar/official_event_scan.py"
      - "options_radar/provider_readiness.py"
      - "options_radar/runtime_hardening.py"
      - "options_radar/free_gamma_engine.py"
      - "options_radar/occ_free_context.py"
      - "options_radar/options_consensus.py"
      - "options_radar/outcome_learning.py"
      - "options_radar/data_fabric.py"
      - "options_radar/data_fabric_runtime.py"
      - "options_radar/stream_overlay.py"
      - "scripts/run_options_radar_independent.py"
      - "scripts/run_options_radar_hardened.py"
      - "scripts/run_options_radar_fabric.py"
      - "scripts/send_strict_options_alerts.py"
      - "scripts/telegram_connection_bootstrap.py"
      - "scripts/telegram_transport.py"
      - "data/options_ping.txt"
  schedule:
    - cron: "3,18,33,48 13-21 * * 1-5"

concurrency:
  group: black-box-omega-options-contract-radar
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  scan-options:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'GHAZI Options Radar GHAZMOTIEBIPRO@users.noreply.github.com' }}
      TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
      TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL || 'https://sandbox.tradier.com' }}
      MARKETDATA_TOKEN: ${{ secrets.MARKETDATA_TOKEN }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_OPTIONS_FEED: ${{ secrets.ALPACA_OPTIONS_FEED || 'indicative' }}
      ALPACA_STOCK_FEED: ${{ secrets.ALPACA_STOCK_FEED || 'iex' }}
      OPTIONS_PROVIDER_ORDER: ${{ secrets.OPTIONS_PROVIDER_ORDER || 'tradier,marketdata,finnhub,yahoo' }}
      DAILY_PRICE_PROVIDER_ORDER: ${{ secrets.DAILY_PRICE_PROVIDER_ORDER || 'tradier,alpaca,tiingo,finnhub,twelve_data,polygon,alpha_vantage,yahoo' }}
      INTRADAY_PRICE_PROVIDER_ORDER: ${{ secrets.INTRADAY_PRICE_PROVIDER_ORDER || 'tradier,alpaca,tiingo,finnhub,twelve_data,polygon,alpha_vantage,yahoo' }}
      OPTIONS_INDEPENDENT_MAX_SYMBOLS: ${{ secrets.OPTIONS_INDEPENDENT_MAX_SYMBOLS || '60' }}
      OPTIONS_INDEPENDENT_TOP_PER_SIDE: ${{ secrets.OPTIONS_INDEPENDENT_TOP_PER_SIDE || '15' }}
      OPTIONS_FREE_GAMMA_MAX_SYMBOLS: ${{ secrets.OPTIONS_FREE_GAMMA_MAX_SYMBOLS || '10' }}
      OPTIONS_STRICT_MIN_SCORE: ${{ secrets.OPTIONS_STRICT_MIN_SCORE || '85' }}
      OPTIONS_STRICT_SIDE_EDGE: ${{ secrets.OPTIONS_STRICT_SIDE_EDGE || '6' }}
      OPTIONS_STRICT_MAX_SIGNALS: ${{ secrets.OPTIONS_STRICT_MAX_SIGNALS || '8' }}
      OPTIONS_FREE_ALERT_MIN_SCORE: ${{ secrets.OPTIONS_FREE_ALERT_MIN_SCORE || '87' }}
      OPTIONS_ALERT_MIN_SCORE: ${{ secrets.OPTIONS_ALERT_MIN_SCORE || '85' }}
      OPTIONS_FREE_ALERTS_ENABLED: ${{ secrets.OPTIONS_FREE_ALERTS_ENABLED || 'true' }}
      OPTIONS_ALERT_MAX: ${{ secrets.OPTIONS_ALERT_MAX || '3' }}
      OPTIONS_PAYLOAD_MAX_AGE_MINUTES: ${{ secrets.OPTIONS_PAYLOAD_MAX_AGE_MINUTES || '45' }}
      OPTIONS_LEARNING_MAX_SYMBOLS: ${{ secrets.OPTIONS_LEARNING_MAX_SYMBOLS || '12' }}
      OPTIONS_LEARNING_MIN_DATA_QUALITY: ${{ secrets.OPTIONS_LEARNING_MIN_DATA_QUALITY || '0.80' }}
      CALIBRATION_MINIMUM_SAMPLE: ${{ secrets.CALIBRATION_MINIMUM_SAMPLE || '100' }}
      OCC_FREE_ENABLED: ${{ secrets.OCC_FREE_ENABLED || 'true' }}
      DATA_FABRIC_HEALTH_PATH: data/live/provider_health.json
      DATA_FABRIC_MAX_WORKERS: ${{ secrets.DATA_FABRIC_MAX_WORKERS || '5' }}
      DATA_FABRIC_CIRCUIT_FAILURES: ${{ secrets.DATA_FABRIC_CIRCUIT_FAILURES || '3' }}
      DATA_FABRIC_CIRCUIT_MINUTES: ${{ secrets.DATA_FABRIC_CIRCUIT_MINUTES || '20' }}
      DATA_FABRIC_MAX_OPTION_DIVERGENCE_PCT: ${{ secrets.DATA_FABRIC_MAX_OPTION_DIVERGENCE_PCT || '0.08' }}
      DATA_FABRIC_MAX_STOCK_DIVERGENCE_PCT: ${{ secrets.DATA_FABRIC_MAX_STOCK_DIVERGENCE_PCT || '0.025' }}
      DATA_FABRIC_STREAM_SNAPSHOT: data/live/stream_snapshot.json
      DATA_FABRIC_STREAM_MAX_AGE_SECONDS: ${{ secrets.DATA_FABRIC_STREAM_MAX_AGE_SECONDS || '20' }}
      DATABASE_PATH: data/live/options_alert_state.json
      SIGNAL_JOURNAL_PATH: data/live/options_signals.jsonl
      OUTCOME_PATH: data/live/options_outcomes.json
      CALIBRATION_PATH: data/live/options_calibration.json
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Check U.S. regular session
        id: market
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timezone
          import exchange_calendars as xcals
          import pandas as pd

          cal = xcals.get_calendar('XNYS')
          now = pd.Timestamp(datetime.now(timezone.utc))
          minute = now.floor('min')
          try:
              is_open = bool(cal.is_open_on_minute(minute))
          except Exception:
              is_open = False
          print(f"open={'true' if is_open else 'false'}")
          print(f"reason={'regular_session' if is_open else 'market_closed'}")
          PY

      - name: Restore independent options state and provider health
        if: steps.market.outputs.open == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/live data/cache
          for run_id in $(gh run list --workflow options-contract-radar.yml --status success --branch main --limit 8 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            rm -rf .options-state-restore
            mkdir -p .options-state-restore
            if gh run download "$run_id" -n options-contract-state -D .options-state-restore >/dev/null 2>&1; then
              cp -f .options-state-restore/options_alert_state.json data/live/options_alert_state.json 2>/dev/null || true
              cp -f .options-state-restore/options_signals.jsonl data/live/options_signals.jsonl 2>/dev/null || true
              cp -f .options-state-restore/options_outcomes.json data/live/options_outcomes.json 2>/dev/null || true
              cp -f .options-state-restore/options_calibration.json data/live/options_calibration.json 2>/dev/null || true
              cp -f .options-state-restore/provider_health.json data/live/provider_health.json 2>/dev/null || true
              cp -f .options-state-restore/occ_optionable_universe.json data/cache/occ_optionable_universe.json 2>/dev/null || true
              echo "Restored independent options state from run $run_id."
              break
            fi
          done

      - name: Run hardened options contract radar through data fabric
        if: steps.market.outputs.open == 'true'
        run: >-
          python -m scripts.run_options_radar_fabric
          --output public/data/options_latest.json
          --max-symbols "$OPTIONS_INDEPENDENT_MAX_SYMBOLS"
          --top-per-side "$OPTIONS_INDEPENDENT_TOP_PER_SIDE"

      - name: Validate path independence, data fabric, gamma, learning and one-side policy
        if: steps.market.outputs.open == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('public/data/options_latest.json').read_text(encoding='utf-8'))
          assert payload['path'] == 'options'
          assert payload['independent_from_stock_radar'] is True
          assert payload['architecture'] == 'independent_options_contract_radar_v3_outcome_learning'
          assert isinstance(payload.get('provider_readiness'), dict)
          assert isinstance(payload.get('gamma_maps'), dict)
          assert isinstance(payload.get('outcome_learning'), dict)
          assert payload['outcome_learning'].get('status') != 'degraded'
          assert int(payload['outcome_learning'].get('shadow_sample_size', 0)) >= int(payload['outcome_learning'].get('calibration_sample_size', 0))
          policy = payload['flow_policy']
          assert policy['volume_over_oi_means_new_opening_position'] is False
          assert policy['ask_side_snapshot_means_confirmed_buyer'] is False
          assert policy['sweep_claim_allowed_from_snapshot_chain'] is False
          assert 'verified dealer inventory' in policy['gamma_policy']
          assert 'Hard blockers' in policy['learning_policy']
          for audit in (payload.get('provider_audit') or {}).values():
              if isinstance(audit, dict) and str(audit.get('source') or '').startswith('fabric:'):
                  metadata = audit.get('metadata') or {}
                  assert isinstance(metadata.get('data_fabric'), dict)
                  assert isinstance(metadata.get('provider_health'), dict)
          research = payload.get('research_contracts') or payload.get('contracts') or []
          for row in research:
              assert row.get('independent_from_stock_radar') is True
              evidence = row.get('flow_evidence') or {}
              assert evidence.get('opening_position_confirmed') is False
              assert evidence.get('sweep_confirmed') is False
              assert abs(float(row.get('learning_adjustment') or 0)) <= 4.0
              if int(row.get('fabric_independent_source_count') or 0) >= 2:
                  assert 'fabric_quote_divergence_pct' in row
                  assert 'fabric_consensus_pass' in row
          signals = payload.get('research_directional_signals') or payload.get('directional_signals') or []
          seen = set()
          for row in signals:
              symbol = row['symbol']
              assert symbol not in seen, f'duplicate CALL/PUT signal for {symbol}'
              seen.add(symbol)
              assert row.get('direction') in {'CALL', 'PUT'}
              assert row.get('selection_policy') == 'one_side_one_contract_per_symbol_strict_consensus'
              assert 'provider_quote_disagreement' not in set(row.get('strict_blockers') or [])
          for path in ('data/live/options_outcomes.json', 'data/live/options_calibration.json'):
              assert Path(path).exists(), f'missing learning state: {path}'
          calibration = json.loads(Path('data/live/options_calibration.json').read_text(encoding='utf-8'))
          assert int(calibration.get('shadow_sample_size', 0)) >= int(calibration.get('sample_size', 0))
          assert float(calibration.get('max_total_adjustment', 4.0)) <= 4.0
          print('Independent options + data fabric + gamma + guarded learning passed.')
          PY

      - name: Upload options radar payload
        if: steps.market.outputs.open == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: independent-options-radar
          path: public/data/options_latest.json
          if-no-files-found: error
          retention-days: 7

      - name: Stage independent options state
        if: steps.market.outputs.open == 'true'
        shell: bash
        run: |
          mkdir -p .options-state-upload
          for pair in \
            "data/live/options_alert_state.json:options_alert_state.json" \
            "data/live/options_signals.jsonl:options_signals.jsonl" \
            "data/live/options_outcomes.json:options_outcomes.json" \
            "data/live/options_calibration.json:options_calibration.json" \
            "data/live/provider_health.json:provider_health.json" \
            "data/cache/occ_optionable_universe.json:occ_optionable_universe.json"; do
            source="${pair%%:*}"
            target="${pair##*:}"
            [[ -f "$source" ]] && cp -f "$source" ".options-state-upload/$target"
          done
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          Path('.options-state-upload/manifest.json').write_text(
              json.dumps({
                  'path': 'options',
                  'independent_from_stock_radar': True,
                  'data_fabric': True,
                  'outcome_learning': True,
                  'saved_at': datetime.now(timezone.utc).isoformat(),
              }, indent=2),
              encoding='utf-8',
          )
          PY

      - name: Upload independent options state
        if: steps.market.outputs.open == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: options-contract-state
          path: .options-state-upload/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Restore centralized Telegram destination for direct delivery
        if: steps.market.outputs.open == 'true' && env.TELEGRAM_CHAT_ID == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p telegram_runtime
          for workflow in telegram-connection-keeper.yml options-contract-radar.yml options-telegram-alerts.yml; do
            for run_id in $(gh run list --workflow "$workflow" --status success --branch main --limit 8 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              rm -f telegram_runtime/connection.enc telegram_runtime/connection.json
              if gh run download "$run_id" -n telegram-connection -D telegram_runtime >/dev/null 2>&1; then
                [[ -s telegram_runtime/connection.enc ]] && break 2
              fi
            done
          done
          if [[ -s telegram_runtime/connection.enc && -n "$TELEGRAM_BOT_TOKEN" ]]; then
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in telegram_runtime/connection.enc \
              -out telegram_runtime/connection.json \
              -pass env:TELEGRAM_BOT_TOKEN || rm -f telegram_runtime/connection.json
          fi

      - name: Resolve Telegram destination for direct delivery
        if: steps.market.outputs.open == 'true'
        run: python scripts/telegram_connection_bootstrap.py --connection-path telegram_runtime/connection.json

      - name: Restore direct options Telegram dedupe state
        if: steps.market.outputs.open == 'true' && env.TELEGRAM_READY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/live .options-telegram-restore
          printf '{"sent":{}}\n' > data/live/options_telegram_alert_state.json
          # Delivery state can be valid even if a prior run failed after one
          # successful Telegram POST. Market/learning state above remains success-only.
          for workflow in options-contract-radar.yml options-telegram-alerts.yml; do
            for run_id in $(gh run list --workflow "$workflow" --status completed --branch main --limit 8 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              rm -rf .options-telegram-restore && mkdir -p .options-telegram-restore
              if gh run download "$run_id" -n options-telegram-state -D .options-telegram-restore >/dev/null 2>&1; then
                if [[ -s .options-telegram-restore/options_alert_state.json ]]; then
                  cp .options-telegram-restore/options_alert_state.json data/live/options_telegram_alert_state.json
                  break 2
                fi
              fi
            done
          done

      - name: Send strict option alert directly after persisted validation
        if: steps.market.outputs.open == 'true' && env.TELEGRAM_READY == 'true'
        run: >-
          python -m scripts.send_strict_options_alerts
          --payload public/data/options_latest.json
          --state data/live/options_telegram_alert_state.json

      - name: Upload direct options Telegram state
        if: always() && steps.market.outputs.open == 'true' && env.TELEGRAM_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: options-telegram-state
          path: data/live/options_telegram_alert_state.json
          if-no-files-found: warn
          retention-days: 30

      - name: Closed-market status
        if: steps.market.outputs.open != 'true'
        run: echo "Options radar skipped because the U.S. regular session is closed; manual runs cannot bypass this safety gate."
