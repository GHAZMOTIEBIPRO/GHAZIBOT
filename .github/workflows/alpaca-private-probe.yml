name: GHAZI Private IEX and Delayed Options Source Probe

on:
  workflow_dispatch:
    inputs:
      stock:
        description: "US equity for internal IEX availability verification"
        type: string
        default: AAPL
        required: true
      option_contract:
        description: "Optional OCC contract, e.g. AAPL261120C00150000"
        type: string
        default: ""
        required: false
      entry_date:
        description: "Optional historical start YYYY-MM-DD"
        type: string
        default: ""
        required: false
      exit_date:
        description: "Optional historical end YYYY-MM-DD (before current UTC day)"
        type: string
        default: ""
        required: false

permissions:
  contents: read

env:
  YAHOO_AUTOMATED_ACCESS_APPROVED: ${{ vars.YAHOO_AUTOMATED_ACCESS_APPROVED || 'false' }}
  NASDAQ_WEB_AUTOMATION_APPROVED: ${{ vars.NASDAQ_WEB_AUTOMATION_APPROVED || 'false' }}
  OCC_MARKET_DATA_AUTOMATION_APPROVED: ${{ vars.OCC_MARKET_DATA_AUTOMATION_APPROVED || 'false' }}
  NASDAQTRADER_AUTOMATION_APPROVED: ${{ vars.NASDAQTRADER_AUTOMATION_APPROVED || 'false' }}
  FINRA_API_AUTOMATION_APPROVED: ${{ vars.FINRA_API_AUTOMATION_APPROVED || 'false' }}
  FRED_AUTOMATION_APPROVED: ${{ vars.FRED_AUTOMATION_APPROVED || 'false' }}
  BLS_AUTOMATION_APPROVED: ${{ vars.BLS_AUTOMATION_APPROVED || 'false' }}
  GOOGLE_NEWS_AUTOMATION_APPROVED: ${{ vars.GOOGLE_NEWS_AUTOMATION_APPROVED || 'false' }}
  PRESS_WIRE_RSS_APPROVED: ${{ vars.PRESS_WIRE_RSS_APPROVED || 'false' }}

jobs:
  permission-gated-private-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      # Owner must review terms and explicitly set the repository variable.
      ALPACA_INTERNAL_DATA_USE_AUTHORIZED: ${{ vars.ALPACA_INTERNAL_DATA_USE_AUTHORIZED || 'false' }}
      FREE_AUTONOMY_MODE: "true"
      PAID_MARKET_DATA_ALLOWED: "false"
      PYTHONPATH: .
      PROBE_STOCK: ${{ inputs.stock }}
      PROBE_OPTION: ${{ inputs.option_contract }}
      PROBE_ENTRY: ${{ inputs.entry_date }}
      PROBE_EXIT: ${{ inputs.exit_date }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install minimal research client
        run: python -m pip install "requests>=2.32,<3"
      - name: Verify optional historical account data without outputting protected prices
        shell: bash
        run: >-
          python -m scripts.run_alpaca_private_probe
          --stock "$PROBE_STOCK"
          --option-contract "$PROBE_OPTION"
          --entry-date "$PROBE_ENTRY"
          --exit-date "$PROBE_EXIT"
