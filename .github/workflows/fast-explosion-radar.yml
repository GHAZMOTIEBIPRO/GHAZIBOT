name: BLACK BOX Omega Fast Explosion Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/fast_ping.txt"
      - ".github/workflows/fast-explosion-radar.yml"
      - "scripts/fast_explosion_scan.py"
      - "scripts/fast_explosion_scan_runner.py"
      - "options_radar/institutional_radar.py"
  schedule:
    - cron: "*/20 8-12 * * 1-5"
    - cron: "*/5 13-21 * * 1-5"
    - cron: "*/20 22-23 * * 1-5"

concurrency:
  group: black-box-omega-fast-radar
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Restore previous full-market institutional snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/live
          previous="$(gh run list --workflow fast-explosion-radar.yml --status success --branch main --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          if [[ -n "$previous" && "$previous" != "0" ]]; then
            echo "Trying previous fast-radar run: $previous"
            gh run download "$previous" -n fast-market-state -D data/live || true
          fi
          if [[ -f data/live/fast_market_state.json ]]; then
            echo "Previous institutional full-market state restored."
          else
            echo "No prior state yet; this run will establish the baseline."
          fi

      - name: Scan full US-listed market with institutional anomaly engine
        run: python scripts/fast_explosion_scan_runner.py --no-telegram

      - name: Upload fast-radar evidence for unified Arabic notifier
        uses: actions/upload-artifact@v4
        with:
          name: fast-market-state
          path: |
            data/live/fast_market_state.json
            data/live/fast_explosion_scan.json
          if-no-files-found: error
          retention-days: 2
