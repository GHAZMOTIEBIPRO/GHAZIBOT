name: BLACK BOX Omega Fast Explosion Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/fast_ping.txt"
      - ".github/workflows/fast-explosion-radar.yml"
      - "scripts/fast_explosion_scan.py"
      - "scripts/fast_explosion_scan_runner.py"
      - "scripts/fast_explosion_scan_fabric.py"
      - "options_radar/institutional_radar.py"
      - "options_radar/data_fabric.py"
      - "options_radar/data_fabric_runtime.py"
      - "options_radar/market_clock.py"
      - "options_radar/stream_overlay.py"
  schedule:
    - cron: "2,22,42 8-12 * * 1-5"
    - cron: "2-57/5 13-21 * * 1-5"
    - cron: "2,22,42 22-23 * * 1-5"

concurrency:
  group: black-box-omega-fast-radar
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FREE_AUTONOMY_MODE: "true"
      PAID_MARKET_DATA_ALLOWED: "false"
      TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
      TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL || 'https://sandbox.tradier.com' }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      # Free Autonomy invariant: never let a stale repository secret select SIP.
      ALPACA_STOCK_FEED: iex
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      INTRADAY_PRICE_PROVIDER_ORDER: ${{ secrets.INTRADAY_PRICE_PROVIDER_ORDER || 'tradier,alpaca,tiingo,finnhub,twelve_data,polygon,alpha_vantage,yahoo' }}
      DATA_FABRIC_HEALTH_PATH: data/live/provider_health.json
      DATA_FABRIC_MAX_WORKERS: ${{ secrets.DATA_FABRIC_MAX_WORKERS || '5' }}
      DATA_FABRIC_CIRCUIT_FAILURES: ${{ secrets.DATA_FABRIC_CIRCUIT_FAILURES || '3' }}
      DATA_FABRIC_CIRCUIT_MINUTES: ${{ secrets.DATA_FABRIC_CIRCUIT_MINUTES || '20' }}
      DATA_FABRIC_MAX_STOCK_DIVERGENCE_PCT: ${{ secrets.DATA_FABRIC_MAX_STOCK_DIVERGENCE_PCT || '0.025' }}
      DATA_FABRIC_STOCK_VALIDATION_TOP: ${{ secrets.DATA_FABRIC_STOCK_VALIDATION_TOP || '12' }}
      DATA_FABRIC_STOCK_DISCOVERY_DIVERGENCE_PCT: ${{ secrets.DATA_FABRIC_STOCK_DISCOVERY_DIVERGENCE_PCT || '0.08' }}
      DATA_FABRIC_STREAM_SNAPSHOT: data/live/stream_snapshot.json
      DATA_FABRIC_STREAM_MAX_AGE_SECONDS: ${{ secrets.DATA_FABRIC_STREAM_MAX_AGE_SECONDS || '20' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Check U.S. stock market activity window
        id: market_day
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from options_radar.market_clock import market_clock_state
          state = market_clock_state()
          print(f"open={'true' if state.is_extended_activity_open else 'false'}")
          print(f"date={state.session_date}")
          print(f"reason={state.reason}")
          PY

      - name: Restore previous full-market institutional snapshot and provider health
        if: steps.market_day.outputs.open == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/live
          previous="$(gh run list --workflow fast-explosion-radar.yml --status success --branch main --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          if [[ -n "$previous" && "$previous" != "0" ]]; then
            echo "Trying previous fast-radar run: $previous"
            gh run download "$previous" -n fast-market-state -D data/live || true
          fi
          if [[ -f data/live/fast_market_state.json ]]; then
            echo "Previous institutional full-market state restored."
          else
            echo "No prior state yet; this run will establish the baseline."
          fi
          if [[ -f data/live/provider_health.json ]]; then
            echo "Previous provider-health circuit state restored."
          fi

      - name: Scan full US-listed market with institutional engine and data fabric
        if: steps.market_day.outputs.open == 'true'
        run: python scripts/fast_explosion_scan_fabric.py --no-telegram

      - name: Upload fast-radar evidence for unified Arabic notifier
        if: steps.market_day.outputs.open == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fast-market-state
          path: |
            data/live/fast_market_state.json
            data/live/fast_explosion_scan.json
            data/live/provider_health.json
          if-no-files-found: warn
          retention-days: 2

      - name: Closed-market status
        if: steps.market_day.outputs.open != 'true'
        run: echo "Fast stock radar skipped because New York is outside the 04:00-20:00 stock activity window or today is not an XNYS trading day; stale data will not seed discovery or learning."
