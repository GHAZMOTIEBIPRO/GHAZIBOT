name: BLACK BOX Omega Durable Options State Vault

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/options-state-vault.yml"
      - "options_radar/durable_state.py"
  workflow_run:
    workflows:
      - "BLACK BOX Omega Options Contract Radar"
      - "BLACK BOX Omega Options Performance Auditor"
    types: [completed]

concurrency:
  group: black-box-omega-durable-options-state-vault
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  persist:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out durable state branch
        uses: actions/checkout@v4
        with:
          ref: bot-state
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve source workflow
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$SOURCE_WORKFLOW_NAME" == "BLACK BOX Omega Options Performance Auditor" ]]; then
              echo "kind=performance" >> "$GITHUB_OUTPUT"
            else
              echo "kind=options" >> "$GITHUB_OUTPUT"
            fi
            echo "run_ids=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "kind=options" >> "$GITHUB_OUTPUT"
            run_ids="$(gh run list --workflow options-contract-radar.yml --status success --branch main --limit 20 --json databaseId --jq 'map(.databaseId) | join(" ")' 2>/dev/null || true)"
            echo "run_ids=$run_ids" >> "$GITHUB_OUTPUT"
          fi

      - name: Download validated state artifact
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.source.outputs.kind }}
          RUN_IDS: ${{ steps.source.outputs.run_ids }}
        run: |
          set -u
          found=false
          selected=0
          rm -rf .incoming
          mkdir -p .incoming

          if [[ "$KIND" == "performance" ]]; then
            artifact_name="options-performance-audit"
          else
            artifact_name="options-contract-state"
          fi

          for run_id in $RUN_IDS; do
            rm -rf .incoming
            mkdir -p .incoming
            if ! gh run download "$run_id" -n "$artifact_name" -D .incoming >/dev/null 2>&1; then
              continue
            fi
            if [[ "$KIND" == "performance" ]]; then
              if [[ -s .incoming/options_performance_report_state.json ]]; then
                found=true
                selected="$run_id"
                break
              fi
            else
              if [[ -s .incoming/options_outcomes.json && -s .incoming/options_calibration.json ]]; then
                found=true
                selected="$run_id"
                break
              fi
            fi
          done

          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$selected" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

      - name: Validate state before persistence
        if: steps.artifact.outputs.found == 'true'
        shell: bash
        env:
          KIND: ${{ steps.artifact.outputs.kind }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('.incoming')
          kind = os.environ['KIND']
          forbidden = ('token', 'secret', 'api_key', 'authorization', 'password', 'credential')

          def load_json(name):
              value = json.loads((root / name).read_text(encoding='utf-8'))
              assert isinstance(value, dict), f'{name} must contain an object'
              return value

          def reject_secrets(value, path='root'):
              if isinstance(value, dict):
                  for key, child in value.items():
                      lowered = str(key).lower()
                      assert not any(part in lowered for part in forbidden), f'forbidden secret-like key at {path}.{key}'
                      reject_secrets(child, f'{path}.{key}')
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      reject_secrets(child, f'{path}[{index}]')

          if kind == 'performance':
              state = load_json('options_performance_report_state.json')
              reject_secrets(state)
              report_path = root / 'options_performance_report.json'
              if report_path.exists() and report_path.stat().st_size:
                  report = load_json('options_performance_report.json')
                  reject_secrets(report)
                  assert report.get('decision_authority') is False
                  assert report.get('independent_from_stock_radar') is True
          else:
              outcomes = load_json('options_outcomes.json')
              calibration = load_json('options_calibration.json')
              reject_secrets(outcomes)
              reject_secrets(calibration)
              assert isinstance(outcomes.get('signals', {}), dict)
              assert int(calibration.get('shadow_sample_size', 0)) >= int(calibration.get('sample_size', 0))
              assert float(calibration.get('max_total_adjustment', 4.0)) <= 4.0

              alert_path = root / 'options_alert_state.json'
              if alert_path.exists() and alert_path.stat().st_size:
                  reject_secrets(load_json('options_alert_state.json'))

              journal = root / 'options_signals.jsonl'
              if journal.exists() and journal.stat().st_size:
                  lines = [line for line in journal.read_text(encoding='utf-8').splitlines() if line.strip()]
                  assert len(lines) <= 5000
                  for line in lines:
                      row = json.loads(line)
                      assert isinstance(row, dict)
                      reject_secrets(row)

          print(f'Durable state validation passed for {kind}.')
          PY

      - name: Persist durable state to bot-state
        if: steps.artifact.outputs.found == 'true'
        shell: bash
        env:
          KIND: ${{ steps.artifact.outputs.kind }}
          SOURCE_RUN_ID: ${{ steps.artifact.outputs.source_run_id }}
        run: |
          set -euo pipefail
          git config user.name "BLACK BOX Omega State Vault"
          git config user.email "GHAZMOTIEBIPRO@users.noreply.github.com"

          if [[ "$KIND" == "performance" ]]; then
            mkdir -p state/performance
            cp -f .incoming/options_performance_report_state.json state/performance/options_performance_report_state.json
            if [[ -s .incoming/options_performance_report.json ]]; then
              cp -f .incoming/options_performance_report.json state/performance/options_performance_report.json
            fi
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          Path('state/performance/manifest.json').write_text(
              json.dumps({
                  'schema_version': 1,
                  'source': 'options-performance-auditor',
                  'source_run_id': int(os.environ['SOURCE_RUN_ID']),
                  'saved_at': datetime.now(timezone.utc).isoformat(),
                  'contains_secrets': False,
              }, indent=2),
              encoding='utf-8',
          )
          PY
          else
            mkdir -p state/options
            for name in options_alert_state.json options_signals.jsonl options_outcomes.json options_calibration.json; do
              [[ -s ".incoming/$name" ]] && cp -f ".incoming/$name" "state/options/$name"
            done
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          Path('state/options/manifest.json').write_text(
              json.dumps({
                  'schema_version': 1,
                  'source': 'options-contract-radar',
                  'source_run_id': int(os.environ['SOURCE_RUN_ID']),
                  'saved_at': datetime.now(timezone.utc).isoformat(),
                  'contains_secrets': False,
                  'files': [
                      'options_alert_state.json',
                      'options_signals.jsonl',
                      'options_outcomes.json',
                      'options_calibration.json',
                  ],
              }, indent=2),
              encoding='utf-8',
          )
          PY
          fi

          git add state/
          if git diff --cached --quiet; then
            echo "Durable state unchanged; no commit required."
            exit 0
          fi
          git commit -m "state: persist $KIND run $SOURCE_RUN_ID [skip ci]"
          git push origin HEAD:bot-state

      - name: No eligible state artifact
        if: steps.artifact.outputs.found != 'true'
        run: echo "No eligible state artifact was produced by the source run; durable vault remains unchanged."
