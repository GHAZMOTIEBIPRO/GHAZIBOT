name: GHAZI IR Sources Probe

# One-time check of official investor-relations pages: robots.txt first, one
# request per page, only feeds the page advertises. Output is the log only;
# nothing is stored, published or sent.
on:
  workflow_dispatch:
  push:
    branches:
      - "ccr-**"
    paths:
      - "scripts/probe_ir_sources.py"
      - ".github/workflows/ir-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "requests>=2.32,<3"
      - name: Probe each IR page
        run: python scripts/probe_ir_sources.py
