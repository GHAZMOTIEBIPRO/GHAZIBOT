name: GHAZI RADAR FDA Events (openFDA, CC0)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "options_radar/fda_events.py"
      - "scripts/build_fda_events.py"
      - ".github/workflows/fda-events.yml"
  # openFDA refreshes these endpoints about weekly; two weekday runs keep
  # the window current without polling.
  schedule:
    - cron: "29 13 * * 1-5"
    - cron: "29 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: ghazi-radar-fda-events
  cancel-in-progress: false

jobs:
  update-fda-events:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - uses: actions/checkout@v4
        with:
          ref: bot-state
          fetch-depth: 0
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch FDA approvals and recalls (standard library only)
        run: >-
          python app/scripts/build_fda_events.py
          --output state/runtime/public/data/fda_events.json
      - name: Publish only the FDA events document
        shell: bash
        run: |
          set -euo pipefail
          cd state
          git config user.name "GHAZI RADAR FDA Events"
          git config user.email "GHAZMOTIEBIPRO@users.noreply.github.com"
          git add runtime/public/data/fda_events.json
          if git diff --cached --quiet; then
            echo "FDA events unchanged."
            exit 0
          fi
          git commit -m "state: openFDA approvals and recalls [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin bot-state && git push origin HEAD:bot-state; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$attempt"
          done
          echo "Failed to publish FDA events after retries." >&2
          exit 1
