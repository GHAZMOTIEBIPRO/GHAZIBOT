name: GHAZI RADAR FDA Events (openFDA, CC0)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "options_radar/fda_events.py"
      - "scripts/build_fda_events.py"
      - "scripts/send_fda_alerts.py"
      - "data/fda_sponsor_aliases.json"
      - ".github/workflows/fda-events.yml"
  # openFDA refreshes these endpoints about weekly; two weekday runs keep
  # the window current without polling.
  schedule:
    - cron: "29 13 * * 1-5"
    - cron: "29 21 * * 1-5"

permissions:
  contents: write
  actions: read

concurrency:
  group: ghazi-radar-fda-events
  cancel-in-progress: false

jobs:
  update-fda-events:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - uses: actions/checkout@v4
        with:
          ref: bot-state
          fetch-depth: 0
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch FDA approvals and recalls (standard library only)
        id: build
        run: >-
          python app/scripts/build_fda_events.py
          --output state/runtime/public/data/fda_events.json
      - name: Install Telegram transport dependency
        run: pip install "requests>=2.32,<3.0"
      - name: Restore Telegram destination when chat secret is absent
        if: env.TELEGRAM_CHAT_ID == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p telegram_runtime
          for workflow in telegram-connection-keeper.yml options-contract-radar.yml stock-radar.yml; do
            for run_id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow "$workflow" --status success --branch main --limit 8 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              rm -f telegram_runtime/connection.enc telegram_runtime/connection.json
              if gh run download -R "$GITHUB_REPOSITORY" "$run_id" -n telegram-connection -D telegram_runtime >/dev/null 2>&1; then
                if [[ -s telegram_runtime/connection.enc ]]; then
                  break 2
                fi
              fi
            done
          done
          if [[ -s telegram_runtime/connection.enc && -n "$TELEGRAM_BOT_TOKEN" ]]; then
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in telegram_runtime/connection.enc \
              -out telegram_runtime/connection.json \
              -pass env:TELEGRAM_BOT_TOKEN || rm -f telegram_runtime/connection.json
          fi
          exit 0
      - name: Resolve Telegram destination
        run: python app/scripts/telegram_connection_bootstrap.py --connection-path telegram_runtime/connection.json
      # This workflow is the only writer of state/fda/fda_alert_state.json.
      - name: Alert important FDA events (deduplicated, no backlog)
        id: alerts
        if: env.TELEGRAM_READY == 'true'
        run: >-
          python app/scripts/send_fda_alerts.py
          --events state/runtime/public/data/fda_events.json
          --state state/state/fda/fda_alert_state.json
      - name: Publish the FDA events document and alert state
        if: always() && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cd state
          git config user.name "GHAZI RADAR FDA Events"
          git config user.email "GHAZMOTIEBIPRO@users.noreply.github.com"
          git add runtime/public/data/fda_events.json
          if [[ -f state/fda/fda_alert_state.json ]]; then
            git add state/fda/fda_alert_state.json
          fi
          if git diff --cached --quiet; then
            echo "FDA events unchanged."
            exit 0
          fi
          git commit -m "state: openFDA approvals and recalls [skip ci]"
          for attempt in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin bot-state && git push origin HEAD:bot-state; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2 + RANDOM % 5))
          done
          echo "Failed to publish FDA events after retries." >&2
          exit 1
