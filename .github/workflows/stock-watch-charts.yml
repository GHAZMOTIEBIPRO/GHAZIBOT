name: GHAZI Stock Watch OHLC Charts

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["GHAZI RADAR Market Index Research"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "scripts/build_stock_watch_charts.py"
      - "scripts/build_source_consensus_status.py"
      - "scripts/run_independent_price_check.py"
      - "options_radar/independent_price_check.py"
      - "scripts/build_structural_watch_catalog.py"
      - "data/cache/structural_microfloat_candidates.json"
      - "scripts/stock_watch_news_attention.py"
      - "options_radar/stock_watch_confluence.py"
      - "options_radar/pandas_ta_bollinger_shadow.py"
      - ".github/workflows/stock-watch-charts.yml"

permissions:
  contents: write

concurrency:
  group: ghazi-stock-watch-charts
  cancel-in-progress: false

jobs:
  stock-chart-research:
    # A failed upstream cannot trigger fabricated zero-data reports.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - uses: actions/checkout@v4
        with:
          ref: bot-state
          path: state
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install existing research dependencies and MIT Bollinger research adapter
        run: |
          python -m pip install -r app/requirements.txt
          python -m pip install pandas-ta-classic==0.8.32
      - name: Publish dated research-only full market structural catalog
        run: |
          PYTHONPATH=app python -m scripts.build_structural_watch_catalog \
            --source app/data/cache/structural_microfloat_candidates.json \
            --output state/runtime/public/data/structural_watch.json
      - name: Collect real daily and intraday candles
        run: |
          PYTHONPATH=app python -m scripts.build_stock_watch_charts \
            --output state/runtime/public/data/stock_watch_charts.json \
            --discovery-source state/runtime/public/data/decision_brief.json \
            --news-source state/runtime/public/data/free_public_intelligence.json \
            --structural-source state/runtime/public/data/structural_watch.json
      # Runs only when two vendors are keyed AND owner-attested for internal
      # non-display use; otherwise it records INSUFFICIENT without any request.
      - name: Licensed independent daily-close cross-check (statistics only)
        env:
          PYTHONPATH: app
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          TIINGO_NON_DISPLAY_USE_AUTHORIZED: ${{ vars.TIINGO_NON_DISPLAY_USE_AUTHORIZED || 'false' }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_INTERNAL_DATA_USE_AUTHORIZED: ${{ vars.ALPACA_INTERNAL_DATA_USE_AUTHORIZED || 'false' }}
          ALPACA_STOCK_FEED: sip
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TWELVE_DATA_NON_DISPLAY_USE_AUTHORIZED: ${{ vars.TWELVE_DATA_NON_DISPLAY_USE_AUTHORIZED || 'false' }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          POLYGON_NON_DISPLAY_USE_AUTHORIZED: ${{ vars.POLYGON_NON_DISPLAY_USE_AUTHORIZED || 'false' }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          ALPHA_VANTAGE_NON_DISPLAY_USE_AUTHORIZED: ${{ vars.ALPHA_VANTAGE_NON_DISPLAY_USE_AUTHORIZED || 'false' }}
        run: python -m scripts.run_independent_price_check --output licensed_price_check.json
      - name: Publish price-source agreement status without redistributing licensed prices
        run: |
          PYTHONPATH=app python -m scripts.build_source_consensus_status \
            --charts state/runtime/public/data/stock_watch_charts.json \
            --licensed-check licensed_price_check.json \
            --output state/runtime/public/data/source_agreement.json
      - name: Persist isolated stock chart feed
        shell: bash
        run: |
          set -euo pipefail
          cd state
          git config user.name "GHAZI RADAR Stock Watch"
          git config user.email "GHAZMOTIEBIPRO@users.noreply.github.com"
          git add runtime/public/data/stock_watch_charts.json runtime/public/data/structural_watch.json runtime/public/data/source_agreement.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "state: completed research stock candles [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin bot-state && git push origin HEAD:bot-state; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$attempt"
          done
          echo "Could not safely persist stock candle report" >&2
          exit 1
