name: BLACK BOX Company News Watch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/company-news-watch.yml"
      - "options_radar/free_public_intelligence.py"
      - "scripts/send_free_macro_reminders.py"
      - "requirements.txt"
  pull_request:
    paths:
      - ".github/workflows/company-news-watch.yml"
      - "options_radar/free_public_intelligence.py"
      - "tests/test_free_public_intelligence.py"

concurrency:
  group: black-box-company-news-watch
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  news-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'GHAZI Market Radar GHAZMOTIEBIPRO@users.noreply.github.com' }}
      OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NEWS_ALERT_MIN_ABS_SCORE: ${{ secrets.NEWS_ALERT_MIN_ABS_SCORE || '15' }}
      NEWS_ALERT_MAX_PER_RUN: ${{ secrets.NEWS_ALERT_MAX_PER_RUN || '5' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
        with:
          ref: bot-state
          path: .ghazi-news-state
          fetch-depth: 0

      - name: Build free GDELT and official macro context
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: >-
          python -m options_radar.free_public_intelligence
          --output public/data/free_public_intelligence.json
          --previous .ghazi-news-state/runtime/public/data/free_public_intelligence.json
          --symbols "MU,NVDA,RGC,BNAI,RKLB,AMD,AAPL,TSLA,IONQ,SOUN,ASTS,RGTI,SOFI,PLTR,MSFT,AVGO"

      - name: Publish bounded public news attention to independent bot-state path
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -s public/data/free_public_intelligence.json
          cd .ghazi-news-state
          mkdir -p runtime/public/data
          cp ../public/data/free_public_intelligence.json runtime/public/data/free_public_intelligence.json
          git config user.name "GHAZI RADAR News Context"
          git config user.email "GHAZMOTIEBIPRO@users.noreply.github.com"
          git add runtime/public/data/free_public_intelligence.json
          if git diff --cached --quiet; then
            echo "News context unchanged"
            exit 0
          fi
          git commit -m "state: public GDELT news attention and official macro context [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin bot-state && git push origin HEAD:bot-state; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$attempt"
          done
          echo "Could not publish public GDELT research context" >&2
          exit 1

      - name: Diagnose official BLS feed event shape (PR only)
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import requests
          from options_radar.free_public_intelligence import BLS_ICS
          response = requests.get(BLS_ICS, timeout=15, headers={'User-Agent': 'GHAZIBOT-Free-Research/1.0'})
          response.raise_for_status()
          raw = response.text
          first = raw.split('BEGIN:VEVENT', 1)
          sample = first[1].split('END:VEVENT', 1)[0] if len(first) == 2 else ''
          print(f"BLS feed diagnostic: bytes={len(raw)} vevents={raw.count('BEGIN:VEVENT')}")
          print('BLS first VEVENT sanitized sample:', repr(sample[:1600]))
          PY

      - name: Upload public intelligence context (research only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-public-intelligence
          path: public/data/free_public_intelligence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Restore Telegram destination when chat secret is absent
        if: github.event_name == 'workflow_dispatch' && env.TELEGRAM_CHAT_ID == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p telegram_runtime
          for workflow in telegram-connection-keeper.yml options-contract-radar.yml stock-radar.yml; do
            for run_id in $(gh run list --workflow "$workflow" --status success --branch main --limit 8 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              rm -f telegram_runtime/connection.enc telegram_runtime/connection.json
              if gh run download "$run_id" -n telegram-connection -D telegram_runtime >/dev/null 2>&1; then
                if [[ -s telegram_runtime/connection.enc ]]; then
                  break 2
                fi
              fi
            done
          done
          if [[ -s telegram_runtime/connection.enc && -n "$TELEGRAM_BOT_TOKEN" ]]; then
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in telegram_runtime/connection.enc \
              -out telegram_runtime/connection.json \
              -pass env:TELEGRAM_BOT_TOKEN || rm -f telegram_runtime/connection.json
          fi
          exit 0

      - name: Resolve Telegram destination
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/telegram_connection_bootstrap.py --connection-path telegram_runtime/connection.json

      - name: Restore company news state and SEC ticker cache
        if: github.event_name == 'workflow_dispatch' && env.TELEGRAM_READY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/live data/cache .news-state-restore
          printf '{"sent":{}}\n' > data/live/company_news_alert_state.json
          for run_id in $(gh run list --workflow company-news-watch.yml --status completed --branch main --limit 12 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            rm -rf .news-state-restore && mkdir -p .news-state-restore
            if gh run download "$run_id" -n company-news-state -D .news-state-restore >/dev/null 2>&1; then
              source="$(find .news-state-restore -type f -name company_news_alert_state.json | head -1)"
              if [[ -n "$source" ]]; then
                cp -f "$source" data/live/company_news_alert_state.json
              fi
              cache="$(find .news-state-restore -type f -name sec_company_tickers.json | head -1)"
              if [[ -n "$cache" ]]; then
                cp -f "$cache" data/cache/sec_company_tickers.json
              fi
              if [[ -n "$source" || -n "$cache" ]]; then
                break
              fi
            fi
          done
          exit 0

      - name: Scan material company news and official catalysts
        if: github.event_name == 'workflow_dispatch' && env.TELEGRAM_READY == 'true'
        run: >-
          python -m scripts.send_material_news_alerts
          --universe data/universe.txt
          --state data/live/company_news_alert_state.json
          --lookback-days 3
          --max-symbols 120

      - name: Send deduplicated official economic calendar reminders
        if: github.event_name == 'workflow_dispatch' && env.TELEGRAM_READY == 'true'
        run: >-
          python -m scripts.send_free_macro_reminders
          --context public/data/free_public_intelligence.json
          --state data/live/company_news_alert_state.json

      - name: Stage news state and SEC ticker cache
        if: always() && github.event_name == 'workflow_dispatch' && env.TELEGRAM_READY == 'true'
        shell: bash
        run: |
          mkdir -p .news-state-upload
          if [[ -s data/live/company_news_alert_state.json ]]; then
            cp data/live/company_news_alert_state.json .news-state-upload/company_news_alert_state.json
          fi
          if [[ -s data/cache/sec_company_tickers.json ]]; then
            cp data/cache/sec_company_tickers.json .news-state-upload/sec_company_tickers.json
          fi
          exit 0

      - name: Upload news state
        if: always() && github.event_name == 'workflow_dispatch' && env.TELEGRAM_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: company-news-state
          path: .news-state-upload/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
