name: BLACK BOX Omega Options Performance Auditor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/options-performance-auditor.yml"
      - "scripts/options_performance_auditor.py"
  schedule:
    # 22:37 UTC is after the regular XNYS close in both DST and standard time.
    # The audit runs on weekdays; unchanged/holiday data stays silent.
    - cron: "37 22 * * 1-5"

concurrency:
  group: black-box-omega-options-performance-auditor
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FREE_AUTONOMY_MODE: "true"
      PAID_MARKET_DATA_ALLOWED: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight report dependency
        run: pip install 'requests>=2.32,<3.0'

      - name: Restore latest independent options outcome state
        id: learning_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/live .options-learning-restore
          found=false
          source=none

          if git fetch origin bot-state:refs/remotes/origin/bot-state --depth=1 --quiet 2>/dev/null; then
            rm -f .options-learning-restore/durable_outcomes.json .options-learning-restore/durable_calibration.json
            if git show origin/bot-state:state/options/options_outcomes.json > .options-learning-restore/durable_outcomes.json 2>/dev/null \
              && git show origin/bot-state:state/options/options_calibration.json > .options-learning-restore/durable_calibration.json 2>/dev/null \
              && [[ -s .options-learning-restore/durable_outcomes.json && -s .options-learning-restore/durable_calibration.json ]]; then
              cp -f .options-learning-restore/durable_outcomes.json data/live/options_outcomes.json
              cp -f .options-learning-restore/durable_calibration.json data/live/options_calibration.json
              found=true
              source=bot-state
              echo "Restored outcome/calibration state from durable bot-state branch."
            fi
          fi

          if [[ "$found" != "true" ]]; then
            for run_id in $(gh run list --workflow options-contract-radar.yml --status success --branch main --limit 20 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              rm -rf .options-learning-restore/artifact && mkdir -p .options-learning-restore/artifact
              if gh run download "$run_id" -n options-contract-state -D .options-learning-restore/artifact >/dev/null 2>&1; then
                if [[ -s .options-learning-restore/artifact/options_outcomes.json && -s .options-learning-restore/artifact/options_calibration.json ]]; then
                  cp -f .options-learning-restore/artifact/options_outcomes.json data/live/options_outcomes.json
                  cp -f .options-learning-restore/artifact/options_calibration.json data/live/options_calibration.json
                  found=true
                  source="artifact:$run_id"
                  echo "Restored outcome/calibration state from artifact run $run_id."
                  break
                fi
              fi
            done
          fi

          if [[ "$found" == "true" ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          outcomes = json.loads(Path('data/live/options_outcomes.json').read_text(encoding='utf-8'))
          calibration = json.loads(Path('data/live/options_calibration.json').read_text(encoding='utf-8'))
          assert isinstance(outcomes, dict) and isinstance(outcomes.get('signals', {}), dict)
          assert isinstance(calibration, dict)
          assert int(calibration.get('shadow_sample_size', 0)) >= int(calibration.get('sample_size', 0))
          assert float(calibration.get('max_total_adjustment', 4.0)) <= 4.0
          print('Restored learning state passed integrity checks.')
          PY
          fi

          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"

      - name: Restore previous performance notification state
        if: steps.learning_state.outputs.found == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .performance-restore data/live
          restored=false

          if git show origin/bot-state:state/performance/options_performance_report_state.json > .performance-restore/durable_state.json 2>/dev/null \
            && [[ -s .performance-restore/durable_state.json ]]; then
            cp -f .performance-restore/durable_state.json data/live/options_performance_report_state.json
            restored=true
            echo "Restored performance notification state from durable bot-state branch."
          fi

          if [[ "$restored" != "true" ]]; then
            for run_id in $(gh run list --workflow options-performance-auditor.yml --status completed --branch main --limit 20 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              rm -rf .performance-restore/artifact && mkdir -p .performance-restore/artifact
              if gh run download "$run_id" -n options-performance-audit -D .performance-restore/artifact >/dev/null 2>&1; then
                cp -f .performance-restore/artifact/options_performance_report_state.json data/live/options_performance_report_state.json 2>/dev/null || true
                if [[ -s data/live/options_performance_report_state.json ]]; then
                  restored=true
                  echo "Restored performance notification state from artifact run $run_id."
                  break
                fi
              fi
            done
          fi

      - name: Restore centralized Telegram destination
        if: steps.learning_state.outputs.found == 'true' && env.TELEGRAM_CHAT_ID == '' && github.event_name != 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p telegram_runtime
          for workflow in telegram-connection-keeper.yml options-performance-auditor.yml options-contract-radar.yml options-telegram-alerts.yml radar-health.yml; do
            for run_id in $(gh run list --workflow "$workflow" --status completed --branch main --limit 8 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              rm -f telegram_runtime/connection.enc telegram_runtime/connection.json
              if gh run download "$run_id" -n telegram-connection -D telegram_runtime >/dev/null 2>&1; then
                [[ -s telegram_runtime/connection.enc ]] && break 2
              fi
            done
          done
          if [[ -s telegram_runtime/connection.enc && -n "$TELEGRAM_BOT_TOKEN" ]]; then
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in telegram_runtime/connection.enc \
              -out telegram_runtime/connection.json \
              -pass env:TELEGRAM_BOT_TOKEN || rm -f telegram_runtime/connection.json
          fi

      - name: Resolve Telegram destination
        if: steps.learning_state.outputs.found == 'true' && github.event_name != 'push'
        run: python scripts/telegram_connection_bootstrap.py --connection-path telegram_runtime/connection.json

      - name: Build silent audit and send only milestone/weekly report
        if: steps.learning_state.outputs.found == 'true'
        shell: bash
        run: |
          mkdir -p public/data data/live
          args=(
            --outcomes data/live/options_outcomes.json
            --calibration data/live/options_calibration.json
            --output public/data/options_performance_report.json
            --state data/live/options_performance_report_state.json
          )
          if [[ "${GITHUB_EVENT_NAME:-}" != "push" && "${TELEGRAM_READY:-false}" == "true" ]]; then
            args+=(--send)
          fi
          python -m scripts.options_performance_auditor "${args[@]}"

      - name: Validate auditor independence and evidence language
        if: steps.learning_state.outputs.found == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('public/data/options_performance_report.json').read_text(encoding='utf-8'))
          assert report['path'] == 'options_performance_auditor'
          assert report['independent_from_stock_radar'] is True
          assert report['decision_authority'] is False
          assert report['interpretation_policy']['metric_name'] == 'positive outcome rate, not predictive accuracy'
          assert report['interpretation_policy']['execution_model'].startswith('long option entry at ask')
          assert report['interpretation_policy']['risk_policy'].endswith('strict execution or risk blockers')
          assert int(report['calibration']['training_sample_size']) <= int(report['calibration']['shadow_sample_size'])
          assert float(report['calibration']['max_total_adjustment']) <= 4.0
          print('Options performance auditor safety validation passed.')
          PY

      - name: Stage performance audit artifact
        if: always() && steps.learning_state.outputs.found == 'true'
        shell: bash
        run: |
          mkdir -p .performance-upload
          cp -f public/data/options_performance_report.json .performance-upload/options_performance_report.json 2>/dev/null || true
          cp -f data/live/options_performance_report_state.json .performance-upload/options_performance_report_state.json 2>/dev/null || true

      - name: Upload performance audit and notification state
        if: always() && steps.learning_state.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: options-performance-audit
          path: .performance-upload/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      - name: No learning state yet
        if: steps.learning_state.outputs.found != 'true'
        run: echo "No persisted options outcome state exists yet; auditor remains silent without inventing performance data."
