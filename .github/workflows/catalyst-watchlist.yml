name: GHAZI RADAR Catalyst Watchlist

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_catalyst_watchlist.py"
      - "scripts/build_issuer_sizes.py"
      - "scripts/build_clinical_registry_feed.py"
      - "scripts/build_ir_news.py"
      - "data/ir_feeds.json"
      - "scripts/build_week_agenda.py"
      - "scripts/build_usaspending_contracts.py"
      - "data/usaspending_recipients.json"
      - "data/company_aliases.json"
      - "data/fda_sponsor_aliases.json"
      - "scripts/send_catalyst_watchlist_alerts.py"
      - ".github/workflows/catalyst-watchlist.yml"
  # Dedicated daily editorial digest, not an extra intraday market scanner.
  # 05:15 UTC = 08:15 Asia/Riyadh year-round; weekends excluded.
  schedule:
    - cron: "15 5 * * 1-5"
    # GitHub cron runs are best-effort: second scheduled delivery opportunity.
    - cron: "15 8 * * 1-5"
  # Regulatory input changes still rebuild the report automatically.
  workflow_run:
    workflows:
      - GHAZI RADAR FDA Events (openFDA, CC0)
      - GHAZI RADAR Official SEC Issuer Filings
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: ghazi-radar-catalyst-watchlist
  cancel-in-progress: false

jobs:
  catalyst-watchlist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - uses: actions/checkout@v4
        with:
          ref: bot-state
          fetch-depth: 0
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # This workflow is the only writer of catalyst_watchlist.json. No price
      # input is passed: no permitted public-display price source exists yet.
      - name: Fetch bounded ClinicalTrials registry metadata
        run: python app/scripts/build_clinical_registry_feed.py --output state/runtime/public/data/clinical_registry.json
      # Size classification input: SEC public float for the previous list's
      # issuers. Without the SEC_USER_AGENT secret it records
      # SEC_IDENTITY_MISSING and every issuer stays "size unverified".
      - name: SEC public float for issuer size (official XBRL)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          pip install "requests>=2.32,<3.0" "defusedxml>=0.7.1,<0.8"
          cd app
          python -m scripts.build_issuer_sizes \
            --watchlist ../state/runtime/public/data/catalyst_watchlist.json \
            --output ../state/runtime/public/data/issuer_sizes.json
      # Federal Register (public domain, no key): company notices linked only through the
      # reviewed table data/issuer_links.json. On failure the previous file is kept.
      - name: Federal Register company notices
        continue-on-error: true
        run: python app/scripts/build_federal_register_feed.py --output state/runtime/public/data/federal_register.json
      # Official company IR feeds (data/ir_feeds.json): robots.txt read every run, each source
      # fails alone and keeps its last good items. This workflow is the only writer of ir_news.json.
      - name: Company news from official IR feeds
        continue-on-error: true
        run: python app/scripts/build_ir_news.py --output state/runtime/public/data/ir_news.json
      # Federal contract actions (USAspending, U.S. Treasury; public domain, no key), linked only by the
      # reviewed parent UEIs in data/usaspending_recipients.json. Each company fails alone and keeps its
      # last good actions. This workflow is the only writer of usaspending_contracts.json.
      - name: Federal contract actions (USAspending)
        continue-on-error: true
        timeout-minutes: 8
        run: python app/scripts/build_usaspending_contracts.py --output state/runtime/public/data/usaspending_contracts.json
      - name: Build the catalyst watchlist from published official events
        run: >-
          python app/scripts/build_catalyst_watchlist.py
          --fda state/runtime/public/data/fda_events.json
          --sec state/runtime/public/data/sec_filing_pulse.json
          --clinical state/runtime/public/data/clinical_registry.json
          --sizes state/runtime/public/data/issuer_sizes.json
          --federal-register state/runtime/public/data/federal_register.json
          --ir-news state/runtime/public/data/ir_news.json
          --usaspending state/runtime/public/data/usaspending_contracts.json
          --source-history state
          --output state/runtime/public/data/catalyst_watchlist.json
      # Week agenda from source dates only (XNYS calendar, company-announced dates, Federal Register
      # effective/comment dates). This workflow is its only writer.
      - name: Week agenda
        continue-on-error: true
        run: |
          pip install "exchange-calendars>=4.5,<5.0"
          python app/scripts/build_week_agenda.py --catalysts state/runtime/public/data/catalyst_watchlist.json \
            --federal-register state/runtime/public/data/federal_register.json \
            --output state/runtime/public/data/week_agenda.json
      - name: Install shared Telegram transport dependency
        run: pip install "requests>=2.32,<3.0"
      - name: Restore Telegram destination when chat secret is absent
        if: env.TELEGRAM_CHAT_ID == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p telegram_runtime
          for workflow in telegram-connection-keeper.yml options-contract-radar.yml stock-radar.yml; do
            for run_id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow "$workflow" --status success --branch main --limit 8 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              rm -f telegram_runtime/connection.enc telegram_runtime/connection.json
              if gh run download -R "$GITHUB_REPOSITORY" "$run_id" -n telegram-connection -D telegram_runtime >/dev/null 2>&1; then
                [[ -s telegram_runtime/connection.enc ]] && break 2
              fi
            done
          done
          if [[ -s telegram_runtime/connection.enc && -n "$TELEGRAM_BOT_TOKEN" ]]; then
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in telegram_runtime/connection.enc \
              -out telegram_runtime/connection.json \
              -pass env:TELEGRAM_BOT_TOKEN || rm -f telegram_runtime/connection.json
          fi
      - name: Resolve Telegram destination for official catalyst context
        run: python app/scripts/telegram_connection_bootstrap.py --connection-path telegram_runtime/connection.json
      - name: Send new medium-priority official catalyst updates and scheduled brief
        if: env.TELEGRAM_READY == 'true'
        run: |
          set -euo pipefail
          # Source-completion and main-push runs also catch up when a GitHub
          # schedule is skipped. Python checks Riyadh 08:15 and one receipt/day.
          python -m scripts.send_catalyst_watchlist_alerts \
            --report state/runtime/public/data/catalyst_watchlist.json \
            --state state/state/catalyst/catalyst_alert_state.json \
            --market-health state/runtime/public/data/data-status.json \
            --daily-brief-if-due --notify-ready
      - name: Report no Telegram destination
        if: env.TELEGRAM_READY != 'true'
        run: echo "Official catalyst report updated; Telegram delivery not configured."
      - name: Publish the catalyst watchlist
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd state
          git config user.name "GHAZI RADAR Catalyst Watchlist"
          git config user.email "GHAZMOTIEBIPRO@users.noreply.github.com"
          git add runtime/public/data/catalyst_watchlist.json runtime/public/data/clinical_registry.json
          for f in issuer_sizes.json federal_register.json ir_news.json week_agenda.json usaspending_contracts.json; do
            if [[ -f "runtime/public/data/$f" ]]; then
              git add "runtime/public/data/$f"
            fi
          done
          if [[ -f state/catalyst/catalyst_alert_state.json ]]; then
            git add state/catalyst/catalyst_alert_state.json
          fi
          if git diff --cached --quiet; then
            echo "Catalyst watchlist unchanged."
            exit 0
          fi
          git commit -m "state: official catalyst watchlist [skip ci]"
          for attempt in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin bot-state && git push origin HEAD:bot-state; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2 + RANDOM % 5))
          done
          echo "Failed to publish the catalyst watchlist after retries." >&2
          exit 1
