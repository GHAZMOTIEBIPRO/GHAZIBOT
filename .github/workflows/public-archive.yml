name: GHAZI RADAR - Public data archive (DuckDB / Parquet pilot)

# Rebuilds the research archive from the committed history of the public bot-state files (U.S. government
# data, CC0 pageviews, NY Fed reference rates with their notice, our source-health log) and publishes the
# weekly/monthly report on the job page and as a 90-day artifact. bot-state history is the durable store:
# nothing is pushed, no secret is used, and no Alpaca or other restricted data is read.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * 0"   # Sundays: the week's Treasury, CFTC, DOL, NY Fed and OFR releases are in

permissions:
  contents: read

concurrency:
  group: ghazi-public-archive
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARCHIVE_START: "2026-10-01"   # first public macro/liquidity copies: 2026-10-18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: app
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the archive dependency
        run: python -m pip install -r app/requirements-archive.txt
      - name: Fetch bot-state history (public repository, read-only)
        run: git -C app fetch --quiet --no-tags --shallow-since="$ARCHIVE_START" origin bot-state:refs/remotes/origin/bot-state
      - name: Build Parquet files and the weekly/monthly report
        working-directory: app
        run: |
          python -m scripts.build_public_archive --repo . --ref origin/bot-state --out "$RUNNER_TEMP/public-archive"
          cat "$RUNNER_TEMP/public-archive/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-archive
          path: ${{ runner.temp }}/public-archive
          retention-days: 90
          if-no-files-found: error
