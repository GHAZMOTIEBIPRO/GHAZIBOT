name: GHAZI UI before/after comparison

# Serves main (before) and the pushed branch (after) side by side, pins every
# bot-state data request to one commit so both pages read the same real data,
# and records phone and desktop screenshots, a phone video and layout metrics.
# The images go to the ui-review branch (review only; never main or
# bot-state). Nothing here is published to the site or fed into analysis.
on:
  workflow_dispatch:
  push:
    branches:
      - "ccr-**"
    paths:
      - "public/**"
      - "!public/data/**"
      - "scripts/ui_compare.cjs"
      - "scripts/ux_tasks.cjs"
      - ".github/workflows/ui-compare.yml"

permissions:
  contents: write

concurrency:
  group: ghazi-ui-compare
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: after
      - uses: actions/checkout@v4
        with:
          ref: main
          path: before
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install a pinned Playwright with Chromium
        working-directory: after
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Serve both copies and compare
        working-directory: after
        run: |
          python3 -m http.server 8001 --bind 127.0.0.1 --directory ../before/public >/dev/null 2>&1 &
          python3 -m http.server 8002 --bind 127.0.0.1 --directory public >/dev/null 2>&1 &
          sleep 2
          export DATA_SHA="$(git ls-remote origin refs/heads/bot-state | cut -f1)"
          echo "DATA_SHA=$DATA_SHA" >> "$GITHUB_ENV"
          OUT=../ui-shots node scripts/ui_compare.cjs
      # Real-task check of the new page. Files this change adds to bot-state are
      # built here from their real sources (and the catalyst list rebuilt from
      # the same bot-state commit) and served in place of the published copies.
      - uses: actions/checkout@v4
        with:
          ref: bot-state
          fetch-depth: 0
          path: state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the files this change adds, from real sources
        working-directory: after
        continue-on-error: true
        run: |
          pip install "requests>=2.32,<3" "exchange-calendars>=4.5,<5.0" "defusedxml>=0.7.1,<0.8"
          mkdir -p ../ux-data
          python scripts/build_nasdaq_listed.py --output ../ux-data/nasdaq_listed.json
          python scripts/build_federal_register_feed.py --output ../ux-data/federal_register.json
          python scripts/build_ir_news.py --output ../ux-data/ir_news.json || true
          D=../state/runtime/public/data
          python scripts/build_catalyst_watchlist.py --fda $D/fda_events.json --sec $D/sec_filing_pulse.json \
            --clinical $D/clinical_registry.json --sizes $D/issuer_sizes.json \
            --federal-register ../ux-data/federal_register.json --ir-news ../ux-data/ir_news.json \
            --source-history ../state \
            --previous $D/catalyst_watchlist.json \
            --output ../ux-data/preview_catalysts.json
          python scripts/build_week_agenda.py --catalysts ../ux-data/preview_catalysts.json \
            --federal-register ../ux-data/federal_register.json --output ../ux-data/week_agenda.json
          python scripts/build_source_log.py --repo ../state --output ../ux-data/preview_source_log.json
      - name: User tasks (search, reason, source link, chart frame, back, Escape, scroll)
        id: ux
        working-directory: after
        continue-on-error: true
        run: |
          python3 -m http.server 8002 --bind 127.0.0.1 --directory public >/dev/null 2>&1 &
          sleep 1
          U=../ux-data
          export UX_LOCAL_DATA="nasdaq_listed.json=$U/nasdaq_listed.json,federal_register.json=$U/federal_register.json,catalyst_watchlist.json=$U/preview_catalysts.json,week_agenda.json=$U/week_agenda.json,source_log.json=$U/preview_source_log.json"
          SW_FILE="$PWD/public/sw.js" OUT=../ui-shots node scripts/ux_tasks.cjs
      - name: Store the images on the ui-review branch
        working-directory: after
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan ui-review-snapshot
          git rm -rq --cached . && git clean -fdq -e node_modules
          cp ../ui-shots/* .
          git add -- $(ls *.png *.webm metrics.json ux_tasks.json 2>/dev/null)
          git commit -qm "UI before/after for ${GITHUB_SHA::8} (data ${DATA_SHA:-unpinned})"
          git push -qf origin HEAD:refs/heads/ui-review
      - name: Fail when a user task failed
        if: steps.ux.outcome == 'failure'
        run: |
          echo "::error::One or more user tasks failed; see ux_tasks.json on the ui-review branch."
          exit 1
