name: BLACK BOX Free Data Health

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/free_data_sources.json"
      - "options_radar/free_data_health.py"
      - ".github/workflows/free-data-health.yml"

concurrency:
  group: black-box-free-data-health
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          ref: bot-state
          fetch-depth: 0
          path: state
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Check public sources without failing the pipeline
        run: python options_radar/free_data_health.py
      - name: Surface degraded official sources in Actions summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path('public/data/free_data_health.json').read_text(encoding='utf-8'))
          failed = [row for row in payload.get('sources', []) if row.get('authority') == 'official' and not row.get('ok')]
          lines = [
              '## Free data provider health',
              f"Overall: **{payload.get('overall', 'unknown')}**",
              f"Official sources: **{payload.get('official_sources_ok', 0)}/{payload.get('official_sources_total', 0)}** healthy",
          ]
          for row in failed:
              lines.append(f"- {row.get('name', 'unknown')}: {str(row.get('error') or row.get('status') or 'unavailable')[:180]}")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\\n'.join(lines) + '\\n')
          if failed:
              print(f"::warning title=Official data degraded::{len(failed)} official sources failed; health-only checks do not certify live signal readiness")
          PY
      - name: Publish health snapshot to durable bot-state
        run: |
          set -euo pipefail
          mkdir -p state/runtime/public/data
          cp public/data/free_data_health.json state/runtime/public/data/free_data_health.json
          cd state
          git config user.name "BLACK BOX Omega Free Data State"
          git config user.email "GHAZMOTIEBIPRO@users.noreply.github.com"
          git add runtime/public/data/free_data_health.json
          if git diff --cached --quiet; then
            echo "Free-data health snapshot unchanged."
            exit 0
          fi
          git commit -m "state: refresh free data health [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin bot-state && git push origin HEAD:bot-state; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$attempt"
          done
          echo "Free-data health bot-state publish failed after retries."
          exit 1
