name: BLACK BOX Free Data Health

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 13-21 * * 1-5"
  push:
    branches: [main]
    paths:
      - "research/free_data_sources.json"
      - "options_radar/free_data_health.py"
      - ".github/workflows/free-data-health.yml"

concurrency:
  group: black-box-free-data-health
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          ref: bot-state
          fetch-depth: 0
          path: state
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Check public sources without failing the pipeline
        run: python options_radar/free_data_health.py
      - name: Publish health snapshot to durable bot-state
        run: |
          set -euo pipefail
          mkdir -p state/runtime/public/data
          cp public/data/free_data_health.json state/runtime/public/data/free_data_health.json
          cd state
          git config user.name "BLACK BOX Omega Free Data State"
          git config user.email "GHAZMOTIEBIPRO@users.noreply.github.com"
          git add runtime/public/data/free_data_health.json
          if git diff --cached --quiet; then
            echo "Free-data health snapshot unchanged."
            exit 0
          fi
          git commit -m "state: refresh free data health [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin bot-state && git push origin HEAD:bot-state; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$attempt"
          done
          echo "Free-data health bot-state publish failed after retries."
          exit 1
