name: GHAZI RADAR Market Index Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_index_context.py"
      - "scripts/build_index_chart_snapshot.py"
      - "options_radar/index_direction.py"
      - ".github/workflows/index-radar.yml"
  # Cadence is owned by market-orchestrator.yml (bounded, ~2h in session);
  # the former cron here was never delivered by GitHub's scheduler.

permissions:
  contents: write

concurrency:
  group: ghazi-radar-index-context
  cancel-in-progress: false

env:
  YAHOO_AUTOMATED_ACCESS_APPROVED: ${{ vars.YAHOO_AUTOMATED_ACCESS_APPROVED || 'false' }}
  NASDAQ_WEB_AUTOMATION_APPROVED: ${{ vars.NASDAQ_WEB_AUTOMATION_APPROVED || 'false' }}

jobs:
  publish-index-research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - uses: actions/checkout@v4
        with:
          ref: bot-state
          path: state
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install existing pandas and market feed tools
        run: pip install -r app/requirements.txt
      - name: Produce bounded research snapshot with completed-bar checks
        run: >-
          PYTHONPATH=app python app/scripts/build_index_context.py
          --output state/runtime/public/data/index_radar.json
          --charts-output state/runtime/public/data/index_charts.json
      - name: Commit only the index research snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd state
          git config user.name "GHAZI RADAR Index Research"
          git config user.email "GHAZMOTIEBIPRO@users.noreply.github.com"
          git add runtime/public/data/index_radar.json runtime/public/data/index_charts.json
          if git diff --cached --quiet; then
            echo "No change in index research snapshot."
            exit 0
          fi
          git commit -m "state: research-only index levels [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin bot-state && git push origin HEAD:bot-state; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$attempt"
          done
          echo "Could not publish index research state safely" >&2
          exit 1
