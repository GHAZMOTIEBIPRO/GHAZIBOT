name: GHAZI RADAR Daily Plan (pre-open)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "options_radar/daily_plan.py"
      - "scripts/build_daily_plan.py"
      - ".github/workflows/daily-plan.yml"
  # Before the New York open in both EDT (11:47 UTC = 07:47 ET) and EST
  # (12:47 UTC = 07:47 ET); the script reads the XNYS calendar itself.
  # A midday run adds a dated update (17:17 UTC = 13:17 EDT / 12:17 EST).
  schedule:
    - cron: "47 11 * * 1-5"
    - cron: "47 12 * * 1-5"
    - cron: "17 17 * * 1-5"

permissions:
  contents: write

concurrency:
  group: ghazi-radar-daily-plan
  cancel-in-progress: false

jobs:
  daily-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_INTERNAL_DATA_USE_AUTHORIZED: ${{ vars.ALPACA_INTERNAL_DATA_USE_AUTHORIZED || 'false' }}
      # Private delivery: owner's personal chat only (output_policy.deliver_private
      # checks it differs from the broadcast chat and that Telegram calls it private).
      ALPACA_PRIVATE_ALERTS_AUTHORIZED: ${{ vars.ALPACA_PRIVATE_ALERTS_AUTHORIZED || 'false' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - uses: actions/checkout@v4
        with:
          ref: bot-state
          fetch-depth: 0
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies (package import needs them)
        run: pip install -r app/requirements.txt
      # This workflow is the only writer of daily_plan.json and state/daily_plan/.
      # Owner-private plans (Alpaca, no redistribution) go to the runner's temp
      # directory only and are never committed.
      - name: Build the pre-open sheet
        run: |
          cd app
          python -m scripts.build_daily_plan \
            --data-dir ../state/runtime/public/data \
            --output ../state/runtime/public/data/daily_plan.json \
            --morning-dir ../state/state/daily_plan \
            --private-output "$RUNNER_TEMP/private_plan.json"
      - name: Publish the public sheet and the morning copy
        shell: bash
        run: |
          set -euo pipefail
          cd state
          git config user.name "GHAZI RADAR Daily Plan"
          git config user.email "GHAZMOTIEBIPRO@users.noreply.github.com"
          git add runtime/public/data/daily_plan.json
          if [[ -d state/daily_plan ]]; then
            git add state/daily_plan
          fi
          if git diff --cached --quiet; then
            echo "Daily plan unchanged."
            exit 0
          fi
          git commit -m "state: pre-open daily plan sheet [skip ci]"
          for attempt in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin bot-state && git push origin HEAD:bot-state; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2 + RANDOM % 5))
          done
          echo "Failed to publish the daily plan after retries." >&2
          exit 1
