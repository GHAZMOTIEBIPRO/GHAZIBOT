name: GHAZI Evidence Strength Score

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_site_strength.py"
      - "scripts/build_data_hub.py"
      - "scripts/build_source_log.py"
      - "scripts/build_platform_scorecards.py"
      - "scripts/build_trading_readiness.py"
      - "data/source_rights.json"
      - "tests/test_site_strength.py"
      - ".github/workflows/site-evidence-strength.yml"
  workflow_run:
    workflows:
      - GHAZI Stock Watch OHLC Charts
      - GHAZI Free Options and SEC Alternative Sources
      - GHAZI RADAR Official SEC Issuer Filings
      - BLACK BOX Omega Stock Walk Forward
    types: [completed]
    branches: [main]
  schedule:
    - cron: "15 1,7,13,19 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: ghazi-evidence-strength-publisher
  cancel-in-progress: false

env:
  YAHOO_AUTOMATED_ACCESS_APPROVED: ${{ vars.YAHOO_AUTOMATED_ACCESS_APPROVED || 'false' }}
  NASDAQ_WEB_AUTOMATION_APPROVED: ${{ vars.NASDAQ_WEB_AUTOMATION_APPROVED || 'false' }}
  OCC_MARKET_DATA_AUTOMATION_APPROVED: ${{ vars.OCC_MARKET_DATA_AUTOMATION_APPROVED || 'false' }}
  NASDAQTRADER_AUTOMATION_APPROVED: ${{ vars.NASDAQTRADER_AUTOMATION_APPROVED || 'false' }}
  FINRA_API_AUTOMATION_APPROVED: ${{ vars.FINRA_API_AUTOMATION_APPROVED || 'false' }}
  FRED_AUTOMATION_APPROVED: ${{ vars.FRED_AUTOMATION_APPROVED || 'false' }}
  BLS_AUTOMATION_APPROVED: ${{ vars.BLS_AUTOMATION_APPROVED || 'false' }}
  GOOGLE_NEWS_AUTOMATION_APPROVED: ${{ vars.GOOGLE_NEWS_AUTOMATION_APPROVED || 'false' }}
  PRESS_WIRE_RSS_APPROVED: ${{ vars.PRESS_WIRE_RSS_APPROVED || 'false' }}

jobs:
  evidence-readiness:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - uses: actions/checkout@v4
        with:
          ref: bot-state
          path: state
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Score only actual source reports without model downloads or market requests
        shell: bash
        run: |
          set -euo pipefail
          python app/scripts/build_site_strength.py \
            --charts state/runtime/public/data/stock_watch_charts.json \
            --agreement state/runtime/public/data/source_agreement.json \
            --sec state/runtime/public/data/sec_filing_pulse.json \
            --free-options state/runtime/public/data/free_options_sources.json \
            --walk-forward state/state/stocks/stock_walk_forward.json \
            --output state/runtime/public/data/site_strength.json
      - name: GHAZI Market Data Hub catalog (reads published files only)
        run: >-
          python app/scripts/build_data_hub.py
          --data-dir state/runtime/public/data
          --output state/runtime/public/data/data_hub.json
      - name: Operational source log (fetch outcomes from bot-state history, no requests)
        run: python app/scripts/build_source_log.py --repo state --output state/runtime/public/data/source_log.json
      - name: Independent platform scorecards (no combined score)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python app/scripts/build_platform_scorecards.py
          --data-dir state/runtime/public/data
          --state-dir state/state
          --runtime-dir state/runtime
          --output state/runtime/public/data/platform_scorecards.json
      - name: Evidence-based trade-readiness verdict (independent market-data and OOS gates)
        run: |
          python app/scripts/build_trading_readiness.py \
            --agreement state/runtime/public/data/source_agreement.json \
            --charts state/runtime/public/data/stock_watch_charts.json \
            --operations state/runtime/public/data/data-status.json \
            --access state/runtime/public/data/production_access_health.json \
            --audit state/runtime/public/data/stock_audit_public.json \
            --walk state/state/stocks/stock_walk_forward.json \
            --targets state/runtime/data/live/omega_target_calibration.json \
            --options state/state/performance/options_performance_report.json \
            --stages state/runtime/public/data/explosion_stage_evaluation.json \
            --strength state/runtime/public/data/site_strength.json \
            --output state/runtime/public/data/trading_readiness.json
      - name: Publish only source-backed readiness report
        shell: bash
        run: |
          set -euo pipefail
          cd state
          git config user.name "GHAZI Evidence Audit"
          git config user.email "GHAZMOTIEBIPRO@users.noreply.github.com"
          git add runtime/public/data/site_strength.json runtime/public/data/data_hub.json runtime/public/data/platform_scorecards.json runtime/public/data/trading_readiness.json runtime/public/data/source_log.json
          if git diff --cached --quiet; then
            echo "Evidence report unchanged"
            exit 0
          fi
          git commit -m "state: audited research readiness score [skip ci]"
          for attempt in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin bot-state && git push origin HEAD:bot-state; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2 + RANDOM % 5))
          done
          echo "Could not publish source-backed score" >&2
          exit 1
