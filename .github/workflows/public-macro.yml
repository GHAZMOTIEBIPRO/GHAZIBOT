name: GHAZI RADAR Public Macro (CFTC + Treasury)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "options_radar/public_macro.py"
      - "scripts/build_public_macro.py"
      - "options_radar/macro_regimes.py"
      - "scripts/build_macro_regimes.py"
      - ".github/workflows/public-macro.yml"
  # Treasury posts the daily curve after the 15:30 ET quote window; CFTC
  # posts Traders in Financial Futures on Friday afternoon ET. Two weekday
  # runs cover both without polling.
  schedule:
    - cron: "43 12 * * 1-5"
    - cron: "43 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: ghazi-radar-public-macro
  cancel-in-progress: false

jobs:
  update-public-macro:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - uses: actions/checkout@v4
        with:
          ref: bot-state
          fetch-depth: 0
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch CFTC positioning and the Treasury curve (standard library only)
        id: macro
        run: >-
          python app/scripts/build_public_macro.py
          --output state/runtime/public/data/public_macro.json
          --history macro_history.json
      # This workflow is the only writer of macro_regimes.json. A failure here
      # keeps the previous regime file and never blocks the macro publish.
      - name: Install the change-point library (ruptures, BSD-2-Clause)
        id: regime_deps
        if: steps.macro.outcome == 'success'
        continue-on-error: true
        run: pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "ruptures==1.1.9"
      - name: Structural breaks in the curve and positioning
        if: steps.macro.outcome == 'success' && steps.regime_deps.outcome == 'success'
        continue-on-error: true
        run: >-
          python app/scripts/build_macro_regimes.py
          --history macro_history.json
          --output state/runtime/public/data/macro_regimes.json
      - name: Publish only the public macro document to durable state
        shell: bash
        run: |
          set -euo pipefail
          cd state
          git config user.name "GHAZI RADAR Public Macro"
          git config user.email "GHAZMOTIEBIPRO@users.noreply.github.com"
          git add runtime/public/data/public_macro.json
          if [[ -f runtime/public/data/macro_regimes.json ]]; then
            git add runtime/public/data/macro_regimes.json
          fi
          if git diff --cached --quiet; then
            echo "Public macro unchanged."
            exit 0
          fi
          git commit -m "state: CFTC positioning and Treasury curve [skip ci]"
          for attempt in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin bot-state && git push origin HEAD:bot-state; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2 + RANDOM % 5))
          done
          echo "Failed to publish public macro after retries." >&2
          exit 1
