name: BLACK BOX Omega Classical Direction Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/classical-direction-radar.yml"
      - "options_radar/classical_stock_direction.py"
      - "scripts/run_classical_direction_radar.py"
      - "scripts/send_classical_direction_alerts.py"
  schedule:
    - cron: "*/15 13-21 * * 1-5"

concurrency:
  group: black-box-omega-classical-direction
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  classical-direction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'GHAZI Classical Direction GHAZMOTIEBIPRO@users.noreply.github.com' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
      TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL || 'https://sandbox.tradier.com' }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_STOCK_FEED: ${{ secrets.ALPACA_STOCK_FEED || 'iex' }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      DAILY_PRICE_PROVIDER_ORDER: ${{ secrets.DAILY_PRICE_PROVIDER_ORDER || 'tiingo,finnhub,tradier,alpaca,twelve_data,polygon,alpha_vantage,yahoo' }}
      INTRADAY_PRICE_PROVIDER_ORDER: ${{ secrets.INTRADAY_PRICE_PROVIDER_ORDER || 'tiingo,finnhub,tradier,alpaca,twelve_data,polygon,alpha_vantage,yahoo' }}
      CLASSICAL_DIRECTION_MAX_SYMBOLS: ${{ secrets.CLASSICAL_DIRECTION_MAX_SYMBOLS || '48' }}
      CLASSICAL_MIN_DOLLAR_VOLUME: ${{ secrets.CLASSICAL_MIN_DOLLAR_VOLUME || '100000000' }}
      CLASSICAL_MIN_DATA_COVERAGE: ${{ secrets.CLASSICAL_MIN_DATA_COVERAGE || '0.60' }}
      CLASSICAL_FETCH_WORKERS: ${{ secrets.CLASSICAL_FETCH_WORKERS || '3' }}
      CLASSICAL_ALERT_MAX: ${{ secrets.CLASSICAL_ALERT_MAX || '3' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Check U.S. regular session
        id: market
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timezone
          import exchange_calendars as xcals
          import pandas as pd

          event = os.getenv('GITHUB_EVENT_NAME')
          if event == 'workflow_dispatch':
              print('scan=true')
              print('send=true')
              print('reason=manual_dispatch')
              raise SystemExit
          if event == 'push':
              print('scan=true')
              print('send=false')
              print('reason=push_validation_only')
              raise SystemExit

          cal = xcals.get_calendar('XNYS')
          minute = pd.Timestamp(datetime.now(timezone.utc)).floor('min')
          try:
              is_open = bool(cal.is_open_on_minute(minute))
          except Exception:
              is_open = False
          print(f"scan={'true' if is_open else 'false'}")
          print(f"send={'true' if is_open else 'false'}")
          print(f"reason={'regular_session' if is_open else 'market_closed'}")
          PY

      - name: Run classical direction radar
        if: steps.market.outputs.scan == 'true'
        run: >-
          python -m scripts.run_classical_direction_radar
          --output public/data/classical_direction_latest.json
          --max-symbols "$CLASSICAL_DIRECTION_MAX_SYMBOLS"

      - name: Validate classical-only semantics
        if: steps.market.outputs.scan == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('public/data/classical_direction_latest.json').read_text(encoding='utf-8'))
          assert payload['path'] == 'classical_direction'
          policy = payload['policy']
          assert policy['company_only'] is True
          assert policy['option_chain_data_used_for_direction'] is False
          assert policy['options_flow_used'] is False
          assert policy['greeks_used'] is False
          assert policy['rsi_used'] is False
          assert policy['macd_used'] is False
          assert policy['vwap_used'] is False
          assert policy['ict_smc_used'] is False
          assert policy['news_used_for_direction'] is False
          assert policy['fundamentals_used_for_direction'] is False
          assert payload['summary']['operational_status'] == 'READY'
          assert payload['summary']['data_coverage_ratio'] >= payload['summary']['minimum_data_coverage_ratio']
          assert payload['market_data']['fail_closed'] is True
          assert payload['market_data']['missing_data_is_wait'] is False
          for row in payload.get('signals', []):
              assert row['decision'] in {'CALL', 'PUT'}
              assert row['uses_option_chain_data'] is False
              assert row['optionability_verified_by_occ'] is True
          print('Classical direction semantics passed.')
          PY

      - name: Upload classical direction payload
        if: always() && steps.market.outputs.scan == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: classical-direction-radar
          path: public/data/classical_direction_latest.json
          if-no-files-found: error
          retention-days: 14

      - name: Restore persistent Telegram destination
        if: steps.market.outputs.send == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p telegram_runtime
          for workflow in classical-direction-radar.yml stock-telegram-alerts.yml radar-health.yml options-telegram-alerts.yml; do
            for run_id in $(gh run list --workflow "$workflow" --status success --branch main --limit 10 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              rm -f telegram_runtime/connection.enc telegram_runtime/connection.json
              if gh run download "$run_id" -n telegram-connection -D telegram_runtime >/dev/null 2>&1; then
                [[ -s telegram_runtime/connection.enc ]] && break 2
              fi
            done
          done
          if [[ -s telegram_runtime/connection.enc && -n "$TELEGRAM_BOT_TOKEN" ]]; then
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in telegram_runtime/connection.enc \
              -out telegram_runtime/connection.json \
              -pass env:TELEGRAM_BOT_TOKEN || rm -f telegram_runtime/connection.json
          fi

      - name: Resolve Telegram destination
        if: steps.market.outputs.send == 'true'
        run: python scripts/telegram_connection_bootstrap.py --connection-path telegram_runtime/connection.json

      - name: Restore classical alert state
        if: steps.market.outputs.send == 'true' && env.TELEGRAM_READY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/live .classical-state
          for run_id in $(gh run list --workflow classical-direction-radar.yml --status success --branch main --limit 8 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            rm -rf .classical-state && mkdir -p .classical-state
            if gh run download "$run_id" -n classical-direction-state -D .classical-state >/dev/null 2>&1; then
              cp -f .classical-state/classical_direction_alert_state.json data/live/classical_direction_alert_state.json 2>/dev/null || true
              break
            fi
          done

      - name: Send Arabic classical direction alerts
        if: steps.market.outputs.send == 'true' && env.TELEGRAM_READY == 'true'
        run: >-
          python scripts/send_classical_direction_alerts.py
          --payload public/data/classical_direction_latest.json
          --state data/live/classical_direction_alert_state.json

      - name: Upload classical alert state
        if: steps.market.outputs.send == 'true' && env.TELEGRAM_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: classical-direction-state
          path: data/live/classical_direction_alert_state.json
          if-no-files-found: warn
          retention-days: 30

      - name: Seal Telegram destination
        if: always() && steps.market.outputs.send == 'true' && env.TELEGRAM_READY == 'true'
        shell: bash
        run: |
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in telegram_runtime/connection.json \
            -out telegram_runtime/connection.enc \
            -pass env:TELEGRAM_BOT_TOKEN
          rm -f telegram_runtime/connection.json

      - name: Upload encrypted Telegram destination
        if: always() && steps.market.outputs.send == 'true' && env.TELEGRAM_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-connection
          path: telegram_runtime/connection.enc
          if-no-files-found: error
          retention-days: 90

      - name: Closed-market status
        if: steps.market.outputs.scan != 'true'
        run: echo "Classical direction radar skipped because the U.S. regular session is closed."

      - name: Push validation-only status
        if: steps.market.outputs.scan == 'true' && steps.market.outputs.send != 'true'
        run: echo "Classical direction radar validated without sending a pre-market Telegram alert."
