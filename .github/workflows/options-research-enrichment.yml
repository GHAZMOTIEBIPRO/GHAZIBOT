name: BLACK BOX Omega Options Research Enrichment

on:
  workflow_run:
    workflows:
      - "BLACK BOX Omega Options Contract Radar"
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: black-box-omega-options-research
  cancel-in-progress: true

jobs:
  enrich:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SIGNAL_JOURNAL_PATH: data/live/options_signals.jsonl
      OUTCOME_PATH: data/live/options_outcomes.json
      CALIBRATION_PATH: data/live/options_calibration.json
      ADAPTIVE_LEARNING_PATH: data/live/adaptive_learning.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Download current-run options payload
        id: payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .source public/data data/live
          found=false
          if gh run download "${{ github.event.workflow_run.id }}" -n independent-options-radar -D .source >/dev/null 2>&1; then
            if [[ -s .source/options_latest.json ]]; then
              cp .source/options_latest.json public/data/options_latest.json
              found=true
            fi
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Restore prior research state
        if: steps.payload.outputs.found == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .prior data/live
          for run_id in $(gh run list --workflow options-research-enrichment.yml --status success --branch main --limit 6 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            rm -rf .prior && mkdir -p .prior
            if gh run download "$run_id" -n options-research-state -D .prior >/dev/null 2>&1; then
              cp -f .prior/options_signals.jsonl data/live/options_signals.jsonl 2>/dev/null || true
              cp -f .prior/options_outcomes.json data/live/options_outcomes.json 2>/dev/null || true
              break
            fi
          done

      - name: Restore adaptive evidence model
        if: steps.payload.outputs.found == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .learning data/live
          for run_id in $(gh run list --workflow adaptive-review.yml --status success --branch main --limit 6 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            rm -rf .learning && mkdir -p .learning
            if gh run download "$run_id" -n adaptive-learning-state -D .learning >/dev/null 2>&1; then
              cp -f .learning/adaptive_learning.json data/live/adaptive_learning.json 2>/dev/null || true
              cp -f .learning/options_outcomes.json data/live/options_outcomes.json 2>/dev/null || true
              break
            fi
          done

      - name: Enrich fresh research evidence
        if: steps.payload.outputs.found == 'true'
        run: python -m scripts.enrich_options_radar_research --payload public/data/options_latest.json

      - name: Stage research state
        if: steps.payload.outputs.found == 'true'
        shell: bash
        run: |
          mkdir -p .state
          [[ -f data/live/options_signals.jsonl ]] && cp data/live/options_signals.jsonl .state/options_signals.jsonl
          [[ -f data/live/options_outcomes.json ]] && cp data/live/options_outcomes.json .state/options_outcomes.json

      - name: Upload research payload
        if: steps.payload.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: independent-options-research
          path: public/data/options_latest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload research state
        if: steps.payload.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: options-research-state
          path: .state/
          if-no-files-found: error
          retention-days: 30

      - name: No-current-payload status
        if: steps.payload.outputs.found != 'true'
        run: echo "Current options run produced no live payload; research enrichment skipped."
