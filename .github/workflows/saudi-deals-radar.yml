name: Radar Deals Saudi V4.3
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "saudi_deals_radar/scripts/**"
      - "saudi_deals_radar/data/sources/**"
      - "saudi_deals_radar/public/index.html"
      - "saudi_deals_radar/public/app.js"
      - "saudi_deals_radar/public/styles.css"
      - "saudi_deals_radar/package.json"
      - ".github/workflows/saudi-deals-radar.yml"
  schedule:
    - cron: "10 */3 * * *"
permissions:
  contents: write
concurrency:
  group: saudi-deals-radar-v43
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Self tests
        working-directory: saudi_deals_radar
        run: npm test
      - name: Scan rotating merchant universe
        working-directory: saudi_deals_radar
        env:
          RADAR_MAX_SOURCES: "28"
          RADAR_MAX_PRODUCTS_PER_SOURCE: "7"
          RADAR_EXTRA_DEAL_PAGES: "3"
          RADAR_PAGE_DELAY_MS: "250"
          RADAR_PRODUCT_DELAY_MS: "120"
          RADAR_FETCH_TIMEOUT_MS: "8000"
        run: npm run scan
      - name: Sync Vercel public data
        working-directory: saudi_deals_radar
        run: node scripts/sync-vercel.mjs
      - name: Commit refreshed radar state
        run: |
          if git diff --quiet -- saudi_deals_radar/public/data saudi_deals_radar/data/history.json saudi_deals_radar/data/scan-state.json public/deals/data; then
            echo "No radar data changes"
            exit 0
          fi
          git config user.name "Radar Deals Bot"
          git config user.email "actions@users.noreply.github.com"
          git add saudi_deals_radar/public/data saudi_deals_radar/data/history.json saudi_deals_radar/data/scan-state.json public/deals/data
          git commit -m "data: refresh Saudi deals radar V4.3"
          git pull --rebase origin main
          git push
