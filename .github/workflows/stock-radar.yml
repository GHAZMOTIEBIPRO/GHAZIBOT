name: BLACK BOX Omega Stock Radar

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Specific successful Fast Explosion Radar run ID for same-cycle validation"
        required: false
        type: string
  # Registration-only smoke after this workflow file is deployed to main.
  # Absolutely no price scan, Telegram, secret access or market signal on push.
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock-radar.yml"

concurrency:
  # Read-only registration checks must never cancel a real stock alert job.
  group: ${{ github.event_name == 'push' && 'black-box-stock-registration' || 'black-box-omega-stock-radar' }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  YAHOO_AUTOMATED_ACCESS_APPROVED: ${{ vars.YAHOO_AUTOMATED_ACCESS_APPROVED || 'false' }}
  NASDAQ_WEB_AUTOMATION_APPROVED: ${{ vars.NASDAQ_WEB_AUTOMATION_APPROVED || 'false' }}

jobs:
  verify-workflow-registration:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Confirm GitHub accepted Stock Radar workflow
        shell: bash
        run: |
          set -euo pipefail
          echo "Stock Radar registration smoke PASS on $GITHUB_SHA"
          echo "No stock scan, Telegram sends, or secret access permitted in this job."
          echo "Stock Radar registered at commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  deep-stock-validation:
    # The only path permitted to examine stocks and deliver Telegram alerts.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'GHAZI Stock Radar GHAZMOTIEBIPRO@users.noreply.github.com' }}
      OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ADAPTIVE_LEARNING_PATH: data/live/adaptive_learning.json
      STOCK_OUTCOME_PATH: data/live/stock_outcomes.json
      STOCK_DISCOVERY_MAX_AGE_MINUTES: ${{ secrets.STOCK_DISCOVERY_MAX_AGE_MINUTES || '90' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      STOCK_ALERT_MIN_SCORE: ${{ secrets.STOCK_ALERT_MIN_SCORE || '72' }}
      STOCK_WATCH_MIN_SCORE: ${{ secrets.STOCK_WATCH_MIN_SCORE || '62' }}
      STOCK_ALERT_MAX: ${{ secrets.STOCK_ALERT_MAX || '0' }}
      FAST_MARKET_STATE_PATH: data/live/fast_market_state.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Check U.S. stock market activity window before validation
        id: market_day
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from options_radar.market_clock import market_clock_state
          state = market_clock_state()
          print(f"open={'true' if state.is_extended_activity_open else 'false'}")
          print(f"date={state.session_date}")
          print(f"reason={state.reason}")
          PY

      - name: Restore fresh stock discovery payload
        if: steps.market_day.outputs.open == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/live
          current="${{ inputs.source_run_id }}"
          if [[ -n "$current" ]]; then
            if [[ ! "$current" =~ ^[0-9]+$ ]]; then
              echo "::error::Invalid Fast Radar source run ID"
              exit 1
            fi
            status=""
            conclusion=""
            for attempt in {1..18}; do
              metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$current" 2>/dev/null || true)"
              source_name="$(printf '%s' "$metadata" | jq -r '.name // empty')"
              source_branch="$(printf '%s' "$metadata" | jq -r '.head_branch // empty')"
              status="$(printf '%s' "$metadata" | jq -r '.status // empty')"
              conclusion="$(printf '%s' "$metadata" | jq -r '.conclusion // empty')"
              if [[ "$source_name" != "BLACK BOX Omega Fast Explosion Radar" || "$source_branch" != "main" ]]; then
                echo "::error::Source is not a main-branch Fast Explosion Radar run"
                exit 1
              fi
              if [[ "$status" == "completed" ]]; then break; fi
              echo "Waiting for source Fast Radar #$current ($attempt/18)"
              sleep 5
            done
            if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
              echo "::error::Fast Radar did not finish successfully: $status $conclusion"
              exit 1
            fi
            restored=false
            for attempt in {1..4}; do
              rm -f data/live/fast_explosion_scan.json
              if gh run download "$current" -n fast-market-state -D data/live >/dev/null 2>&1 \
                && [[ -s data/live/fast_explosion_scan.json ]]; then
                restored=true
                break
              fi
              sleep 3
            done
            if [[ "$restored" != "true" ]]; then
              echo "::error::Exact successful Fast Radar artifact is missing: $current"
              exit 1
            fi
            echo "Stock Radar source verified: #$current, main, completed/success, matching artifact"
          else
            # Explicit manual mode only: take the latest successfully finished
            # fast scan, then reject it below if older than the freshness gate.
            for run_id in $(gh run list --workflow fast-explosion-radar.yml --status success --branch main --limit 6 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              if gh run download "$run_id" -n fast-market-state -D data/live >/dev/null 2>&1; then
                [[ -s data/live/fast_explosion_scan.json ]] && break
              fi
            done
          fi
          test -s data/live/fast_explosion_scan.json
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = json.loads(Path('data/live/fast_explosion_scan.json').read_text(encoding='utf-8'))
          raw = str(payload.get('generated_at') or '').replace('Z', '+00:00')
          if not raw:
              raise SystemExit('Fast stock discovery has no generated_at; refusing stale fallback.')
          stamp = datetime.fromisoformat(raw)
          if stamp.tzinfo is None:
              stamp = stamp.replace(tzinfo=timezone.utc)
          age = (datetime.now(timezone.utc) - stamp.astimezone(timezone.utc)).total_seconds() / 60.0
          maximum = float(os.getenv('STOCK_DISCOVERY_MAX_AGE_MINUTES', '90'))
          if age < -5 or age > maximum:
              raise SystemExit(f'Fast stock discovery age {age:.1f}m exceeds safe maximum {maximum:.1f}m.')
          print(f'Fresh stock discovery accepted: age={age:.1f}m max={maximum:.1f}m')
          PY

      - name: Restore stock outcome state
        if: steps.market_day.outputs.open == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .stock-state-restore data/live
          for run_id in $(gh run list --workflow stock-radar.yml --status success --branch main --limit 8 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            rm -rf .stock-state-restore && mkdir -p .stock-state-restore
            if gh run download "$run_id" -n stock-radar-state -D .stock-state-restore >/dev/null 2>&1; then
              cp -f .stock-state-restore/stock_outcomes.json data/live/stock_outcomes.json 2>/dev/null || true
              break
            fi
          done

      - name: Restore adaptive learning model
        if: steps.market_day.outputs.open == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .learning-restore data/live
          for run_id in $(gh run list --workflow adaptive-review.yml --status success --branch main --limit 6 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            rm -rf .learning-restore && mkdir -p .learning-restore
            if gh run download "$run_id" -n adaptive-learning-state -D .learning-restore >/dev/null 2>&1; then
              cp -f .learning-restore/adaptive_learning.json data/live/adaptive_learning.json 2>/dev/null || true
              break
            fi
          done

      - name: Deep validate stock causes with official-first policy
        if: steps.market_day.outputs.open == 'true'
        run: >-
          python -m scripts.run_stock_radar_independent
          --fast data/live/fast_explosion_scan.json
          --output public/data/stocks_latest.json

      - name: Add regime, outcome and shadow-learning evidence
        if: steps.market_day.outputs.open == 'true'
        run: python -m scripts.enrich_stock_radar_research --payload public/data/stocks_latest.json

      - name: Validate stock-path independence and learning guard
        if: steps.market_day.outputs.open == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('public/data/stocks_latest.json').read_text(encoding='utf-8'))
          assert payload['path'] == 'stocks'
          assert payload['independent_from_options_radar'] is True
          assert payload['policy']['options_flow_required'] is False
          assert payload['policy']['ludp_is_price_confirmation_not_primary_cause'] is True
          assert payload['policy']['adaptive_learning_changes_live_alerts'] is False
          for row in payload.get('stocks', []):
              assert row.get('independent_from_options_radar') is True
              assert row.get('options_required_for_stock_signal') is False
              shadow = row.get('shadow_analysis') or {}
              assert shadow.get('live_alert_eligibility_changed') is False
              explosion = row.get('explosion_cause') or {}
              manipulation = row.get('manipulation_risk') or {}
              assert explosion.get('causation_proven') is False
              assert manipulation.get('is_accusation') is False
              assert row.get('alert_stage') in {'WATCH','CONFIRMED','NO_CHASE','NONE'}
          print('Independent stock path + shadow-learning guard passed.')
          PY

      - name: Upload independent stock radar
        if: steps.market_day.outputs.open == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: independent-stock-radar
          path: public/data/stocks_latest.json
          if-no-files-found: error
          retention-days: 7

      - name: Stage stock learning state
        if: steps.market_day.outputs.open == 'true'
        shell: bash
        run: |
          mkdir -p .stock-state-upload data/live
          if [[ ! -f data/live/stock_outcomes.json ]]; then
            printf '%s\n' '{"schema_version":1,"updated_at":null,"signals":{}}' > data/live/stock_outcomes.json
          fi
          cp -f data/live/stock_outcomes.json .stock-state-upload/stock_outcomes.json

      - name: Upload stock learning state
        if: steps.market_day.outputs.open == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stock-radar-state
          path: .stock-state-upload/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Restore centralized Telegram destination for direct delivery
        if: steps.market_day.outputs.open == 'true' && env.TELEGRAM_CHAT_ID == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p telegram_runtime
          for workflow in telegram-connection-keeper.yml stock-radar.yml stock-telegram-alerts.yml; do
            for run_id in $(gh run list --workflow "$workflow" --status success --branch main --limit 8 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              rm -f telegram_runtime/connection.enc telegram_runtime/connection.json
              if gh run download "$run_id" -n telegram-connection -D telegram_runtime >/dev/null 2>&1; then
                [[ -s telegram_runtime/connection.enc ]] && break 2
              fi
            done
          done
          if [[ -s telegram_runtime/connection.enc && -n "$TELEGRAM_BOT_TOKEN" ]]; then
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in telegram_runtime/connection.enc \
              -out telegram_runtime/connection.json \
              -pass env:TELEGRAM_BOT_TOKEN || rm -f telegram_runtime/connection.json
          fi

      - name: Resolve Telegram destination for direct delivery
        if: steps.market_day.outputs.open == 'true'
        run: python scripts/telegram_connection_bootstrap.py --connection-path telegram_runtime/connection.json

      - name: Expose stock Telegram readiness without leaking secrets
        if: steps.market_day.outputs.open == 'true'
        shell: bash
        run: |
          if [[ "${TELEGRAM_READY:-false}" != "true" ]]; then
            echo "::warning title=Stock Telegram not ready::No stock opportunities can be delivered. Check TELEGRAM_BOT_TOKEN and connection bootstrap; this does not mean no market opportunities exist."
          else
            echo "Stock Telegram connection ready; signal eligibility and dedupe will be audited."
          fi

      - name: Restore direct stock Telegram dedupe state
        if: steps.market_day.outputs.open == 'true' && env.TELEGRAM_READY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/live .stock-telegram-restore
          printf '{"sent":{}}\n' > data/live/stock_alert_state.json
          # Delivery state is valid evidence even when a prior run failed after
          # sending one message. Core market/learning state above remains success-only.
          for workflow in stock-radar.yml stock-telegram-alerts.yml; do
            for run_id in $(gh run list --workflow "$workflow" --status completed --branch main --limit 8 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              rm -rf .stock-telegram-restore && mkdir -p .stock-telegram-restore
              if gh run download "$run_id" -n stock-telegram-state -D .stock-telegram-restore >/dev/null 2>&1; then
                if [[ -s .stock-telegram-restore/stock_alert_state.json ]]; then
                  cp .stock-telegram-restore/stock_alert_state.json data/live/stock_alert_state.json
                  break 2
                fi
              fi
            done
          done

      - name: Send qualified stock alert directly after persisted validation
        if: steps.market_day.outputs.open == 'true' && env.TELEGRAM_READY == 'true'
        run: >-
          python -m scripts.send_independent_path_alerts
          --path stocks
          --payload public/data/stocks_latest.json
          --state data/live/stock_alert_state.json

      - name: Upload direct stock Telegram state
        if: always() && steps.market_day.outputs.open == 'true' && env.TELEGRAM_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stock-telegram-state
          path: data/live/stock_alert_state.json
          if-no-files-found: warn
          retention-days: 30

      - name: Closed-market status
        if: steps.market_day.outputs.open != 'true'
        run: echo "Stock radar skipped because New York is outside the 04:00-20:00 stock activity window or today is not an XNYS trading day; no historical discovery can be promoted as fresh."
