name: BLACK BOX Omega Telegram Alerts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/telegram_ping.txt"
  workflow_run:
    workflows: ["GHAZI Stocks and Options Radar"]
    types: [completed]
  schedule:
    - cron: "*/20 8-12 * * 1-5"
    - cron: "*/10 13-21 * * 1-5"
    - cron: "*/20 22-23 * * 1-5"

concurrency:
  group: black-box-omega-telegram
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_MIN_EXPLOSION_RANK: ${{ secrets.TELEGRAM_MIN_EXPLOSION_RANK || '80' }}
      TELEGRAM_MIN_EARLYNESS: ${{ secrets.TELEGRAM_MIN_EARLYNESS || '75' }}
      TELEGRAM_MAX_DILUTION_RISK: ${{ secrets.TELEGRAM_MAX_DILUTION_RISK || '60' }}
      TELEGRAM_MAX_RISK_PENALTY: ${{ secrets.TELEGRAM_MAX_RISK_PENALTY || '38' }}
      TELEGRAM_MAX_ALERTS_PER_RUN: ${{ secrets.TELEGRAM_MAX_ALERTS_PER_RUN || '3' }}
      TELEGRAM_MIN_NEWS_QUALITY: ${{ secrets.TELEGRAM_MIN_NEWS_QUALITY || '80' }}
      TELEGRAM_MIN_NEWS_MATERIALITY: ${{ secrets.TELEGRAM_MIN_NEWS_MATERIALITY || '75' }}
      TELEGRAM_MIN_NEWS_SOURCE_STRENGTH: ${{ secrets.TELEGRAM_MIN_NEWS_SOURCE_STRENGTH || '75' }}
      TELEGRAM_NEWS_MAX_AGE_DAYS: ${{ secrets.TELEGRAM_NEWS_MAX_AGE_DAYS || '3' }}
      TELEGRAM_MIN_PRICE_MOVE_PCT: ${{ secrets.TELEGRAM_MIN_PRICE_MOVE_PCT || '5' }}
      TELEGRAM_MAX_PRICE_MOVE_PCT: ${{ secrets.TELEGRAM_MAX_PRICE_MOVE_PCT || '28' }}
      TELEGRAM_MIN_PRICE_RVOL: ${{ secrets.TELEGRAM_MIN_PRICE_RVOL || '1.8' }}
      TELEGRAM_MIN_PRICE_STOCK_SCORE: ${{ secrets.TELEGRAM_MIN_PRICE_STOCK_SCORE || '70' }}
      TELEGRAM_MIN_DOLLAR_VOLUME: ${{ secrets.TELEGRAM_MIN_DOLLAR_VOLUME || '3000000' }}
      TELEGRAM_MIN_ASYMMETRIC_SCORE: ${{ secrets.TELEGRAM_MIN_ASYMMETRIC_SCORE || '62' }}
      TELEGRAM_MAX_ASYMMETRIC_ALERTS: ${{ secrets.TELEGRAM_MAX_ASYMMETRIC_ALERTS || '3' }}
      TELEGRAM_STATUS_INTERVAL_HOURS: ${{ secrets.TELEGRAM_STATUS_INTERVAL_HOURS || '4' }}
      OMEGA_DELTA_ALERT_MIN_SCORE: ${{ secrets.OMEGA_DELTA_ALERT_MIN_SCORE || '52' }}
      OMEGA_DELTA_MAX_ALERTS: ${{ secrets.OMEGA_DELTA_MAX_ALERTS || '3' }}
      OMEGA_DELTA_HISTORY_LENGTH: ${{ secrets.OMEGA_DELTA_HISTORY_LENGTH || '24' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telegram dependency
        run: pip install 'requests>=2.32,<3.0'

      - name: Restore encrypted persistent Telegram destination
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p telegram_runtime
          for workflow in telegram-alerts.yml fast-explosion-radar.yml; do
            for run_id in $(gh run list --workflow "$workflow" --status success --branch main --limit 15 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              rm -f telegram_runtime/connection.enc telegram_runtime/connection.json
              if gh run download "$run_id" -n telegram-connection -D telegram_runtime >/dev/null 2>&1; then
                if [[ -s telegram_runtime/connection.enc ]]; then
                  echo "Restored Telegram destination from prior successful run $run_id."
                  break 2
                fi
              fi
            done
          done
          if [[ -s telegram_runtime/connection.enc && -n "$TELEGRAM_BOT_TOKEN" ]]; then
            if ! openssl enc -d -aes-256-cbc -pbkdf2 \
              -in telegram_runtime/connection.enc \
              -out telegram_runtime/connection.json \
              -pass env:TELEGRAM_BOT_TOKEN; then
              echo "Stored Telegram destination could not be decrypted; automatic discovery will retry."
              rm -f telegram_runtime/connection.json
            fi
          fi

      - name: Resolve Telegram destination once and reuse forever
        run: python scripts/telegram_connection_bootstrap.py --connection-path telegram_runtime/connection.json

      - name: Run Telegram pre-explosion, news-shock and early price-explosion filters
        if: env.TELEGRAM_READY == 'true'
        run: python options_radar/telegram_notifier.py --payload public/data/latest.json

      - name: Run RGC/BNAI asymmetric explosion detector
        if: env.TELEGRAM_READY == 'true'
        run: python options_radar/asymmetric_explosion.py --payload public/data/latest.json

      - name: Run Delta and Effective Float pressure engine
        if: env.TELEGRAM_READY == 'true'
        run: python options_radar/explosion_intelligence.py --payload public/data/latest.json --send-telegram

      - name: Send radar heartbeat when no strong candidate
        if: env.TELEGRAM_READY == 'true'
        run: python options_radar/telegram_status.py --payload public/data/latest.json

      - name: Seal Telegram destination for future unattended runs
        if: always() && env.TELEGRAM_READY == 'true'
        shell: bash
        run: |
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in telegram_runtime/connection.json \
            -out telegram_runtime/connection.enc \
            -pass env:TELEGRAM_BOT_TOKEN
          rm -f telegram_runtime/connection.json

      - name: Upload encrypted Telegram destination
        if: always() && env.TELEGRAM_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-connection
          path: telegram_runtime/connection.enc
          if-no-files-found: error
          retention-days: 90

      - name: Persist Telegram and Delta states
        if: env.TELEGRAM_READY == 'true'
        shell: bash
        run: |
          git config user.name "black-box-omega-bot"
          git config user.email "actions@users.noreply.github.com"
          files=()
          for file in \
            data/live/telegram_alert_state.json \
            data/live/asymmetric_alert_state.json \
            data/live/telegram_status_state.json \
            data/live/delta_history.json \
            data/live/delta_signals.json \
            data/live/delta_alert_state.json; do
            [[ -f "$file" ]] && files+=("$file")
          done
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No Telegram/Delta state files to persist."
            exit 0
          fi
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "No Telegram/Delta state change."
          else
            git commit -m "data: update Telegram and Delta states [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
