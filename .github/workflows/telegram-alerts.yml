name: BLACK BOX Omega Legacy Unified Telegram - Disabled

# The former unified stock+options sender is deliberately retired.
# Stock and options now have independent discovery, state, scoring and Telegram
# workflows. Keeping this file (manual-only) preserves historical Actions runs so
# the new workflows can restore the encrypted Telegram destination during migration.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain migration
        run: |
          echo "Unified Telegram sender is disabled by design."
          echo "Stocks: .github/workflows/stock-telegram-alerts.yml"
          echo "Options: .github/workflows/options-telegram-alerts.yml"
          echo "No combined stock/options alert will be sent from this workflow."
