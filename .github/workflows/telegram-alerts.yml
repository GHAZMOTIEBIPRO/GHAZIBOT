name: BLACK BOX Omega Telegram Alerts

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["GHAZI Stocks and Options Radar"]
    types: [completed]

concurrency:
  group: black-box-omega-telegram
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_MIN_EXPLOSION_RANK: ${{ secrets.TELEGRAM_MIN_EXPLOSION_RANK || '80' }}
      TELEGRAM_MIN_EARLYNESS: ${{ secrets.TELEGRAM_MIN_EARLYNESS || '75' }}
      TELEGRAM_MAX_DILUTION_RISK: ${{ secrets.TELEGRAM_MAX_DILUTION_RISK || '60' }}
      TELEGRAM_MAX_RISK_PENALTY: ${{ secrets.TELEGRAM_MAX_RISK_PENALTY || '38' }}
      TELEGRAM_MAX_ALERTS_PER_RUN: ${{ secrets.TELEGRAM_MAX_ALERTS_PER_RUN || '3' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telegram dependency
        run: pip install 'requests>=2.32,<3.0'

      - name: Run Telegram pre-explosion filter
        run: python options_radar/telegram_notifier.py --payload public/data/latest.json

      - name: Persist Telegram alert state
        shell: bash
        run: |
          if [[ ! -f data/live/telegram_alert_state.json ]]; then
            echo "No Telegram state file to persist."
            exit 0
          fi
          git config user.name "black-box-omega-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live/telegram_alert_state.json
          if git diff --cached --quiet; then
            echo "No Telegram state change."
          else
            git commit -m "data: update Telegram alert state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
