name: GHAZI SPX Dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spx-dashboard.yml"
      - "options_radar/spx_external_gamma.py"
      - "scripts/build_spx_dashboard.py"
      - "options_radar/spx_decision.py"
permissions:
  contents: write
concurrency:
  group: ghazi-spx-dashboard-publisher
  cancel-in-progress: false
env:
  YAHOO_AUTOMATED_ACCESS_APPROVED: ${{ vars.YAHOO_AUTOMATED_ACCESS_APPROVED || 'false' }}
  NASDAQ_WEB_AUTOMATION_APPROVED: ${{ vars.NASDAQ_WEB_AUTOMATION_APPROVED || 'false' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/checkout@v4
        with:
          ref: bot-state
          fetch-depth: 0
          path: state
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Build SPX snapshot (blocked report while its sources are gated)
        run: python scripts/build_spx_dashboard.py --output public/data/spx_dashboard.json
      - name: Publish snapshot to durable bot-state
        run: |
          set -euo pipefail
          mkdir -p state/runtime/public/data
          cp public/data/spx_dashboard.json state/runtime/public/data/spx_dashboard.json
          cd state
          git config user.name "BLACK BOX Omega SPX State"
          git config user.email "GHAZMOTIEBIPRO@users.noreply.github.com"
          git add runtime/public/data/spx_dashboard.json
          if git diff --cached --quiet; then
            echo "SPX runtime snapshot unchanged."
            exit 0
          fi
          git commit -m "state: refresh SPX dashboard [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin bot-state && git push origin HEAD:bot-state; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$attempt"
          done
          echo "SPX bot-state publish failed after 3 retries."
          exit 1

