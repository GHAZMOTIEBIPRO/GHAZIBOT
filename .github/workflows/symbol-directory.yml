name: GHAZI Leaders Symbol Directory

# Only writer of runtime/public/data/symbol_directory.json on bot-state:
# current S&P 500 members (name, sector, SEC CIK) from the
# datasets/s-and-p-500-companies package (upstream Wikipedia, CC BY-SA).
# The upstream package refreshes a few times a week around 02:00 UTC.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_symbol_directory.py"
      - ".github/workflows/symbol-directory.yml"
  schedule:
    - cron: "17 4 * * 1,4"

permissions:
  contents: write

concurrency:
  group: ghazi-symbol-directory
  cancel-in-progress: false

jobs:
  directory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - uses: actions/checkout@v4
        with:
          ref: bot-state
          fetch-depth: 0
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "requests>=2.32,<3.0"
      # A rejected or unreachable source leaves the previous file in place and fails the job.
      - name: Build the leaders directory
        run: python app/scripts/build_symbol_directory.py --output state/runtime/public/data/symbol_directory.json
      - name: Publish the leaders directory
        shell: bash
        run: |
          set -euo pipefail
          cd state
          git config user.name "GHAZI Symbol Directory"
          git config user.email "GHAZMOTIEBIPRO@users.noreply.github.com"
          git add runtime/public/data/symbol_directory.json
          if git diff --cached --quiet; then
            echo "Directory unchanged."
            exit 0
          fi
          git commit -m "state: leaders symbol directory [skip ci]"
          for attempt in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin bot-state && git push origin HEAD:bot-state; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2 + RANDOM % 5))
          done
          echo "Failed to publish the directory after retries." >&2
          exit 1
