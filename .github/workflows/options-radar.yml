name: GHAZI Stocks and Options Radar

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "export_web.py"
      - "run_live_export.py"
      - "options_radar/**"
      - "scripts/calibration_gate.py"
      - "scripts/prime_sec_efts.py"
      - "scripts/apply_phase60.py"
      - "data/universe.txt"
      - "data/company_aliases.json"
      - "data/manual_refresh.txt"
      - "requirements.txt"
      - ".github/workflows/options-radar.yml"
  schedule:
    - cron: "7,37 13-21 * * 1-5"
    - cron: "45 12 * * 1-5"

concurrency:
  group: ghazi-market-radar
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPTIONS_PROVIDER: ${{ secrets.OPTIONS_PROVIDER || 'auto' }}
      MARKETDATA_TOKEN: ${{ secrets.MARKETDATA_TOKEN }}
      TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
      TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL || 'https://sandbox.tradier.com' }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      OPTIONS_PROVIDER_ORDER: ${{ secrets.OPTIONS_PROVIDER_ORDER || 'tradier,finnhub,yahoo' }}
      STOCK_PROVIDER_ORDER: ${{ secrets.STOCK_PROVIDER_ORDER || 'tiingo,finnhub,yahoo' }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_OPTIONS_FEED: ${{ secrets.ALPACA_OPTIONS_FEED || 'indicative' }}
      ALPACA_STOCK_FEED: ${{ secrets.ALPACA_STOCK_FEED || 'iex' }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      BENZINGA_TOKEN: ${{ secrets.BENZINGA_TOKEN }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      X_WATCH_ACCOUNTS: ${{ secrets.X_WATCH_ACCOUNTS || 'unusual_whales,spotgamma,CheddarFlow,Barchart,Benzinga,Cboe,NasdaqExchange,NYSE' }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT || 'GHAZI-Market-Radar/6.1' }}
      REDDIT_COMMUNITIES: ${{ secrets.REDDIT_COMMUNITIES || 'options,stocks,StockMarket,wallstreetbets,thetagang,investing,SecurityAnalysis' }}
      INTELLIGENCE_MAX_SYMBOLS: ${{ secrets.INTELLIGENCE_MAX_SYMBOLS || '15' }}
      INTELLIGENCE_MAX_CONTRACTS: ${{ secrets.INTELLIGENCE_MAX_CONTRACTS || '30' }}
      DAILY_PRICE_PROVIDER_ORDER: ${{ secrets.DAILY_PRICE_PROVIDER_ORDER || 'yahoo,tradier,alpaca,twelve_data,polygon,alpha_vantage' }}
      INTRADAY_PRICE_PROVIDER_ORDER: ${{ secrets.INTRADAY_PRICE_PROVIDER_ORDER || 'tradier,alpaca,twelve_data,polygon,yahoo,alpha_vantage' }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'GHAZI Market Radar 207104176+GHAZMOTIEBIPRO@users.noreply.github.com' }}
      OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
      FREE_SWING_MODE: "true"
      MIN_DTE: "14"
      MAX_DTE: "60"
      MIN_OPTION_VOLUME: "200"
      MIN_OPEN_INTEREST: "100"
      MAX_SPREAD_PCT: "0.15"
      MIN_ABS_DELTA: "0.30"
      MAX_ABS_DELTA: "0.60"
      MIN_VOL_TO_OI_RATIO: "1.50"
      HIGH_ACCUMULATION_RATIO: "3.00"
      MIN_VOLUME_SPIKE_RATIO: "2.00"
      FLOW_REQUIRE_VOLUME_SPIKE: "false"
      FLOW_HISTORY_MAX_CONTRACTS: "45"
      FLOW_HISTORY_WORKERS: "3"
      FLOW_HISTORY_LOOKBACK_DAYS: "14"
      FLOW_TOP_PER_SIDE: "15"
      MODD_VERSION: "2026.07-phase6.1-intelligence"
      MAX_UNIVERSE_SIZE: "150"
      CALIBRATION_MINIMUM_SAMPLE: "100"
      OUTCOME_MAX_AGE_DAYS: "60"
    steps:
      - uses: actions/checkout4v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Probe and cache SEC full-text evidence
        continue-on-error: true
        run: python scripts/prime_sec_efts.py
      - name: Generate separated stock and contract radar data
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" != "45 12 * * 1-5" ]]; then
            python run_live_export.py --top-stocks 15 --top-options 15 --skip-closed
          else
            python run_live_export.py --top-stocks 15 --top-options 15
          fi
      - name: Apply Phase 6.1 external intelligence and recommendation policy
        run: python scripts/apply_phase60.py
      - name: Evaluate calibration review gate
        id: calibration_gate
        run: python scripts/calibration_gate.py
      - name: Open one-time calibration review issue
        if: steps.calibration_gate.outputs.should_open == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          existing_url="$(gh issue list --state open --search 'Calibration review ready in:title' --json url --jq '.[0].url // empty')"
          if [[ -n "$existing_url" ]]; then
            issue_url="$existing_url"
          else
            issue_url="$(gh issue create \
              --title "Calibration review ready — ${{ env.MODEL_VERSION }}" \
              --body-file data/live/CALIBRATION_REVIEW.md)"
          fi
          python scripts/calibration_gate.py --mark "$issue_url"
          echo "Calibration review issue: $issue_url"
      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('public/data/latest.json').read_text(encoding='utf-8'))
          calibration = payload.get('calibration_gate', {})
          operations = payload.get('operational_status', {})
          performance = payload.get('performance', {})
          flow = payload.get('flow_summary', {})
          network = payload.get('source_network', {}).get('summary', {})
          intelligence = payload.get('intelligence', {}).get('summary', {})
          efts = operations.get('sec_fulltext_status', {})
          summary = [
              '# GHAZI Market Radar — Phase 6.1',
              '',
              f"- Model: `;{payload.get('model_version', 'unknown')}`",
              f"- Delivery: **dashboard only**",
              f"- Market: **{payload.get('market_regime', 'unknown')}**",
              f"- Stock candidates: **{payload.get('summary', {}).get('stock_candidates', 0)}**",
              f"- Strong stock recommendations: **{payload.get('summary', {}).get('stock_recommendations', 0)}**",
              f"- Strong contract recommendations: **{payload.get('summary', {}).get('contract_recommendations', 0)}**",
              f"- Top CALL: **{payload.get('summary', {}).get('top_call_contracts', 0)}**",
              f"- Top PUT: **{payload.get('summary', {}).get('top_put_contracts', 0)}**",
              f"- Active stock sources: **{network.get('active_stock_sources', 0)}**",
              f"- Active option sources: **{network.get('active_option_sources', 0)}**",
              f"- External intelligence sources successful: **{intelligence.get('successful_sources', 0)}**",
              f"- Social mentions observed: **{intelligence.get('social_mentions', 0)}**",
              f"- FINRA symbols enriched: **{intelligence.get('finra_symbols', 0)}**",
              f"- Benzinga contract matches: **{intelligence.get('benzinga_contract_matches', 0)}**",
              f"- Flow-qualified contracts: **{flow.get('contracts_flow_qualified', 0)}**",
              f"- Aggressive buying: **{flow.get('aggressive_buying', 0)}**",
              f"- High accumulation: **{flow.get('high_accumulation', 0)}**",
              f"- Volume spikes: **{flow.get('volume_spikes', 0)}**",
              f"- SEC full-text reachable: **{efts.get('available', False)}**",
              f"- SEC full-text matched events: **{efts.get('event_count', 0)}**",
              f"- Mature calibration sample: **{calibration.get('matured_sample', 0)}/{calibration.get('minimum_sample', 100)}**",
              f"- Raw priced signals: **{calibration.get('raw_priced_sample', 0)}**",
              f"- Path-evaluated signals: **{performance.get('path_evaluated', 0)}**",
              f"- Stop-first paths: **{performance.get('path_stop_first', 0)}**",
              f"- Ambiguous same-bar paths: **{performance.get('path_ambiguous', 0)}**",
              f"- Calibration ready: **{calibration.get('ready', False)}**",
          ]
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(summary), encoding='utf-8')
          PY
      - name: Publish fresh dashboard data and evidence journal
        shell: bash
        run: |
          git config user.name "ghazi-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/latest.json
          for file in \
            data/cache/sec_efts_events.json \
            data/cache/sec_efts_status.json \
            data/live/source_audit.json \
            data/live/intelligence_audit.json \
            data/live/alert_state.json \
            data/live/signals.jsonl \
            data/live/outcomes.json \
            data/live/calibration.json \
            data/live/CALIBRATION_REVIEW.md \
            data/live/calibration_issue.json; do
            if [[ -f "$file" ]]; then
              git add "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No data change to publish."
          else
            git commit -m "data: refresh Phase 6.1 market intelligence [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghazi-market-radar-results
          retention-days: 14
          path: |
            public/data/latest.json
            data/cache/sec_efts_events.json
            data/cache/sec_efts_status.json
            data/live/*.json
            data/live/*.jsonl
            data/live/*.md
            results/*.csv
          if-no-files-found: ignor
