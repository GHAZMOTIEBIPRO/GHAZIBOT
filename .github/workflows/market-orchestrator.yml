name: BLACK BOX Omega Market Orchestrator

on:
  workflow_dispatch:
    inputs:
      chain:
        description: "Self-chained cadence run (set by the orchestrator itself)"
        type: boolean
        default: false
  # GitHub schedule events are best-effort and can be skipped. An *already*
  # independent successful News Flash run can wake the same cadence owner.
  # Child workflows remain workflow_dispatch-only: no duplicate schedulers.
  workflow_run:
    workflows: ["BLACK BOX News Flash 24x7"]
    branches: [main]
    types: [completed]
  # Deploying a change to the cadence workflow bootstraps one verification run.
  push:
    branches: [main]
    paths:
      - ".github/workflows/market-orchestrator.yml"
      - "scripts/relay_dependent_workflows.py"
  schedule:
    - cron: "2-57/5 8-23 * * 1-5"

concurrency:
  group: black-box-omega-market-orchestrator
  # A newer rescue event must not cancel an active child-dispatch run.
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    # Never dispatch children from failed/cancelled upstream news-flash runs.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # GitHub delivers few of the 5-minute crons (often one per day), so each
    # wakeup keeps the cadence itself for up to ~50 minutes (see loop below).
    timeout-minutes: 58
    outputs:
      bridge_seconds: ${{ steps.cadence.outputs.bridge_seconds }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Diagnose missing scheduler heartbeat (no trading side effects)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Cadence invocation source: $GITHUB_EVENT_NAME"
          if [[ "$GITHUB_EVENT_NAME" != "workflow_run" ]]; then
            echo "Normal schedule, manual dispatch, or changed-workflow bootstrap."
            exit 0
          fi
          last_schedule="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow market-orchestrator.yml --event schedule --branch main --limit 1 --json createdAt --jq '.[0].createdAt // empty' 2>/dev/null || true)"
          if [[ -z "$last_schedule" ]]; then
            echo "::warning title=Omega schedule missing::No recent central scheduler run available. Independent News Flash wakeup is acting as fallback."
            exit 0
          fi
          last_epoch="$(date -u -d "$last_schedule" +%s)"
          now_epoch="$(date -u +%s)"
          age=$(( (now_epoch - last_epoch) / 60 ))
          echo "Last scheduled Market Orchestrator run age: ${age} minutes"
          if (( age > 20 )); then
            echo "::warning title=Omega scheduler overdue::Central schedule is overdue by ${age} minutes; recovering through News Flash workflow_run."
          fi

      - name: Check out dependent-stage relay
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/relay_dependent_workflows.py
          sparse-checkout-cone-mode: false

      # Each pass: dispatch stale engines, then relay completed source runs to
      # their dependents (runs started with GITHUB_TOKEN never raise
      # workflow_run). Scheduled and News Flash wakeups repeat the pass every
      # 5 minutes for ~50 minutes; push/manual runs do a single pass.
      - name: Dispatch stale market engines and relay dependent stages
        id: cadence
        shell: bash
        env:
          ORCHESTRATOR_PASSES: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run' || inputs.chain) && '10' || '1' }}
          # Kill switch: set repository variable ORCHESTRATOR_SELF_CHAIN=false.
          ORCHESTRATOR_SELF_CHAIN: ${{ vars.ORCHESTRATOR_SELF_CHAIN || 'true' }}
        run: |
          set -euo pipefail

          age_minutes() {
            workflow="$1"
            created_at="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --branch main \
              --limit 1 \
              --json createdAt \
              --jq '.[0].createdAt // empty' 2>/dev/null || true)"
            if [[ -z "$created_at" ]]; then
              echo 99999
              return
            fi
            last_epoch="$(date -u -d "$created_at" +%s)"
            echo $(( (now_epoch - last_epoch) / 60 ))
          }

          dispatch_if_stale() {
            workflow="$1"
            max_age="$2"
            label="$3"
            age="$(age_minutes "$workflow")"
            echo "$label: workflow=$workflow age=${age}m max=${max_age}m"
            if (( age > max_age )); then
              echo "Dispatching $label"
              gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
            else
              echo "Fresh enough; skip $label"
            fi
          }

          dispatch_pass() {
          if (( utc_hour >= 8 && utc_hour <= 23 )); then
            dispatch_if_stale fast-explosion-radar.yml 8 "Fast Explosion"
          fi

          if (( utc_hour >= 12 && utc_hour <= 22 )); then
            dispatch_if_stale spx-dashboard.yml 8 "SPX"
            dispatch_if_stale classical-direction-radar.yml 18 "Classical Direction"
            dispatch_if_stale options-contract-radar.yml 18 "Options Contract"
            dispatch_if_stale company-news-watch.yml 18 "Company News"
            dispatch_if_stale free-data-health.yml 18 "Free Data Health"
            dispatch_if_stale free-gex-validation.yml 18 "Free GEX Validation"
            dispatch_if_stale options-radar.yml 18 "Full Omega Radar + Contract Guardian"
            dispatch_if_stale adaptive-review.yml 70 "Adaptive Evidence Review"
            dispatch_if_stale stock-outcome-auditor.yml 70 "Stock Outcome Auditor"
            # Low-frequency official/free sources whose own crons GitHub drops.
            # SEC refusals keep their own 6h cooldown inside the pulse.
            dispatch_if_stale official-sec-pulse.yml 240 "Official SEC Filings"
            dispatch_if_stale free-options-sources.yml 360 "Free OCC Options Sources"
          fi

          # Index research (and, via the relay, its stock charts) every ~2h in
          # the regular session; its own cron was never delivered by GitHub.
          if (( utc_hour >= 14 && utc_hour <= 21 )); then
            dispatch_if_stale index-radar.yml 110 "Index Research"
          fi
          }

          passes="${ORCHESTRATOR_PASSES:-1}"
          # Weekends: one pass per wakeup only (markets closed).
          if (( $(date -u +%u) > 5 )); then
            passes=1
          fi
          for (( pass = 1; pass <= passes; pass++ )); do
            now_epoch="$(date -u +%s)"
            utc_hour="$(date -u +%H)"
            utc_hour=$((10#$utc_hour))
            if (( pass > 1 && (utc_hour < 8 || utc_hour > 23) )); then
              echo "Outside the 08-23 UTC market window; stop looping."
              break
            fi
            echo "::group::Orchestrator pass ${pass}/${passes} at $(date -u +%H:%M)Z"
            # One failed pass (API hiccup) must not end the cadence loop.
            dispatch_pass || echo "::warning title=Dispatch pass failed::pass ${pass}"
            python3 scripts/relay_dependent_workflows.py --repo "$GITHUB_REPOSITORY" \
              || echo "::warning title=Relay pass failed::pass ${pass}"
            echo "::endgroup::"
            if (( pass < passes )); then
              sleep 300
            fi
          done

          # GitHub delivers few scheduled events (the News Flash wakeup too),
          # so a looping run hands the cadence to its successor itself.
          # workflow_dispatch is the one GITHUB_TOKEN event GitHub does run;
          # the concurrency group keeps at most one running + one pending.
          end_hour="$(date -u +%H)"; end_hour=$((10#$end_hour))
          if (( passes > 1 )) && [[ "${ORCHESTRATOR_SELF_CHAIN:-true}" != "false" ]] \
              && (( $(date -u +%u) <= 5 && end_hour >= 8 && end_hour <= 22 )); then
            echo "Chaining the next cadence run."
            gh workflow run market-orchestrator.yml --repo "$GITHUB_REPOSITORY" --ref main -f chain=true \
              || echo "::warning title=Self-chain dispatch failed::next wakeup will resume cadence"
          else
            echo "No self-chain (passes=${passes}, hour=${end_hour}, switch=${ORCHESTRATOR_SELF_CHAIN:-true})."
            # A pre-market wakeup (00:00-08:00 UTC, Mon-Fri) bridges to 08:00
            # instead of leaving the morning to the next lucky schedule event.
            now_epoch="$(date -u +%s)"
            open_epoch="$(date -u -d 'today 08:00' +%s)"
            wait_s=$(( open_epoch - now_epoch ))
            if (( passes > 1 )) && [[ "${ORCHESTRATOR_SELF_CHAIN:-true}" != "false" ]] \
                && (( $(date -u +%u) <= 5 && wait_s > 0 && wait_s <= 21000 )); then
              echo "Bridging ${wait_s}s to the 08:00 UTC cadence start."
              echo "bridge_seconds=${wait_s}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Scheduling policy
        run: |
          cat <<'EOF'
          Core market cadence is owned here, including wakeups from successful News Flash runs.
          Any wakeup (schedule or News Flash) keeps the 5-minute pass cadence for ~50 minutes,
          then dispatches its own successor on weekdays 08-22 UTC (switch: vars.ORCHESTRATOR_SELF_CHAIN).
          Dependent stages: workflow_run for human-pushed runs, plus the relay
          inside each pass for orchestrator-dispatched runs (no workflow_run event):
          Fast Explosion -> Stock Radar
          Options Contract -> Options Research Enrichment
          Stock/Options -> Cross Confirmation / state / dashboard
          News Flash remains independent 24x7.
          Stock Outcome Auditor receives intraday coverage dispatch here plus its end-of-day fallback.
          Other end-of-day auditors and weekly research labs remain independent.
          EOF

  # Bounded idle wait (<= 5h50m, only after a pre-market wakeup on a weekday)
  # that starts the self-chained cadence at 08:00 UTC.
  bridge:
    needs: dispatch
    if: needs.dispatch.outputs.bridge_seconds != ''
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      BRIDGE_SECONDS: ${{ needs.dispatch.outputs.bridge_seconds }}
    steps:
      - name: Wait for the 08:00 UTC cadence window, then chain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BRIDGE_SECONDS" =~ ^[0-9]+$ ]] && (( BRIDGE_SECONDS <= 21000 ))
          sleep "$BRIDGE_SECONDS"
          gh workflow run market-orchestrator.yml --repo "$GITHUB_REPOSITORY" --ref main -f chain=true
          echo "Cadence chain started at $(date -u +%H:%M)Z."
