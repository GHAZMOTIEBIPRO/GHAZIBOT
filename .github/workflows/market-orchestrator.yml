name: BLACK BOX Omega Market Orchestrator

on:
  workflow_dispatch:
  # GitHub schedule events are best-effort and can be skipped. An *already*
  # independent successful News Flash run can wake the same cadence owner.
  # Child workflows remain workflow_dispatch-only: no duplicate schedulers.
  workflow_run:
    workflows: ["BLACK BOX News Flash 24x7"]
    branches: [main]
    types: [completed]
  # Deploying a change to the cadence workflow bootstraps one verification run.
  push:
    branches: [main]
    paths:
      - ".github/workflows/market-orchestrator.yml"
  schedule:
    - cron: "2-57/5 8-23 * * 1-5"

concurrency:
  group: black-box-omega-market-orchestrator
  # A newer rescue event must not cancel an active child-dispatch run.
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    # Never dispatch children from failed/cancelled upstream news-flash runs.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Diagnose missing scheduler heartbeat (no trading side effects)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Cadence invocation source: $GITHUB_EVENT_NAME"
          if [[ "$GITHUB_EVENT_NAME" != "workflow_run" ]]; then
            echo "Normal schedule, manual dispatch, or changed-workflow bootstrap."
            exit 0
          fi
          last_schedule="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow market-orchestrator.yml --event schedule --branch main --limit 1 --json createdAt --jq '.[0].createdAt // empty' 2>/dev/null || true)"
          if [[ -z "$last_schedule" ]]; then
            echo "::warning title=Omega schedule missing::No recent central scheduler run available. Independent News Flash wakeup is acting as fallback."
            exit 0
          fi
          last_epoch="$(date -u -d "$last_schedule" +%s)"
          now_epoch="$(date -u +%s)"
          age=$(( (now_epoch - last_epoch) / 60 ))
          echo "Last scheduled Market Orchestrator run age: ${age} minutes"
          if (( age > 20 )); then
            echo "::warning title=Omega scheduler overdue::Central schedule is overdue by ${age} minutes; recovering through News Flash workflow_run."
          fi

      - name: Dispatch stale market engines
        shell: bash
        run: |
          set -euo pipefail

          now_epoch="$(date -u +%s)"
          utc_hour="$(date -u +%H)"
          utc_hour=$((10#$utc_hour))

          age_minutes() {
            workflow="$1"
            created_at="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --branch main \
              --limit 1 \
              --json createdAt \
              --jq '.[0].createdAt // empty' 2>/dev/null || true)"
            if [[ -z "$created_at" ]]; then
              echo 99999
              return
            fi
            last_epoch="$(date -u -d "$created_at" +%s)"
            echo $(( (now_epoch - last_epoch) / 60 ))
          }

          dispatch_if_stale() {
            workflow="$1"
            max_age="$2"
            label="$3"
            age="$(age_minutes "$workflow")"
            echo "$label: workflow=$workflow age=${age}m max=${max_age}m"
            if (( age > max_age )); then
              echo "Dispatching $label"
              gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
            else
              echo "Fresh enough; skip $label"
            fi
          }

          if (( utc_hour >= 8 && utc_hour <= 23 )); then
            dispatch_if_stale fast-explosion-radar.yml 8 "Fast Explosion"
          fi

          if (( utc_hour >= 12 && utc_hour <= 22 )); then
            dispatch_if_stale spx-dashboard.yml 8 "SPX"
            dispatch_if_stale classical-direction-radar.yml 18 "Classical Direction"
            dispatch_if_stale options-contract-radar.yml 18 "Options Contract"
            dispatch_if_stale company-news-watch.yml 18 "Company News"
            dispatch_if_stale free-data-health.yml 18 "Free Data Health"
            dispatch_if_stale free-gex-validation.yml 18 "Free GEX Validation"
            dispatch_if_stale options-radar.yml 18 "Full Omega Radar + Contract Guardian"
            dispatch_if_stale adaptive-review.yml 70 "Adaptive Evidence Review"
            dispatch_if_stale stock-outcome-auditor.yml 70 "Stock Outcome Auditor"
          fi

      - name: Scheduling policy
        run: |
          cat <<'EOF'
          Core market cadence is owned here, including wakeups from successful News Flash runs.
          A fallback wakeup does not guarantee five-minute execution when GitHub omits all schedules.
          workflow_run chains still own dependent stages:
          Fast Explosion -> Stock Radar
          Options Contract -> Options Research Enrichment
          Stock/Options -> Cross Confirmation / state / dashboard
          News Flash remains independent 24x7.
          Stock Outcome Auditor receives intraday coverage dispatch here plus its end-of-day fallback.
          Other end-of-day auditors and weekly research labs remain independent.
          EOF
