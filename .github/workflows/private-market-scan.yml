name: GHAZI Private Market Scan (owner only)

# Discovery -> measured momentum -> setup conditions on Alpaca IEX data, sent
# only to the owner's personal Telegram chat (options_radar.output_policy).
# Nothing is committed: no bot-state, no artifacts; logs carry statuses only.
on:
  workflow_dispatch:
  # Verify the newly installed private strategy on main, never on untrusted PRs.
  push:
    branches: [main]
    paths:
      - "options_radar/core_options_strategy.py"
      - "scripts/run_focus_options_private.py"
      - "scripts/run_twelve_non_display_scan.py"
      - ".github/workflows/private-market-scan.yml"
  # No own schedule: GitHub delivered the former 14:47/16:47/18:47 UTC crons 6-8 h late
  # (after the close), and a late cron next to a dispatch would send a second message.
  # market-orchestrator.yml dispatches this 10:00-15:30 New York, at most every 150 min;
  # the script checks the XNYS session itself.

permissions:
  contents: read
  actions: read

concurrency:
  group: ghazi-private-market-scan
  cancel-in-progress: false

jobs:
  scan:
    # No runner is started unless the owner recorded the Alpaca attestation.
    if: vars.ALPACA_INTERNAL_DATA_USE_AUTHORIZED == 'true'
    runs-on: ubuntu-latest
    # Run 42053590350 hit the old 8-minute limit while fetching whole-market history; the scan now
    # fetches today's snapshots first and history only for the largest movers. The step limit
    # below keeps a slow provider from consuming the whole job budget (3 runs per weekday).
    timeout-minutes: 12
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_INTERNAL_DATA_USE_AUTHORIZED: ${{ vars.ALPACA_INTERNAL_DATA_USE_AUTHORIZED || 'false' }}
      ALPACA_BARS_FEED: ${{ vars.ALPACA_BARS_FEED || 'sip' }}
      DATA_TERMS_CONFIRMED: ${{ vars.DATA_TERMS_CONFIRMED || '' }}
      ALPACA_PRIVATE_ALERTS_AUTHORIZED: ${{ vars.ALPACA_PRIVATE_ALERTS_AUTHORIZED || 'false' }}
      NASDAQ_WEB_AUTOMATION_APPROVED: ${{ vars.NASDAQ_WEB_AUTOMATION_APPROVED || 'false' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      TELEGRAM_OWNER_USERNAME: ${{ vars.TELEGRAM_OWNER_USERNAME }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: app
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bot-state
          path: state
          sparse-checkout: runtime/public/data/catalyst_watchlist.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt
      # The owner chat must differ from the broadcast chat; resolve the broadcast
      # destination first so output_policy.deliver_private can compare (no send here).
      - name: Resolve the broadcast destination for the private-chat check
        if: env.ALPACA_PRIVATE_ALERTS_AUTHORIZED == 'true'
        uses: ./app/.github/actions/resolve-telegram-broadcast
      - name: Analyze priority SPY/QQQ and large-cap options privately
        shell: bash
        run: |
          set -euo pipefail
          cd app
          python -m scripts.run_focus_options_private \
            --output "$RUNNER_TEMP/core_omega_private_health.json"

      - name: Scan (status only in the log)
        timeout-minutes: 9
        run: |
          cd app
          python -m scripts.private_market_scan \
            --catalysts ../state/runtime/public/data/catalyst_watchlist.json \
            --status-output "$RUNNER_TEMP/private_scan_status.json"

  twelve-non-display:
    # Runs independently of Alpaca's authorization and market feed.
    # A free personal non-display plan does not permit public quote or
    # derived-level publishing, so results stay in runner temporary storage.
    if: vars.TWELVE_DATA_NON_DISPLAY_USE_AUTHORIZED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      TWELVE_DATA_NON_DISPLAY_USE_AUTHORIZED: ${{ vars.TWELVE_DATA_NON_DISPLAY_USE_AUTHORIZED || 'false' }}
      DATA_TERMS_CONFIRMED: ${{ vars.DATA_TERMS_CONFIRMED || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: app
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "requests>=2.32,<3"
      - name: Independently compute non-display large-cap / ETF research
        env:
          PYTHONPATH: app
        run: >-
          python -m scripts.run_twelve_non_display_scan
          --output "$RUNNER_TEMP/twelve_non_display_health.json"
