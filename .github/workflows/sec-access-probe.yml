name: GHAZI SEC Access Probe

on:
  workflow_dispatch:
  push:
    branches:
      - "ccr-**"
      - "fix/**"
    paths:
      - "scripts/probe_sec_access.py"
      - ".github/workflows/sec-access-probe.yml"

permissions:
  contents: read

concurrency:
  group: ghazi-sec-access-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'GHAZI Radar Research ghazi-bot@users.noreply.github.com' }}
      SEC_USER_AGENT_SECRET_SET: ${{ secrets.SEC_USER_AGENT != '' && 'yes' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "requests>=2.32,<3"
      - name: SEC status codes and refusal titles only
        run: python scripts/probe_sec_access.py
