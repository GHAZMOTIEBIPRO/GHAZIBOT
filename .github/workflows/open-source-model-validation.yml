name: BLACK BOX Open Source Model Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/open-source-model-validation.yml"
      - "scripts/validate_open_source_greeks.py"
      - "scripts/validate_open_source_research.py"
      - "options_radar/open_source_research.py"
      - "options_radar/edgartools_research_adapter.py"
      - "tests/test_edgartools_research_adapter.py"
      - "requirements-research.txt"
  schedule:
    - cron: "40 9 * * 0"

concurrency:
  group: black-box-open-source-model-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-research.txt

      - name: Install open-source research validators
        run: pip install -r requirements-research.txt

      - name: Validate modeled Greeks against MIT reference libraries
        run: python -m scripts.validate_open_source_greeks

      - name: Validate EdgarTools and hindsight-safe SMC bridges
        run: python -m scripts.validate_open_source_research

      - name: SEC EdgarTools real-filing smoke (manual only, requires configured identity)
        if: github.event_name == 'workflow_dispatch'
        env:
          SEC_EDGAR_IDENTITY: ${{ secrets.SEC_USER_AGENT }}
        shell: bash
        run: |
          mkdir -p public/data
          if [[ -z "$SEC_EDGAR_IDENTITY" ]]; then
            echo '{"status":"NOT_RUN","reason":"SEC_USER_AGENT secret absent"}' > public/data/edgartools_sec_smoke.json
            echo "Live SEC smoke NOT RUN: SEC_USER_AGENT must be set."
          else
            python -m options_radar.edgartools_research_adapter --symbol MU --limit 3 > public/data/edgartools_sec_smoke.json
          fi

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: open-source-model-validation
          path: |
            public/data/open_source_greeks_validation.json
            public/data/open_source_research_validation.json
            public/data/edgartools_sec_smoke.json
          if-no-files-found: error
          retention-days: 14
