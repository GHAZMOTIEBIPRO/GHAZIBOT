name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit and integration tests
        run: pytest -q

      - name: Independent radar CLI import smoke
        run: |
          python -m scripts.run_stock_radar_independent --help >/dev/null
          python -m scripts.run_options_radar_independent --help >/dev/null
          python -m scripts.run_options_radar_fabric --help >/dev/null
          python -m scripts.run_stream_gateway --help >/dev/null
          python scripts/fast_explosion_scan_fabric.py --help >/dev/null
          python scripts/market_clock_gate.py --help >/dev/null
          python -m scripts.send_independent_path_alerts --help >/dev/null
          python -m scripts.send_strict_options_alerts --help >/dev/null
          python -m scripts.send_cross_confirmation --help >/dev/null
          python -m scripts.send_radar_health --help >/dev/null
          python -m scripts.send_classical_direction_alerts --help >/dev/null
          python -m scripts.options_performance_auditor --help >/dev/null
          python scripts/telegram_connection_bootstrap.py --help >/dev/null

      - name: Python syntax and import compilation
        run: |
          python -m compileall -q \
            main.py export_web.py run_live_export.py \
            options_radar scripts

      - name: Critical Ruff gate
        run: |
          ruff check \
            options_radar/expiry_identity.py \
            options_radar/expiry_provider_metadata.py \
            options_radar/expiry_chain_normalizer.py \
            options_radar/expiry_radar.py \
            options_radar/occ_expiry_overlay.py \
            options_radar/strict_catalysts.py \
            options_radar/omega_catalyst_intelligence.py \
            options_radar/omega_target_map.py \
            options_radar/omega_opportunity.py \
            options_radar/omega_observability.py \
            options_radar/omega_validation.py \
            options_radar/omega_engine.py \
            options_radar/optionable_universe.py \
            options_radar/official_event_scan.py \
            options_radar/free_gamma_engine.py \
            options_radar/occ_free_context.py \
            options_radar/options_consensus.py \
            options_radar/outcome_learning.py \
            options_radar/data_fabric.py \
            options_radar/data_fabric_runtime.py \
            options_radar/stream_gateway.py \
            options_radar/stream_overlay.py \
            options_radar/provider_readiness.py \
            options_radar/market_clock.py \
            options_radar/telegram_transport.py \
            scripts/apply_phase62.py \
            scripts/apply_expiry_radar.py \
            scripts/validate_omega_export.py \
            scripts/run_options_radar_independent.py \
            scripts/run_options_radar_hardened.py \
            scripts/run_options_radar_fabric.py \
            scripts/run_stream_gateway.py \
            scripts/fast_explosion_scan_fabric.py \
            scripts/market_clock_gate.py \
            scripts/prune_actions_artifacts.py \
            scripts/run_stock_radar_independent.py \
            scripts/telegram_connection_bootstrap.py \
            scripts/telegram_transport.py \
            scripts/send_independent_path_alerts.py \
            scripts/send_strict_options_alerts.py \
            scripts/send_cross_confirmation.py \
            scripts/send_radar_health.py \
            scripts/send_classical_direction_alerts.py \
            scripts/options_performance_auditor.py \
            tests/test_optionable_universe.py \
            tests/test_independent_path_alerts.py \
            tests/test_expiry_identity.py \
            tests/test_omega_catalyst_intelligence.py \
            tests/test_omega_target_map.py \
            tests/test_omega_opportunity.py \
            tests/test_omega_observability.py \
            tests/test_omega_validation.py \
            tests/test_free_gamma_engine.py \
            tests/test_options_consensus.py \
            tests/test_occ_free_context.py \
            tests/test_outcome_learning.py \
            tests/test_data_fabric.py \
            tests/test_stream_overlay.py \
            tests/test_stream_gateway.py \
            tests/test_provider_readiness_fabric.py \
            tests/test_market_clock.py \
            tests/test_prune_actions_artifacts.py \
            tests/test_strict_options_sender.py \
            tests/test_telegram_transport.py \
            tests/test_cross_confirmation.py \
            tests/test_options_performance_auditor.py \
            --select E9,F63,F7,F82

      - name: Repository Ruff baseline
        continue-on-error: true
        run: ruff check .

      - name: JavaScript syntax gate
        run: |
          node --check public/app.js
          node --check public/phase51.js
          node --check public/phase60.js
          node --check public/phase62.js
          node --check public/expiry-radar.js
          node --check public/omega.js

      - name: JSON and Vercel configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (
              "vercel.json",
              "public/data/latest.json",
              "data/company_aliases.json",
              "public/data/health.json",
              "public/data/data-status.json",
          ):
              json.loads(Path(path).read_text(encoding="utf-8"))
              print("valid", path)
          PY

      - name: Omega export schema and UI smoke
        run: python scripts/validate_omega_export.py public/data/latest.json --apply-in-memory
