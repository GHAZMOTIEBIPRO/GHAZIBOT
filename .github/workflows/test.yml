name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit and integration tests
        run: pytest -q

      - name: Independent radar CLI import smoke
        run: |
          python -m scripts.run_stock_radar_independent --help >/dev/null
          python -m scripts.run_options_radar_independent --help >/dev/null
          python -m scripts.run_options_radar_fabric --help >/dev/null
          python -m scripts.run_stream_gateway --help >/dev/null
          python scripts/fast_explosion_scan_fabric.py --help >/dev/null
          python scripts/enrich_microcap_sec_dilution.py --help >/dev/null
          python scripts/market_clock_gate.py --help >/dev/null
          python -m scripts.send_independent_path_alerts --help >/dev/null
          python -m scripts.send_strict_options_alerts --help >/dev/null
          python -m scripts.send_omega_watch_alerts --help >/dev/null
          python -m scripts.run_omega_target_learning --help >/dev/null
          python -m scripts.send_cross_confirmation --help >/dev/null
          python -m scripts.send_radar_health --help >/dev/null
          python -m py_compile scripts/omega_sniper.py tests/test_omega_sniper.py
          python -m scripts.send_classical_direction_alerts --help >/dev/null
          python -m scripts.options_performance_auditor --help >/dev/null
          python -m scripts.run_adaptive_learning --help >/dev/null
          python -m scripts.run_stock_outcome_audit --help >/dev/null
          python -m scripts.enrich_stock_research_attribution --help >/dev/null
          python -m scripts.run_stock_walk_forward --help >/dev/null
          python -m scripts.run_contract_guardian --help >/dev/null
          python -m scripts.send_contract_guardian_updates --help >/dev/null
          python scripts/telegram_connection_bootstrap.py --help >/dev/null

      - name: Python syntax and import compilation
        run: |
          python -m compileall -q \
            main.py export_web.py run_live_export.py \
            options_radar scripts

      - name: Critical Ruff gate
