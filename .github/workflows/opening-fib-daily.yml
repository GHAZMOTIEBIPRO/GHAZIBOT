name: GHAZI RADAR - Daily Opening Fibonacci (owner private)

on:
  workflow_dispatch:
    inputs:
      preflight:
        description: "Verify private Telegram account and historical SIP without sending"
        type: boolean
        default: false
      dry_run:
        description: "Validate calculations without Telegram delivery"
        type: boolean
        default: true
  # 10:27 and 10:42 New York. Dual UTC clocks handle DST/EST;
  # the Python NY-time gate prevents the wrong UTC trigger from sending.
  schedule:
    - cron: "27,42 14 * * 1-5"
    - cron: "27,42 15 * * 1-5"
  # One-shot safe account verification when this workflow is deployed to main.
  # Push preflight NEVER sends Telegram messages or changes the sent marker.
  push:
    branches: [main]
    paths:
      - ".github/workflows/opening-fib-daily.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: ghazi-opening-fib-private-daily
  cancel-in-progress: false

jobs:
  opening-fib:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_BARS_FEED: ${{ vars.ALPACA_BARS_FEED || 'sip' }}
      ALPACA_INTERNAL_DATA_USE_AUTHORIZED: ${{ vars.ALPACA_INTERNAL_DATA_USE_AUTHORIZED || 'false' }}
      ALPACA_PRIVATE_ALERTS_AUTHORIZED: ${{ vars.ALPACA_PRIVATE_ALERTS_AUTHORIZED || 'false' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      TELEGRAM_OWNER_USERNAME: ${{ vars.TELEGRAM_OWNER_USERNAME }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPENING_FIB_MAX_SYMBOLS: ${{ vars.OPENING_FIB_MAX_SYMBOLS || '150' }}
      OPENING_FIB_MIN_OPENING_NOTIONAL: ${{ vars.OPENING_FIB_MIN_OPENING_NOTIONAL || '1000000' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - uses: actions/checkout@v4
        with:
          ref: bot-state
          fetch-depth: 0
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned major-version dependencies
        run: python -m pip install -r app/requirements.txt

      - name: Resolve destination only when owner-username fallback is configured
        if: env.TELEGRAM_OWNER_CHAT_ID == '' && env.TELEGRAM_OWNER_USERNAME != ''
        uses: ./app/.github/actions/resolve-telegram-broadcast

      - name: Scan first completed 15-minute candle and deliver private digest
        env:
          PYTHONPATH: app
          RUN_DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          RUN_PREFLIGHT: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.preflight) && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUN_PREFLIGHT:-false}" == "true" ]]; then
            python -m scripts.run_opening_fib_daily \
              --state state/state/opening_fib/sent.json --preflight
          elif [[ "$RUN_DRY" == "true" ]]; then
            python -m scripts.run_opening_fib_daily \
              --universe app/data/universe.txt \
              --state state/state/opening_fib/sent.json --dry-run
          else
            python -m scripts.run_opening_fib_daily \
              --universe app/data/universe.txt \
              --state state/state/opening_fib/sent.json
          fi

      - name: Persist date-only delivery marker, never market prices
        if: success() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.preflight == false))
        shell: bash
        run: |
          set -euo pipefail
          cd state
          if [[ ! -f state/opening_fib/sent.json ]]; then
            echo "No private Telegram delivery marker; nothing to persist."
            exit 0
          fi
          git config user.name "GHAZI RADAR Private Fib Bot"
          git config user.email "GHAZMOTIEBIPRO@users.noreply.github.com"
          git add state/opening_fib/sent.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "state: private daily fib delivered [skip ci]"
          for attempt in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin bot-state && git push origin HEAD:bot-state; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2 + RANDOM % 5))
          done
          exit 1
