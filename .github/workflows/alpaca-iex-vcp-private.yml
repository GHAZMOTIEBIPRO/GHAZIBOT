name: GHAZI RADAR Alpaca IEX Private VCP Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/alpaca_vcp_private.py"
      - "options_radar/vcp_minervini_shadow.py"
      - "options_radar/weekly_setup_shadow.py"
      - ".github/workflows/alpaca-iex-vcp-private.yml"
  # Independent after-hours daily research, not another intraday orchestrator.
  # 01:30 UTC Tue-Sat = previous Mon-Fri completed NY session.
  schedule:
    - cron: "30 1 * * 2-6"

permissions:
  contents: write
  actions: read

concurrency:
  group: ghazi-alpaca-iex-vcp-private
  cancel-in-progress: false

jobs:
  daily-private-vcp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_INTERNAL_DATA_USE_AUTHORIZED: ${{ vars.ALPACA_INTERNAL_DATA_USE_AUTHORIZED || 'false' }}
      # Separate acknowledgement for historical consolidated SIP permission.
      # Does not grant real-time SIP, redistribution or contract quote rights.
      ALPACA_HISTORICAL_SIP_INTERNAL_AUTHORIZED: ${{ vars.ALPACA_HISTORICAL_SIP_INTERNAL_AUTHORIZED || 'false' }}
      ALPACA_PRIVATE_ALERTS_AUTHORIZED: ${{ vars.ALPACA_PRIVATE_ALERTS_AUTHORIZED || 'false' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - uses: actions/checkout@v4
        with:
          ref: bot-state
          fetch-depth: 0
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install existing project dependencies (only when licensed)
        if: env.ALPACA_INTERNAL_DATA_USE_AUTHORIZED == 'true' && env.ALPACA_API_KEY != '' && env.ALPACA_SECRET_KEY != ''
        run: pip install -r app/requirements.txt
      - name: Install minimum parser dependencies when source blocked
        if: env.ALPACA_INTERNAL_DATA_USE_AUTHORIZED != 'true' || env.ALPACA_API_KEY == '' || env.ALPACA_SECRET_KEY == ''
        run: pip install "pandas>=2,<3" "requests>=2.32,<3" 
      # The owner chat must differ from the broadcast chat; resolve the broadcast
      # destination first so output_policy.deliver_private can compare. Nothing
      # about the destination is stored in bot-state.
      - name: Resolve the broadcast destination for the private-chat check
        if: env.ALPACA_PRIVATE_ALERTS_AUTHORIZED == 'true'
        uses: ./app/.github/actions/resolve-telegram-broadcast
      - name: Analyze only Alpaca IEX daily bars under explicit internal license
        env:
          PYTHONPATH: app
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [[ "${ALPACA_PRIVATE_ALERTS_AUTHORIZED}" == "true" && "${TELEGRAM_READY:-}" == "true" ]]; then
            extra+=(--private-ready)
          fi
          python -m scripts.alpaca_vcp_private \
            --status state/runtime/public/data/alpaca_iex_vcp_health.json \
            --state state/state/alpaca/vcp_private_delivery.json "${extra[@]}"
      - name: Persist operational status only — never licensed OHLC or symbols
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd state
          git config user.name "GHAZI RADAR Alpaca IEX Operations"
          git config user.email "GHAZMOTIEBIPRO@users.noreply.github.com"
          if [[ -f runtime/public/data/alpaca_iex_vcp_health.json ]]; then
            git add runtime/public/data/alpaca_iex_vcp_health.json
          fi
          if [[ -f state/alpaca/vcp_private_delivery.json ]]; then
            git add state/alpaca/vcp_private_delivery.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "state: Alpaca IEX VCP status only [skip ci]"
          for attempt in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin bot-state && git push origin HEAD:bot-state; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2 + RANDOM % 5))
          done
          echo "Failed publishing non-price Alpaca research readiness." >&2
          exit 1
