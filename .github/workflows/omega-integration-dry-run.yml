name: Omega Integration Dry Run

on:
  push:
    branches:
      - "fix/omega-expiry-identity-p0"
    paths:
      - ".github/workflows/omega-integration-dry-run.yml"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPTIONS_PROVIDER: ${{ secrets.OPTIONS_PROVIDER || 'auto' }}
      MARKETDATA_TOKEN: ${{ secrets.MARKETDATA_TOKEN }}
      TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
      TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL || 'https://sandbox.tradier.com' }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_OPTIONS_FEED: ${{ secrets.ALPACA_OPTIONS_FEED || 'indicative' }}
      ALPACA_STOCK_FEED: ${{ secrets.ALPACA_STOCK_FEED || 'iex' }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      BENZINGA_TOKEN: ${{ secrets.BENZINGA_TOKEN }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      X_WATCH_ACCOUNTS: ${{ secrets.X_WATCH_ACCOUNTS || 'unusual_whales,spotgamma,CheddarFlow,Barchart,Benzinga,Cboe,NasdaqExchange,NYSE' }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT || 'GHAZI-Market-Radar/Omega' }}
      REDDIT_COMMUNITIES: ${{ secrets.REDDIT_COMMUNITIES || 'options,stocks,StockMarket,wallstreetbets,thetagang,investing,SecurityAnalysis' }}
      INTELLIGENCE_MAX_SYMBOLS: ${{ secrets.INTELLIGENCE_MAX_SYMBOLS || '15' }}
      INTELLIGENCE_MAX_CONTRACTS: ${{ secrets.INTELLIGENCE_MAX_CONTRACTS || '30' }}
      EXPIRY_RADAR_MAX_SYMBOLS: ${{ secrets.EXPIRY_RADAR_MAX_SYMBOLS || '8' }}
      EXPIRY_RADAR_TOP_PER_SIDE: ${{ secrets.EXPIRY_RADAR_TOP_PER_SIDE || '8' }}
      OCC_FREE_ENABLED: ${{ secrets.OCC_FREE_ENABLED || 'true' }}
      OPTIONS_PROVIDER_ORDER: ${{ secrets.OPTIONS_PROVIDER_ORDER || 'tradier,marketdata,finnhub,yahoo' }}
      STOCK_PROVIDER_ORDER: ${{ secrets.STOCK_PROVIDER_ORDER || 'tiingo,finnhub,tradier,alpaca,twelve_data,polygon,alpha_vantage,yahoo' }}
      DAILY_PRICE_PROVIDER_ORDER: ${{ secrets.DAILY_PRICE_PROVIDER_ORDER || 'tradier,alpaca,twelve_data,polygon,alpha_vantage,yahoo' }}
      INTRADAY_PRICE_PROVIDER_ORDER: ${{ secrets.INTRADAY_PRICE_PROVIDER_ORDER || 'tradier,alpaca,twelve_data,polygon,alpha_vantage,yahoo' }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'GHAZI Market Radar 207104176+GHAZMOTIEBIPRO@users.noreply.github.com' }}
      OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
      FREE_SWING_MODE: "true"
      MIN_DTE: "14"
      MAX_DTE: "60"
      MIN_OPTION_VOLUME: "200"
      MIN_OPEN_INTEREST: "100"
      MAX_SPREAD_PCT: "0.15"
      MIN_ABS_DELTA: "0.30"
      MAX_ABS_DELTA: "0.60"
      MIN_VOL_TO_OI_RATIO: "1.50"
      HIGH_ACCUMULATION_RATIO: "3.00"
      MIN_VOLUME_SPIKE_RATIO: "2.00"
      FLOW_REQUIRE_VOLUME_SPIKE: "false"
      FLOW_HISTORY_MAX_CONTRACTS: "45"
      FLOW_HISTORY_WORKERS: "3"
      FLOW_HISTORY_LOOKBACK_DAYS: "14"
      FLOW_TOP_PER_SIDE: "15"
      MODEL_VERSION: "2026.08-omega-reengineering"
      MAX_UNIVERSE_SIZE: "150"
      CALIBRATION_MINIMUM_SAMPLE: "100"
      OUTCOME_MAX_AGE_DAYS: "60"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Probe SEC full-text evidence
        continue-on-error: true
        run: python scripts/prime_sec_efts.py

      - name: Generate full radar without publishing
        run: python run_live_export.py --top-stocks 15 --top-options 15

      - name: Apply evidence tiers and SPX 0DTE
        run: python scripts/apply_phase62.py

      - name: Apply expiry identity OCC and Omega
        run: python scripts/apply_expiry_radar.py

      - name: Validate exported Omega contract
        run: python scripts/validate_omega_export.py public/data/latest.json

      - name: Emit integration summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('public/data/latest.json').read_text(encoding='utf-8'))
          print(json.dumps({
              'generated_at': data.get('generated_at'),
              'health': data.get('health'),
              'data_status': data.get('data_status'),
              'omega_summary': data.get('omega', {}).get('summary', {}),
              'omega_validation': data.get('omega', {}).get('validation', {}),
              'expiry_summary': data.get('expiry_radar', {}).get('summary', {}),
              'sec_incremental_metrics': data.get('sec_incremental_metrics', {}),
              'errors': data.get('errors', {}),
          }, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omega-integration-dry-run
          retention-days: 14
          path: |
            public/data/latest.json
            public/data/health.json
            public/data/data-status.json
            data/cache/sec_incremental_status.json
            data/cache/sec_processed_accessions.json
            data/live/*.json
            data/live/*.jsonl
          if-no-files-found: ignore
