name: BLACK BOX Omega Actions Housekeeping

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actions-housekeeping.yml"
      - "scripts/prune_actions_artifacts.py"
  schedule:
    - cron: "33 */4 * * *"

concurrency:
  group: black-box-omega-actions-housekeeping
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  YAHOO_AUTOMATED_ACCESS_APPROVED: ${{ vars.YAHOO_AUTOMATED_ACCESS_APPROVED || 'false' }}
  NASDAQ_WEB_AUTOMATION_APPROVED: ${{ vars.NASDAQ_WEB_AUTOMATION_APPROVED || 'false' }}
  OCC_MARKET_DATA_AUTOMATION_APPROVED: ${{ vars.OCC_MARKET_DATA_AUTOMATION_APPROVED || 'false' }}
  NASDAQTRADER_AUTOMATION_APPROVED: ${{ vars.NASDAQTRADER_AUTOMATION_APPROVED || 'false' }}
  FINRA_API_AUTOMATION_APPROVED: ${{ vars.FINRA_API_AUTOMATION_APPROVED || 'false' }}
  FRED_AUTOMATION_APPROVED: ${{ vars.FRED_AUTOMATION_APPROVED || 'false' }}
  BLS_AUTOMATION_APPROVED: ${{ vars.BLS_AUTOMATION_APPROVED || 'false' }}
  GOOGLE_NEWS_AUTOMATION_APPROVED: ${{ vars.GOOGLE_NEWS_AUTOMATION_APPROVED || 'false' }}
  PRESS_WIRE_RSS_APPROVED: ${{ vars.PRESS_WIRE_RSS_APPROVED || 'false' }}

jobs:
  prune-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ACTIONS_ARTIFACT_KEEP_PER_NAME: "3"
      ACTIONS_ARTIFACT_MIN_AGE_HOURS: "1"
      ACTIONS_ARTIFACT_MAX_DELETIONS: "400"
      ACTIONS_ARTIFACT_DRY_RUN: "false"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Prune duplicate historical artifacts
        run: python scripts/prune_actions_artifacts.py
