name: GHAZI Options hunter (owner-private, indicative chains)

# scripts/run_options_hunter.py: Alpaca indicative chains (SPXW/NDXP weeklies, SPY, QQQ, leaders),
# prior-session OI, existing option_explosion score, best per DTE bucket. Owner's private chat only,
# only when the top set changes. A push on a branch runs a dry run (log counts, no delivery).
on:
  workflow_dispatch:
  push:
    paths:
      - "options_radar/alpaca_chain.py"
      - "scripts/run_options_hunter.py"
      - ".github/workflows/options-hunter.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: ghazi-options-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_INTERNAL_DATA_USE_AUTHORIZED: ${{ vars.ALPACA_INTERNAL_DATA_USE_AUTHORIZED || 'false' }}
      ALPACA_PRIVATE_ALERTS_AUTHORIZED: ${{ vars.ALPACA_PRIVATE_ALERTS_AUTHORIZED || 'false' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}  # read-only run history for stateless dedupe (actions: read)
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      TELEGRAM_OWNER_USERNAME: ${{ vars.TELEGRAM_OWNER_USERNAME }}
      OPTIONS_HUNTER_DRY_RUN: ${{ github.event_name == 'push' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: bot-state
          path: state
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt
      - name: Hunt (owner-private delivery; dry run on push)
        run: |
          cd app
          python -m scripts.run_options_hunter
