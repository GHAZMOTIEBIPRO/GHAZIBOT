name: GHAZI Options hunter (owner-private, indicative chains)

# scripts/run_options_hunter.py: Alpaca indicative chains (SPXW/NDXP weeklies, SPY, QQQ, leaders),
# prior-session OI, existing option_explosion score, best per DTE bucket. Owner's private chat only,
# only when the top set changes. A push on a branch runs a dry run (log counts, no delivery).
on:
  workflow_dispatch:
  push:
    paths:
      - "options_radar/alpaca_chain.py"
      - "scripts/run_options_hunter.py"
      - ".github/workflows/options-hunter.yml"

permissions:
  contents: write

concurrency:
  group: ghazi-options-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_INTERNAL_DATA_USE_AUTHORIZED: ${{ vars.ALPACA_INTERNAL_DATA_USE_AUTHORIZED || 'false' }}
      ALPACA_PRIVATE_ALERTS_AUTHORIZED: ${{ vars.ALPACA_PRIVATE_ALERTS_AUTHORIZED || 'false' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      TELEGRAM_OWNER_USERNAME: ${{ vars.TELEGRAM_OWNER_USERNAME }}
      OPTIONS_HUNTER_DRY_RUN: ${{ github.event_name == 'push' && 'true' || 'false' }}
      STATE_DIR: ../state/state/options_hunter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: bot-state
          path: state
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt
      - name: Hunt (owner-private delivery; dry run on push)
        run: |
          cd app
          python -m scripts.run_options_hunter
      - name: Store the keyed hash of the last top set
        if: env.OPTIONS_HUNTER_DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd state
          git config user.name "GHAZI Options Hunter"
          git config user.email "GHAZMOTIEBIPRO@users.noreply.github.com"
          if [[ ! -f state/options_hunter/last_top.json ]]; then exit 0; fi
          git add state/options_hunter/last_top.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "state: options hunter top-set hash [skip ci]"
          for attempt in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin bot-state && git push origin HEAD:bot-state; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2 + RANDOM % 5))
          done
          exit 1
