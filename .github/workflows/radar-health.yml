name: BLACK BOX Omega Radar Health

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 13-22 * * 1-5"

concurrency:
  group: black-box-omega-radar-health
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telegram dependency
        run: pip install 'requests>=2.32,<3.0'

      - name: Restore centralized Telegram destination
        if: env.TELEGRAM_CHAT_ID == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p telegram_runtime
          for workflow in telegram-connection-keeper.yml radar-health.yml stock-telegram-alerts.yml options-telegram-alerts.yml cross-confirmation.yml telegram-alerts.yml; do
            for run_id in $(gh run list --workflow "$workflow" --status success --branch main --limit 8 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              rm -f telegram_runtime/connection.enc telegram_runtime/connection.json
              if gh run download "$run_id" -n telegram-connection -D telegram_runtime >/dev/null 2>&1; then
                [[ -s telegram_runtime/connection.enc ]] && break 2
              fi
            done
          done
          if [[ -s telegram_runtime/connection.enc && -n "$TELEGRAM_BOT_TOKEN" ]]; then
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in telegram_runtime/connection.enc \
              -out telegram_runtime/connection.json \
              -pass env:TELEGRAM_BOT_TOKEN || rm -f telegram_runtime/connection.json
          fi

      - name: Resolve Telegram destination
        run: python scripts/telegram_connection_bootstrap.py --connection-path telegram_runtime/connection.json

      - name: Restore latest health payloads
        id: payloads
        if: env.TELEGRAM_READY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .health/stocks .health/options
          stocks=false
          options=false
          for run_id in $(gh run list --workflow stock-radar.yml --status success --branch main --limit 6 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            rm -rf .health/stocks && mkdir -p .health/stocks
            if gh run download "$run_id" -n independent-stock-radar -D .health/stocks >/dev/null 2>&1; then
              [[ -s .health/stocks/stocks_latest.json ]] && stocks=true && break
            fi
          done
          for run_id in $(gh run list --workflow options-research-enrichment.yml --status success --branch main --limit 6 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            rm -rf .health/options && mkdir -p .health/options
            if gh run download "$run_id" -n independent-options-research -D .health/options >/dev/null 2>&1; then
              [[ -s .health/options/options_latest.json ]] && options=true && break
            fi
          done
          echo "stocks=$stocks" >> "$GITHUB_OUTPUT"
          echo "options=$options" >> "$GITHUB_OUTPUT"

      - name: Restore radar health state
        if: env.TELEGRAM_READY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/live .health-state
          for run_id in $(gh run list --workflow radar-health.yml --status success --branch main --limit 8 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            rm -rf .health-state && mkdir -p .health-state
            if gh run download "$run_id" -n radar-health-state -D .health-state >/dev/null 2>&1; then
              cp -f .health-state/radar_health_state.json data/live/radar_health_state.json 2>/dev/null || true
              break
            fi
          done

      - name: Check stock health transition
        if: env.TELEGRAM_READY == 'true' && steps.payloads.outputs.stocks == 'true'
        run: >-
          python scripts/send_radar_health.py
          --path stocks
          --payload .health/stocks/stocks_latest.json
          --state data/live/radar_health_state.json

      - name: Check options health transition
        if: env.TELEGRAM_READY == 'true' && steps.payloads.outputs.options == 'true'
        run: >-
          python scripts/send_radar_health.py
          --path options
          --payload .health/options/options_latest.json
          --state data/live/radar_health_state.json

      - name: Upload radar health state
        if: env.TELEGRAM_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: radar-health-state
          path: data/live/radar_health_state.json
          if-no-files-found: warn
          retention-days: 30
