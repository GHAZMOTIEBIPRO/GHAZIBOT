name: BLACK BOX Omega Stock Telegram Alerts

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "BLACK BOX Omega Stock Radar"
    types: [completed]

concurrency:
  group: black-box-omega-stock-telegram
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  notify-stock:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      STOCK_ALERT_MIN_SCORE: ${{ secrets.STOCK_ALERT_MIN_SCORE || '72' }}
      STOCK_ALERT_MAX: ${{ secrets.STOCK_ALERT_MAX || '3' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telegram dependency
        run: pip install 'requests>=2.32,<3.0'

      - name: Restore persistent Telegram destination
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p telegram_runtime
          for workflow in stock-telegram-alerts.yml options-telegram-alerts.yml telegram-alerts.yml fast-explosion-radar.yml; do
            for run_id in $(gh run list --workflow "$workflow" --status success --branch main --limit 12 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              rm -f telegram_runtime/connection.enc telegram_runtime/connection.json
              if gh run download "$run_id" -n telegram-connection -D telegram_runtime >/dev/null 2>&1; then
                [[ -s telegram_runtime/connection.enc ]] && break 2
              fi
            done
          done
          if [[ -s telegram_runtime/connection.enc && -n "$TELEGRAM_BOT_TOKEN" ]]; then
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in telegram_runtime/connection.enc \
              -out telegram_runtime/connection.json \
              -pass env:TELEGRAM_BOT_TOKEN || rm -f telegram_runtime/connection.json
          fi

      - name: Resolve Telegram destination
        run: python scripts/telegram_connection_bootstrap.py --connection-path telegram_runtime/connection.json

      - name: Restore independent stock payload
        if: env.TELEGRAM_READY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .stock-payload data/live
          current=""
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            current="${{ github.event.workflow_run.id }}"
          fi
          if [[ -n "$current" ]]; then
            gh run download "$current" -n independent-stock-radar -D .stock-payload || true
          fi
          if [[ ! -s .stock-payload/stocks_latest.json ]]; then
            for run_id in $(gh run list --workflow stock-radar.yml --status success --branch main --limit 6 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              rm -rf .stock-payload && mkdir -p .stock-payload
              if gh run download "$run_id" -n independent-stock-radar -D .stock-payload >/dev/null 2>&1; then
                [[ -s .stock-payload/stocks_latest.json ]] && break
              fi
            done
          fi
          test -s .stock-payload/stocks_latest.json

      - name: Restore stock Telegram state
        if: env.TELEGRAM_READY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .stock-state
          for run_id in $(gh run list --workflow stock-telegram-alerts.yml --status success --branch main --limit 8 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            rm -rf .stock-state && mkdir -p .stock-state
            if gh run download "$run_id" -n stock-telegram-state -D .stock-state >/dev/null 2>&1; then
              if [[ -s .stock-state/stock_alert_state.json ]]; then
                cp .stock-state/stock_alert_state.json data/live/stock_alert_state.json
                break
              fi
            fi
          done

      - name: Send stock-only Arabic alerts
        if: env.TELEGRAM_READY == 'true'
        run: >-
          python scripts/send_independent_path_alerts.py
          --path stocks
          --payload .stock-payload/stocks_latest.json
          --state data/live/stock_alert_state.json

      - name: Upload stock Telegram state
        if: env.TELEGRAM_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stock-telegram-state
          path: data/live/stock_alert_state.json
          if-no-files-found: error
          retention-days: 30

      - name: Seal Telegram destination
        if: always() && env.TELEGRAM_READY == 'true'
        shell: bash
        run: |
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in telegram_runtime/connection.json \
            -out telegram_runtime/connection.enc \
            -pass env:TELEGRAM_BOT_TOKEN
          rm -f telegram_runtime/connection.json

      - name: Upload encrypted Telegram destination
        if: always() && env.TELEGRAM_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-connection
          path: telegram_runtime/connection.enc
          if-no-files-found: error
          retention-days: 90
