name: BLACK BOX Omega Stock Telegram Alerts - Manual Fallback

# Production delivery now happens directly inside stock-radar.yml after the
# stock payload passes validation. This workflow is intentionally manual-only
# so it cannot add a second workflow_run queue hop or duplicate a direct alert.

on:
  workflow_dispatch:

concurrency:
  group: black-box-omega-stock-telegram-fallback
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  notify-stock-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      STOCK_ALERT_MIN_SCORE: ${{ secrets.STOCK_ALERT_MIN_SCORE || '72' }}
      STOCK_ALERT_MAX: ${{ secrets.STOCK_ALERT_MAX || '3' }}
      STOCK_PAYLOAD_MAX_AGE_MINUTES: ${{ secrets.STOCK_PAYLOAD_MAX_AGE_MINUTES || '90' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telegram and exchange-calendar dependencies
        run: pip install 'requests>=2.32,<3.0' 'exchange-calendars>=4.5,<5.0'

      - name: Check U.S. stock market activity window before fallback alert
        id: market_day
        shell: bash
        run: python scripts/market_clock_gate.py --mode extended >> "$GITHUB_OUTPUT"

      - name: Restore centralized Telegram destination
        if: steps.market_day.outputs.open == 'true' && env.TELEGRAM_CHAT_ID == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p telegram_runtime
          for workflow in telegram-connection-keeper.yml stock-radar.yml stock-telegram-alerts.yml; do
            for run_id in $(gh run list --workflow "$workflow" --status success --branch main --limit 8 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              rm -f telegram_runtime/connection.enc telegram_runtime/connection.json
              if gh run download "$run_id" -n telegram-connection -D telegram_runtime >/dev/null 2>&1; then
                [[ -s telegram_runtime/connection.enc ]] && break 2
              fi
            done
          done
          if [[ -s telegram_runtime/connection.enc && -n "$TELEGRAM_BOT_TOKEN" ]]; then
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in telegram_runtime/connection.enc \
              -out telegram_runtime/connection.json \
              -pass env:TELEGRAM_BOT_TOKEN || rm -f telegram_runtime/connection.json
          fi

      - name: Resolve Telegram destination
        if: steps.market_day.outputs.open == 'true'
        run: python scripts/telegram_connection_bootstrap.py --connection-path telegram_runtime/connection.json

      - name: Restore latest validated stock payload
        if: steps.market_day.outputs.open == 'true' && env.TELEGRAM_READY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .stock-payload data/live
          for run_id in $(gh run list --workflow stock-radar.yml --status success --branch main --limit 6 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
            rm -rf .stock-payload && mkdir -p .stock-payload
            if gh run download "$run_id" -n independent-stock-radar -D .stock-payload >/dev/null 2>&1; then
              [[ -s .stock-payload/stocks_latest.json ]] && break
            fi
          done
          test -s .stock-payload/stocks_latest.json
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = json.loads(Path('.stock-payload/stocks_latest.json').read_text(encoding='utf-8'))
          raw = str(payload.get('generated_at') or '').replace('Z', '+00:00')
          if not raw:
              raise SystemExit('Stock payload has no generated_at; fallback send blocked.')
          stamp = datetime.fromisoformat(raw)
          if stamp.tzinfo is None:
              stamp = stamp.replace(tzinfo=timezone.utc)
          age = (datetime.now(timezone.utc) - stamp.astimezone(timezone.utc)).total_seconds() / 60.0
          maximum = float(os.getenv('STOCK_PAYLOAD_MAX_AGE_MINUTES', '90'))
          if age < -5 or age > maximum:
              raise SystemExit(f'Stock payload age {age:.1f}m exceeds safe maximum {maximum:.1f}m; fallback blocked.')
          print(f'Fresh stock payload accepted for manual fallback: age={age:.1f}m')
          PY

      - name: Restore latest direct stock Telegram state
        if: steps.market_day.outputs.open == 'true' && env.TELEGRAM_READY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/live .stock-state
          printf '{"sent":{}}\n' > data/live/stock_alert_state.json
          for workflow in stock-radar.yml stock-telegram-alerts.yml; do
            for run_id in $(gh run list --workflow "$workflow" --status success --branch main --limit 8 --json databaseId --jq '.[].databaseId' 2>/dev/null || true); do
              rm -rf .stock-state && mkdir -p .stock-state
              if gh run download "$run_id" -n stock-telegram-state -D .stock-state >/dev/null 2>&1; then
                if [[ -s .stock-state/stock_alert_state.json ]]; then
                  cp .stock-state/stock_alert_state.json data/live/stock_alert_state.json
                  break 2
                fi
              fi
            done
          done

      - name: Send manual fallback stock alert
        if: steps.market_day.outputs.open == 'true' && env.TELEGRAM_READY == 'true'
        run: >-
          python -m scripts.send_independent_path_alerts
          --path stocks
          --payload .stock-payload/stocks_latest.json
          --state data/live/stock_alert_state.json

      - name: Upload fallback stock Telegram state
        if: always() && steps.market_day.outputs.open == 'true' && env.TELEGRAM_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stock-telegram-state
          path: data/live/stock_alert_state.json
          if-no-files-found: warn
          retention-days: 30

      - name: Closed-market status
        if: steps.market_day.outputs.open != 'true'
        run: echo "Manual stock Telegram fallback skipped because the U.S. stock activity window is closed."
