name: GHAZI Small-cap scan (owner-private, Alpaca IEX)

# scripts/run_smallcap_scan.py: listed universe -> IEX snapshots -> stages through the existing
# microcap_hunter score; Telegram only for a first detection or a stage upgrade; post-close forward
# moves recomputed at run time. Nothing restricted is stored, encrypted or not: bot-state gets keyed tags
# under the independent secret GHAZI_STATE_HMAC_KEY and an alert count (options_radar/state_keys.py). Dispatched by the orchestrator; a push runs a dry run (counts only).
on:
  workflow_dispatch:
  push:
    paths:
      - "options_radar/smallcap_scan.py"
      - "scripts/run_smallcap_scan.py"
      - ".github/workflows/smallcap-scan.yml"

permissions:
  contents: write

concurrency:
  group: ghazi-smallcap-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_INTERNAL_DATA_USE_AUTHORIZED: ${{ vars.ALPACA_INTERNAL_DATA_USE_AUTHORIZED || 'false' }}
      ALPACA_PRIVATE_ALERTS_AUTHORIZED: ${{ vars.ALPACA_PRIVATE_ALERTS_AUTHORIZED || 'false' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GHAZI_STATE_HMAC_KEY: ${{ secrets.GHAZI_STATE_HMAC_KEY }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      TELEGRAM_OWNER_USERNAME: ${{ vars.TELEGRAM_OWNER_USERNAME }}
      SCAN_ARGS: ${{ github.event_name == 'push' && 'scan --dry-run' || 'auto' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: bot-state
          path: state
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt
      - name: Scan or post-close review (owner-private)
        run: |
          cd app
          python -m scripts.run_smallcap_scan $SCAN_ARGS
      - name: Store keyed tags and counts (no restricted data)
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd state
          git config user.name "GHAZI Small-cap Scan"
          git config user.email "GHAZMOTIEBIPRO@users.noreply.github.com"
          git add state/smallcaps/*.tags.json state/smallcaps/*.postclose.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "state: small-cap keyed tags and counts [skip ci]"
          for attempt in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin bot-state && git push origin HEAD:bot-state; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2 + RANDOM % 5))
          done
          exit 1
