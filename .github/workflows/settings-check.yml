name: GHAZI Settings Check (no values)

# Which repository secrets and variables reach a job, and whether they work,
# without printing any value: presence, value class, Telegram chat types,
# an Alpaca HTTP status only when the owner attestation is recorded.
on:
  workflow_dispatch:
  push:
    branches:
      - "ccr-**"
    paths:
      - "scripts/check_settings.py"
      - ".github/workflows/settings-check.yml"
      - ".github/actions/resolve-telegram-broadcast/**"

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CHAT_ID_SECRET_SET: ${{ secrets.TELEGRAM_CHAT_ID != '' }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      TELEGRAM_OWNER_USERNAME: ${{ vars.TELEGRAM_OWNER_USERNAME }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_INTERNAL_DATA_USE_AUTHORIZED: ${{ vars.ALPACA_INTERNAL_DATA_USE_AUTHORIZED }}
      ALPACA_PRIVATE_ALERTS_AUTHORIZED: ${{ vars.ALPACA_PRIVATE_ALERTS_AUTHORIZED }}
      ALPACA_BARS_FEED: ${{ vars.ALPACA_BARS_FEED }}
      ALPACA_HISTORICAL_SIP_INTERNAL_AUTHORIZED: ${{ vars.ALPACA_HISTORICAL_SIP_INTERNAL_AUTHORIZED }}
      # FINRA: presence only; the credentials themselves never enter this job.
      FINRA_API_CLIENT_ID_SECRET_SET: ${{ secrets.FINRA_API_CLIENT_ID != '' }}
      FINRA_API_CLIENT_SECRET_SECRET_SET: ${{ secrets.FINRA_API_CLIENT_SECRET != '' }}
      FINRA_API_AUTOMATION_APPROVED: ${{ vars.FINRA_API_AUTOMATION_APPROVED }}
      # Other provider keys: presence only, the values never enter this job.
      ALPHA_VANTAGE_API_KEY_SECRET_SET: ${{ secrets.ALPHA_VANTAGE_API_KEY != '' }}
      TIINGO_API_KEY_SECRET_SET: ${{ secrets.TIINGO_API_KEY != '' }}
      TWELVE_DATA_API_KEY_SECRET_SET: ${{ secrets.TWELVE_DATA_API_KEY != '' }}
      FINNHUB_API_KEY_SECRET_SET: ${{ secrets.FINNHUB_API_KEY != '' }}
      POLYGON_API_KEY_SECRET_SET: ${{ secrets.POLYGON_API_KEY != '' }}
      TRADIER_TOKEN_SECRET_SET: ${{ secrets.TRADIER_TOKEN != '' }}
      MARKETDATA_TOKEN_SECRET_SET: ${{ secrets.MARKETDATA_TOKEN != '' }}
      INTRINIO_API_KEY_SECRET_SET: ${{ secrets.INTRINIO_API_KEY != '' }}
      FRED_API_KEY_SECRET_SET: ${{ secrets.FRED_API_KEY != '' }}
      SEC_USER_AGENT_SECRET_SET: ${{ secrets.SEC_USER_AGENT != '' }}
      OPENFDA_API_KEY_SECRET_SET: ${{ secrets.OPENFDA_API_KEY != '' }}
      BENZINGA_TOKEN_SECRET_SET: ${{ secrets.BENZINGA_TOKEN != '' }}
      FILINGPULSE_API_KEY_SECRET_SET: ${{ secrets.FILINGPULSE_API_KEY != '' }}
      ALPHA_VANTAGE_NON_DISPLAY_USE_AUTHORIZED: ${{ vars.ALPHA_VANTAGE_NON_DISPLAY_USE_AUTHORIZED }}
      TIINGO_NON_DISPLAY_USE_AUTHORIZED: ${{ vars.TIINGO_NON_DISPLAY_USE_AUTHORIZED }}
      TWELVE_DATA_NON_DISPLAY_USE_AUTHORIZED: ${{ vars.TWELVE_DATA_NON_DISPLAY_USE_AUTHORIZED }}
      POLYGON_NON_DISPLAY_USE_AUTHORIZED: ${{ vars.POLYGON_NON_DISPLAY_USE_AUTHORIZED }}
      TRADIER_INTERNAL_DATA_USE_AUTHORIZED: ${{ vars.TRADIER_INTERNAL_DATA_USE_AUTHORIZED }}
      FRED_AUTOMATION_APPROVED: ${{ vars.FRED_AUTOMATION_APPROVED }}
      DATA_TERMS_CONFIRMED: ${{ vars.DATA_TERMS_CONFIRMED }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "requests>=2.32,<3"
      - name: Resolve the broadcast destination as the notifiers do
        uses: ./app/.github/actions/resolve-telegram-broadcast
      - name: Check (presence, types and HTTP statuses only)
        run: python app/scripts/check_settings.py telegram_runtime/connection.json
