name: BLACK BOX Omega Structural Explosion Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/structural_ping.txt"
  schedule:
    - cron: "20 12 * * 1-5"

concurrency:
  group: black-box-omega-structural
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STRUCTURAL_MAX_PROFILES: "90"
      STRUCTURAL_MAX_OUTPUT: "45"
      STRUCTURAL_PROFILE_WORKERS: "5"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install market dependencies
        run: pip install -r requirements.txt

      - name: Discover RGC/BNAI-style structural candidates across US market
        run: python scripts/refresh_structural_universe.py

      - name: Persist structural universe
        shell: bash
        run: |
          git config user.name "black-box-omega-bot"
          git config user.email "actions@users.noreply.github.com"
          files=()
          [[ -f data/universe.txt ]] && files+=(data/universe.txt)
          [[ -f data/cache/structural_microfloat_candidates.json ]] && files+=(data/cache/structural_microfloat_candidates.json)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No structural files generated."
            exit 0
          fi
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "Structural universe unchanged."
          else
            git commit -m "data: refresh RGC/BNAI structural universe"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Dispatch main deep radar on refreshed structural universe
        id: deep
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before="$(gh run list --workflow options-radar.yml --event workflow_dispatch --branch main --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run options-radar.yml --ref main
          run_id=""
          for attempt in {1..20}; do
            sleep 3
            latest="$(gh run list --workflow options-radar.yml --event workflow_dispatch --branch main --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [[ -n "$latest" && "$latest" != "0" && "$latest" != "$before" ]]; then
              run_id="$latest"
              break
            fi
          done
          if [[ -z "$run_id" ]]; then
            echo "Could not resolve newly dispatched deep-radar run id."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Deep radar run id: $run_id"

      - name: Wait for deep radar to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch "${{ steps.deep.outputs.run_id }}" --exit-status --interval 10

      - name: Dispatch Telegram alerts on refreshed deep-radar payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run telegram-alerts.yml --ref main
