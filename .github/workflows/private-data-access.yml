name: GHAZI Private Market Data Access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/preflight_tradier_free_live.py
      - scripts/run_alpaca_private_probe.py
      - .github/workflows/private-data-access.yml

permissions:
  contents: read

concurrency:
  group: ghazi-private-market-data-access
  cancel-in-progress: false

jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal HTTP client
        run: python -m pip install 'requests>=2.32,<3'
      - name: Verify private Tradier access without publishing market data
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL || 'https://sandbox.tradier.com' }}
          TRADIER_INTERNAL_DATA_USE_AUTHORIZED: ${{ vars.TRADIER_INTERNAL_DATA_USE_AUTHORIZED || 'false' }}
        run: python -m scripts.preflight_tradier_free_live --soft-fail --output diagnostics/tradier-access.json
      - name: Verify private Alpaca IEX historical access
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_INTERNAL_DATA_USE_AUTHORIZED: ${{ vars.ALPACA_INTERNAL_DATA_USE_AUTHORIZED || 'false' }}
        run: python -m scripts.run_alpaca_private_probe --stock AAPL
      - name: Keep metadata-only diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: private-source-access-metadata
          path: diagnostics/tradier-access.json
          retention-days: 7
