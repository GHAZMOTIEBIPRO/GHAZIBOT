[project]
name = "ghazi-options-radar"
version = "1.1.0"
description = "Source-aware US stocks and options dashboard with evidence tracking"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["network: test opens real outbound connections (excluded from the hermetic suite)"]

[tool.ruff]
line-length = 100
target-version = "py310"
